<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>李家村万达 · 业绩看板</title>
<style>
:root{
  --bg:#0b0f16; --bg2:#111722; --card:#151c28; --card2:#1b2433;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#e8edf5; --tx2:#95a3b8; --tx3:#5f6e85;
  --red:#e8443a; --redDim:rgba(232,68,58,.13);
  --green:#22c55e; --greenDim:rgba(34,197,94,.13);
  --blue:#3b82f6; --blueDim:rgba(59,130,246,.13);
  --amber:#f59e0b; --amberDim:rgba(245,158,11,.13);
  --gray:#64748b;
  --r:14px;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  padding-bottom:calc(78px + var(--safeB));
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============ 顶栏 ============ */
.top{
  position:sticky;top:0;z-index:60;
  padding:calc(12px + var(--safeT)) 16px 12px;
  background:linear-gradient(180deg,#0f1520 0%,#0d121b 100%);
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:center;gap:10px}
.logo{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--red),#ff7a5c);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;
  box-shadow:0 3px 12px rgba(232,68,58,.35);
}
.top-t{flex:1;min-width:0}
.top-t h1{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{font-size:11px;color:var(--tx3);margin-top:2px}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);color:var(--tx2);
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;font-size:14px;
}
.icon-btn:active{background:rgba(255,255,255,.1)}

/* 时间进度条 */
.tp{margin-top:11px}
.tp-h{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-bottom:5px}
.tp-h b{color:var(--tx2);font-weight:600}
.tp-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.tp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .8s cubic-bezier(.22,1,.36,1)}

/* ============ 标签栏 ============ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:flex;background:rgba(13,18,27,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safeB);
}
.tab{
  flex:1;padding:9px 0 8px;text-align:center;cursor:pointer;
  color:var(--tx3);transition:color .18s;
}
.tab i{display:block;font-size:19px;line-height:1.25;font-style:normal;filter:grayscale(1) opacity(.55);transition:.18s}
.tab span{font-size:10px;font-weight:600;letter-spacing:.3px}
.tab.on{color:var(--red)}
.tab.on i{filter:none;transform:translateY(-1px)}

/* ============ 通用 ============ */
.wrap{padding:14px 14px 20px;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-left:1px}
.sec-h b{font-size:13px;font-weight:700;letter-spacing:.3px}
.sec-h .bar{width:3px;height:13px;border-radius:2px;background:var(--red)}
.sec-h .tail{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:26px 0;text-align:center;color:var(--tx3);font-size:12px}

/* ============ 上账时效提示条 ============ */
.lag-tip{
  display:flex;flex-direction:column;gap:3px;
  background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:10px;padding:9px 12px;margin-bottom:14px;
}
.lag-tip b{font-size:12px;color:var(--tx2);font-weight:600;line-height:1.5}
.lag-tip span{font-size:10.5px;color:var(--tx3);line-height:1.65}
.lag-tip.warn{border-left-color:var(--amber);background:var(--amberDim)}
.lag-tip.warn b{color:var(--amber)}

/* ============ 核心 KPI ============ */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 12px 11px;position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray)}
.kpi.s-done::after{background:var(--green)}
.kpi.s-over::after{background:var(--blue)}
.kpi.s-on::after{background:var(--amber)}
.kpi.s-low::after{background:var(--red)}
.kpi-l{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.kpi-v{font-size:21px;font-weight:800;margin:5px 0 3px;letter-spacing:-.4px}
.kpi-s{font-size:10.5px;color:var(--tx3)}
.kpi-r{
  position:absolute;right:10px;top:10px;font-size:11px;font-weight:800;
  padding:2px 6px;border-radius:6px;
}
.r-done{background:var(--greenDim);color:var(--green)}
.r-over{background:var(--blueDim);color:var(--blue)}
.r-on{background:var(--amberDim);color:var(--amber)}
.r-low{background:var(--redDim);color:var(--red)}
.r-na{background:rgba(100,116,139,.15);color:var(--gray)}
.kpi-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:8px;overflow:hidden}
.kpi-bar i{display:block;height:100%;border-radius:2px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.f-done{background:var(--green)} .f-over{background:var(--blue)}
.f-on{background:var(--amber)} .f-low{background:var(--red)}

/* ============ 品类行 ============ */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{padding:10px 12px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.row-t{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.row-n{font-size:13px;font-weight:600;flex:0 0 auto}
.row-v{font-size:12px;color:var(--tx2);margin-left:auto}
.row-v b{color:var(--tx);font-weight:700;font-size:13.5px}
.row-p{font-size:11px;font-weight:800;padding:1.5px 5px;border-radius:5px;flex:0 0 auto}
.row-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.row-bar i{display:block;height:100%;border-radius:2px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.row-bar .mk{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:rgba(255,255,255,.45);border-radius:1px}
.row-g{font-size:10.5px;color:var(--tx3);margin-top:5px;display:flex;justify-content:space-between}
.row-g em{font-style:normal;color:var(--red);font-weight:600}
.row.warn{background:linear-gradient(90deg,rgba(232,68,58,.07),transparent 60%)}

/* ============ 排行 ============ */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:16px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
  transition:.16s;white-space:nowrap;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 10px rgba(232,68,58,.3)}
.rk{
  display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  position:relative;overflow:hidden;cursor:pointer;transition:.16s;
}
.rk:active{transform:scale(.985)}
.rk-bg{position:absolute;left:0;top:0;bottom:0;opacity:.09;transition:width .9s cubic-bezier(.22,1,.36,1)}
.rk-no{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:0 0 auto;background:rgba(255,255,255,.06);color:var(--tx3);
  position:relative;z-index:1;
}
.rk-no.n1{background:linear-gradient(135deg,#f5c451,#e0a020);color:#3a2a00;box-shadow:0 2px 8px rgba(245,196,81,.3)}
.rk-no.n2{background:linear-gradient(135deg,#cdd6e2,#9aa8bb);color:#232c38}
.rk-no.n3{background:linear-gradient(135deg,#d9a273,#b57a49);color:#2e1c0c}
.rk-m{flex:1;min-width:0;position:relative;z-index:1}
.rk-n{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.rk-n .me{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--redDim);color:var(--red)}
.rk-sub{font-size:11px;color:var(--tx3);margin-top:3px}
.rk-r{text-align:right;flex:0 0 auto;position:relative;z-index:1}
.rk-r .p{font-size:17px;font-weight:800;letter-spacing:-.3px}
.rk-r .g{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* ============ 今日战报 ============ */
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.day{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:9px 8px;text-align:center;
}
.day-l{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-v{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.day-g{font-size:10px;margin-top:2px;font-weight:600}
.day.hit{border-color:rgba(34,197,94,.3);background:linear-gradient(180deg,rgba(34,197,94,.08),var(--card))}
.day.miss .day-g{color:var(--red)}
.day.ok .day-g{color:var(--green)}
.day.zero .day-v{color:var(--tx3)}

/* ============ QCS ============ */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.q-l{font-size:11px;color:var(--tx3);margin-bottom:5px}
.q-v{font-size:18px;font-weight:800;letter-spacing:-.3px}
.q-v small{font-size:11px;font-weight:600;color:var(--tx3);margin-left:3px}
.q-s{font-size:10.5px;color:var(--tx3);margin-top:4px;line-height:1.45}
.q-s em{font-style:normal;font-weight:600}
.q.wide{grid-column:span 2}

/* ============ 弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;
}
.mask.on{display:flex;animation:fade .2s}
.sheet{
  width:100%;max-height:88vh;overflow-y:auto;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
  padding:8px 18px calc(24px + var(--safeB));
  animation:up .32s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:4px}
.sheet .desc{font-size:12px;color:var(--tx3);line-height:1.6;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.fld input[type=text],.fld input[type=password]{
  width:100%;padding:11px 12px;border-radius:10px;font-size:13px;
  background:var(--card);border:1px solid var(--line2);color:var(--tx);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.fld input:focus{outline:none;border-color:var(--red)}
.fld .hint{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.5}
.drop{
  border:1.5px dashed var(--line2);border-radius:12px;padding:26px 14px;
  text-align:center;cursor:pointer;transition:.18s;background:var(--card);
}
.drop:active,.drop.hover{border-color:var(--red);background:var(--redDim)}
.drop .ic{font-size:30px;margin-bottom:7px}
.drop .t{font-size:13px;font-weight:600}
.drop .s{font-size:11px;color:var(--tx3);margin-top:4px}
.btn{
  width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;transition:.16s;margin-top:6px;
  font-family:inherit;
}
.btn-p{background:var(--red);color:#fff}
.btn-p:active{background:#c93a31}
.btn-p:disabled{background:#3a4152;color:var(--tx3);cursor:not-allowed}
.btn-g{background:var(--card2);color:var(--tx2);border:1px solid var(--line2)}
.log{
  margin-top:12px;padding:11px;border-radius:10px;background:#0a0e15;
  border:1px solid var(--line);font-size:11.5px;line-height:1.75;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
}
.log .ok{color:var(--green)} .log .er{color:var(--red)}
.log .wa{color:var(--amber)} .log .in{color:var(--tx3)}

/* ============ 其他 ============ */
.foot{text-align:center;font-size:10.5px;color:var(--tx3);padding:14px 0 4px;line-height:1.7}
.badge-live{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;
  color:var(--green);font-weight:600;
}
.badge-live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.toast{
  position:fixed;left:50%;top:calc(50% - 20px);transform:translate(-50%,-50%);
  background:rgba(20,26,37,.97);border:1px solid var(--line2);
  padding:13px 22px;border-radius:12px;font-size:13px;z-index:300;
  display:none;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:80vw;text-align:center;
}
.toast.on{display:block;animation:fade .2s}
@media(min-width:640px){
  .wrap{max-width:600px;margin:0 auto}
  .top{max-width:600px;margin:0 auto}
  .tabs{max-width:600px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0}
  .kpi-grid{grid-template-columns:repeat(4,1fr)}
  .day-grid{grid-template-columns:repeat(5,1fr)}
  .sheet{max-width:600px;margin:0 auto;border-radius:20px;align-self:center}
  .mask.on{align-items:center}
}
</style>
</head>
<body>
