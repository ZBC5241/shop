<!-- ===== 侧边栏：顶栏 + 标签导航（响应式容器） ===== -->
<div class="side" id="side">
  <header class="top">
    <div class="top-row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21V12h6v9"/></svg>
      </div>
      <div class="top-t">
        <h1 id="storeName">华为李家村万达授权体验店</h1>
        <p><span id="dataDate">--</span> · <span class="badge-live" id="liveTag">数据已更新</span></p>
      </div>
      <div class="icon-btn" id="btnRefresh" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </div>
      <div class="icon-btn" id="btnAdmin" title="更新数据">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.3-2.6h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>
      </div>
    </div>
    <div class="tp">
      <div class="tp-h">
        <span>本月时间进度</span>
        <span><b id="tpVal">--</b></span>
      </div>
      <div class="tp-bar"><div class="tp-fill" id="tpFill" style="width:0"></div></div>
    </div>

    <div class="mgr-chip" id="mgrChip"></div>
  </header>

  <nav class="tabs">
    <div class="tab on" data-v="store">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21V12h6v9"/></svg><span>门店</span>
    </div>
    <div class="tab" data-v="rank">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 4H4v2a3 3 0 0 0 3 3M17 4h3v2a3 3 0 0 1-3 3"/></svg><span>排行</span>
    </div>
    <div class="tab" data-v="person">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>个人</span>
    </div>
    <div class="tab" data-v="day">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>今日</span>
    </div>
    <div class="tab" data-v="insight">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span>洞察</span>
    </div>
    <div class="tab" data-v="qudao">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M4 10v9h16v-9M9 19v-5h6v5"/></svg><span>渠道</span>
    </div>
  </nav>
</div>

<!-- ===== 视图容器 ===== -->
<main id="app"></main>

<!-- ===== 管理弹层 ===== -->
<div class="mask" id="adminMask">
  <div class="sheet">
    <div class="grab"></div>
    <h3>更新数据</h3>
    <p class="desc">
      上传最新的《李家村X月任务进度.xlsx》，页面会自动解析并同步到线上，
      店员刷新即可看到新数据。<br>
      密钥只保存在你这台设备上，不会写进网页，别人看不到。
    </p>

    <div class="fld">
      <label>GitHub 访问密钥</label>
      <input type="password" id="tokenInput" placeholder="ghp_ 或 github_pat_ 开头" autocomplete="off">
      <div class="hint">只需填一次，之后自动记住。留空则只在本机预览，不同步线上。</div>
    </div>

    <div class="fld">
      <label>选择 Excel 文件</label>
      <div class="drop" id="dropZone">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3 3 3-3"/></svg>
        </div>
        <div class="t" id="dropTitle">点击选择文件</div>
        <div class="s" id="dropSub">或把 .xlsx 拖到这里</div>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>

    <button class="btn btn-p" id="btnParse" disabled>解析并更新</button>
    <button class="btn btn-g" id="btnClose">关闭</button>
    <div class="log" id="logBox" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
