function iaFollowupConversions(st){
  const recs=iaCustomerRecords(st), phones=recs.map(r=>iaNormalizePhone(r.phone)).filter(Boolean);
  const before=new Set((st.baseline&&st.baseline.saleKeys)||[]),sales=iaSalesContacts().filter(s=>!before.has(s.phone+'|'+s.code+'|'+s.product)),hits=[];
  phones.forEach(p=>sales.forEach(s=>{if(s.phone===p)hits.push(s);}));
  const seen=new Set();return hits.filter(x=>{const k=x.phone+'|'+x.code+'|'+x.product;if(seen.has(k))return false;seen.add(k);return true;});
}

function iaDefaultDue(task){
  const d=new Date();
  if(task.type==='followup'||(task.type==='employee'&&['outreach','verify'].includes(task.mode))) d.setMinutes(d.getMinutes()+(task.mode==='verify'?5:30));
  else if(task.type==='core'||(task.type==='employee'&&task.mode==='conversion')) d.setMinutes(d.getMinutes()+60);
  else if(task.type==='ops'){d.setHours(23,0,0,0); if(d.getTime()<Date.now()) d.setDate(d.getDate()+1);}
  else d.setMinutes(d.getMinutes()+90);
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function iaDueState(st){
  if(!st||!st.dueAt||['done'].includes(st.status)) return null;
  const t=new Date(st.dueAt).getTime(); if(!isFinite(t)) return null;
  const mins=Math.round((t-Date.now())/60000);
  return {over:mins<0,mins:mins,text:mins<0?('已超时 '+Math.abs(mins)+' 分钟'):('剩 '+mins+' 分钟')};
}

/* 客户漏斗：由所有结构化客户记录组成；手机号命中后续销售时自动升级为成交 */
function iaAllCustomerRecords(plan,date){
  const sales=iaSalesContacts(),arr=[];
  plan.forEach(t=>{
    const st=iaLoad(date,t.id),recs=iaCustomerRecords(st);
    recs.forEach(r=>{
      if(!String(r.name||r.phone||'').trim())return;
      const ph=iaNormalizePhone(r.phone),hits=ph?sales.filter(s=>s.phone===ph):[];
      arr.push(Object.assign({},r,{owner:t.owner,taskTitle:t.title,stage:hits.length?'成交':(r.stage||'未联系'),matched:hits[0]||null}));
    });
  });
  return arr;
}
function renderCustomerFunnel(plan,date){

  h+='<div class="ai-funnel-flow">'+stages.map((x,i)=>'<div class="ai-funnel-stage"><b>'+cnts[x]+'</b><span>'+x+'</span></div>'+(i<stages.length-1?'<span class="ai-funnel-arrow">›</span>':'')).join('')+'</div>';

  if(lost) h+='<div style="font-size:8.7px;color:var(--tx3);margin-top:6px">另有 '+lost+' 名客户已标记流失，可在闭店复盘中汇总真实流失原因。</div>';
  return h+'</div></section>';
}

/* ==========================================================
   V2.7 连续经营记忆版 · 经营闭环引擎
   核心升级：结果指标 + 过程漏斗 + 店长介入等级 + 客户机会优先级 + 动作效果四象限。
   不用黑盒综合分；所有判断都能回到可见证据。
   ========================================================== */
function iaRealityOne(date,name){
  const x=(iaRealityAll(date)[name]||{});
  return Object.assign({status:'未记录',receptions:0,experience:0,quotes:0,lost:0,note:'',updatedAt:''},x);
}
function v26ProcessTotals(activePeople,date){
  const z={receptions:0,experience:0,quotes:0,lost:0,records:0};
  (activePeople||[]).forEach(p=>{const s=iaRealityOne(date,p.name||p);z.receptions+=iaNum(s.receptions);z.experience+=iaNum(s.experience);z.quotes+=iaNum(s.quotes);z.lost+=iaNum(s.lost);if(s.status!=='未记录')z.records++;});
  const T=(DATA.insights&&DATA.insights.today)||{};z.salesRecords=iaNum(T.totalOrders);return z;
}
function v26ProcessBottleneck(activePeople,date){
  const z=v26ProcessTotals(activePeople,date);
  if(!z.records) return {key:'未知',title:'过程数据不足',text:'先补现场状态。销售底表只能看到结果，无法判断卡在客流、体验、方案还是成交。'};
  if(z.receptions===0) return {key:'接待',title:'当前主要问题更像客流/客户经营',text:'已补现场状态但接待为0。此时不该继续练成交话术，优先把空档转成客户触达、邀约和老客经营。'};
  if(z.experience < Math.max(1,z.receptions*.5)) return {key:'体验',title:'接待到深度体验转化偏弱',text:'有接待，但进入完整体验的组数偏少。店长先检查需求挖掘、产品上手和场景演示，而不是急着压报价。'};
  if(z.quotes < Math.max(1,z.experience*.65)) return {key:'方案',title:'体验到方案/报价环节偏弱',text:'客户已经体验，但没有充分进入明确方案。重点检查型号配置、权益、回收、预算和替代方案是否讲清楚。'};
  if(z.salesRecords===0 && z.quotes>0) return {key:'成交',title:'已经到报价，卡点更靠近异议与成交',text:'有报价但销售数据暂未响应。店长应参与异议处理/陪访，并记录价格、竞品、决策人、时机等真实阻碍。'};
  return {key:'质量',title:'过程链已经跑通，下一步提成交质量',text:'当前已有接待、体验、方案与销售响应。继续看毛利、增值、Care+、回收和生态连带，不再只追开单数量。'};
}
function iaEmployeeMode(name,date){
  const sig=iaRealityOne(date,name),sold=iaSoldRow(name),pd=iaPersonData(name),rec=iaNum(sig.receptions),exp=iaNum(sig.experience),quo=iaNum(sig.quotes),lost=iaNum(sig.lost);
  if(sig.status==='外出/休息') return {mode:'off',tag:'非营业状态',stage:'off',diagnosis:'已记录为外出/休息，不应因为“未开单”被误判。',action:'恢复在岗后重新更新现场状态。'};
  if(sig.status==='已成交待上账') return {mode:'verify',tag:'待核实上账',stage:'upload',diagnosis:'现场已记录成交，但销售数据暂未出现上账。先核实单据/上账链路，不要误判成销售能力问题。',action:'5分钟内核实单据与上账状态，完成后刷新经营数据。'};
  if(sold){const gaps=[];if(pd.phoneGap>0)gaps.push('手机还差'+pd.phoneGap+'台');if(pd.profitGap>0)gaps.push('毛利还差'+moneyShort(pd.profitGap));if(pd.valueGap>0)gaps.push('增值还差'+moneyShort(pd.valueGap));return {mode:'quality',tag:'已开单 · 继续提质',stage:'quality',diagnosis:'今日已经产生销售结果。'+(gaps.length?('个人日目标仍有缺口：'+gaps.join('、')+'。'):'当前更应关注成交质量而不是重复催开单。'),action:'下一笔成交执行二次价值检查，并记录客户拒绝点/可复制话术。'};}
  if(sig.status==='接待中') return {mode:'observe',tag:'正在接待',stage:'receiving',diagnosis:'当前正在接待，暂不追加新的拓客任务，避免干扰成交。',action:'接待结束后更新“体验/报价/成交或未成交”，系统再决定下一步。'};
  if(quo>0) return {mode:'conversion',tag:'报价后未成交',stage:'closing',diagnosis:'已经进入明确方案/报价，但销售端仍未出现结果，卡点更靠近价格异议、竞品比较、决策人或成交推进。',action:'复盘最近2组报价未成交客户；店长至少陪访/演练1组，记录真实异议和下一次改法。'};
  if(exp>0) return {mode:'conversion',tag:'体验后未进方案',stage:'solution',diagnosis:'客户已经有较深体验，但没有形成明确报价/购买方案，说明需求到方案的连接需要验证。',action:'复盘最近2组体验客户，补齐型号/配置/权益/回收/预算方案；下一组客户验证一版清晰方案。'};
  if(rec>=2) return {mode:'conversion',tag:'有接待 · 体验不足',stage:'experience',diagnosis:'已经接待多组客户，但深度体验记录不足。先检查需求挖掘、上手体验和场景演示，不要直接把问题归到价格。',action:'复盘最近2组接待，店长演示/陪访1组标准体验路径；记录客户在哪一步失去兴趣。'};

function renderV26EffectMatrix(plan,date){
  const a={good:[],method:[],exec:[],attrib:[]};plan.forEach(t=>{const s=iaLoad(date,t.id),r=s.baseline?iaResponse(t,s):{kind:'neutral'};if(s.status==='done'&&r.kind==='positive')a.good.push(t.title);else if(s.status==='done')a.method.push(t.title);else if(s.baseline&&r.kind==='positive')a.attrib.push(t.title);else a.exec.push(t.title);});
  const q=(cls,title,n,text,examples)=>'<div class="v26-quad '+cls+'"><div class="v26-quad-h"><b>'+title+'</b><span class="v26-quad-n">'+n+'</span></div><p>'+text+'</p><small>'+(examples.length?'例：'+iaEsc(examples.slice(0,2).join('、')):'当前暂无')+'</small></div>';

   +q('good','做了，而且结果响应',a.good.length,'进入可复制候选；仍需在相似场景再次验证，避免一次偶然就固化成打法。',a.good)
   +q('warn','做了，但结果没响应',a.method.length,'不要再机械催同一动作，下一轮转查客户质量、销售技能、商品/价格或方案问题。',a.method)
   +q('','还没有做到闭环',a.exec.length,'优先抓执行、证据和验收；动作没做之前，没有资格判断方法是否有效。',a.exec)
   +q('purple','结果变了，但动作未闭环',a.attrib.length,'只能说明同期数据变化，不能把结果直接归因给这项动作；先完成验收再判断。',a.attrib)
   +'</div><div class="v26-formal-note"><b>经营原则：</b>没执行 → 管执行；执行到位但没结果 → 管方法；执行和结果同时改善 → 做二次验证后再沉淀为门店打法。避免把相关性当因果。</div></div></section>';
}

/* 时间进度圆环：根据 tp 自动配色做提示警示
   tp<0.5（月初，时间充裕）紫色；0.5~0.75（月半将尽）橙色；>=0.75（接近月末）红色警示 */
function tpLevel(tp){
  if(!isNum(tp)) return {col:'#9aa0bd', level:0};
  if(tp < 0.5)  return {col:'#7c3aed', level:1};   /* 紫：正常 */
  if(tp < 0.75) return {col:'#f59e0b', level:2};   /* 橙：注意 */
  return {col:'#ef4444', level:3};                  /* 红：警示 */
}
function tpRingHTML(tp, size){
  size = size || 60;
  const r = (size - 12) / 2, c = 2 * Math.PI * r;
  const w = isNum(tp) ? Math.min(tp, 1) : 0, off = c * (1 - w);
  const lv = tpLevel(tp);
  const svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="rgba(30,28,60,.08)" stroke-width="9"/>'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="' + lv.col + '" stroke-width="9" stroke-linecap="round"'
    +   ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"'
    +   ' transform="rotate(-90 ' + (size/2) + ' ' + (size/2) + ')"'
    +   ' style="transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1),stroke 1s"/>'
    + '</svg>';
  const txt = isNum(tp) ? pct(tp, 1) : '—';
  return svg + '<b class="tp-ring-c" style="color:' + lv.col + '">' + txt + '</b>';
}

function loadRemote(silent){
  const url = CFG.dataFile + '?t=' + Date.now();
  const oldData = DATA;
  const oldSig = iaDataSignature(oldData);
  const keepY = (silent && VIEW==='insight') ? window.scrollY : 0;

  return fetch(url, {cache:'no-store'})

    .then(j => {
      if(j && j.meta && j.store && j.people){
        DATA = j;
        IA_LAST_REMOTE_AT = Date.now();
        const newSig = iaDataSignature(j);
        if(oldSig && newSig && oldSig!==newSig) iaRecordSystemEvent(iaDescribeDataChange(oldData,j));
        render();

        $('#liveTag').textContent = '数据已更新';

/* ==========================================================
   浏览器端 Excel 解析 —— 与 build_data.py 保持完全一致
   ========================================================== */
const SHEET_NAME = '李家村销售';
const PEOPLE_ORDER = ['邵乐乐','杨丽华','李泽','陈超磊','张博晨'];
const P1_ROWS = {'邵乐乐':4,'杨丽华':5,'李泽':6,'陈超磊':7,'张博晨':8}, P1_TOTAL = 9;
const P2_ROWS = {'邵乐乐':14,'杨丽华':15,'李泽':16,'陈超磊':17,'张博晨':18}, P2_TOTAL = 19;
const P3_ROWS = {'邵乐乐':28,'杨丽华':29,'李泽':30,'陈超磊':31,'张博晨':32}, P3_TOTAL = 33, P3_LABEL = 26;
const P4_ROWS = {'邵乐乐':38,'杨丽华':39,'李泽':40,'陈超磊':41}, P4_TOTAL = 42, P4_LABEL = 36;
const P1_BLOCKS = [['毛利',1],['手机',5],['PC',9],['平板',13],['穿戴',17],
                   ['音频',21],['HD',25],['智慧办公',29],['音频穿戴',33],['销额',37]];
const P1_SCORE = 41;

function xnum(v){
  if(v === null || v === undefined) return null;
  if(typeof v === 'number') return isFinite(v) ? v : null;
  if(typeof v === 'boolean') return null;
  if(v instanceof Date) return null;
  let s = String(v).trim();
  if(s === '' || s[0] === '#') return null;
  s = s.replace(/,/g,'').replace(/[¥￥]/g,'');
  const isPct = s.endsWith('%');
  if(isPct) s = s.slice(0,-1);
  const f = parseFloat(s);
  if(!isFinite(f)) return null;
  return isPct ? f/100 : f;
}
/* g(grid, 1-based行, 0-based列) */
function g(grid, row, col){
  const r = grid[row-1];
  if(!r) return null;
  return xnum(r[col]);
}
function g4(grid, row, col){
  return { task:g(grid,row,col), done:g(grid,row,col+1),
           gap:g(grid,row,col+2), rate:g(grid,row,col+3) };
}
function readPerf(grid, row){
  const d = {};
  P1_BLOCKS.forEach(([n,c]) => d[n] = g4(grid,row,c));
  d['绩效'] = g(grid,row,P1_SCORE);
  return d;
}
function readQcs(grid, row){
  const G = c => g(grid,row,c);
  return {
    '电信积分':  {task:G(1),done:G(2),gap:G(3),rate:G(4)},
    '会员搭售率':{terminal:G(5),care:G(6),gap:G(7),rate:G(8)},
    '回收搭售率':{orders:G(9),gap:G(10),rate:G(11)},
    '贴膜率':    {orders:G(12),gap:G(13),rate:G(14)},
    '考核机型':  {task:G(17),gap:G(18)},
    '乐回收':    {orders:G(19),amount:G(20),'增值':G(21)},
    '太力回收':  {orders:G(22),amount:G(23),'增值':G(24)},
    '增值':      {task:G(25),done:G(26),gap:G(27),rate:G(28)},
    '健康度':    {coupon:G(29),ratio:G(30),grossMargin:G(31),'增值率':G(32)},
    '星联会员':  {'优享':G(33),'尊享':G(34),'合计':G(35)}
  };
}
function readLabels(grid, labelRow, start, end){
  const r = grid[labelRow-1] || [];
  const out = [];
  for(let c = start; c < end; c++){
    const v = r[c];
    out.push(v === null || v === undefined || String(v).trim() === '' ? null : String(v).trim());
  }
  return out;
}
const DROP_KEYS = new Set(['摄影课']);
function readFlat(grid, row, labels, start){
  const d = {};
  labels.forEach((lab,i) => { if(lab && !DROP_KEYS.has(lab)) d[lab] = g(grid,row,start+i); });
  return d;
}

/* 渠道挂账：时间进度(B1/E1) + 合计行 + 逐人 */
function readQudao(grid){
  if(!grid || !grid.length) return null;
  const rawDate = (grid[0] || [])[1];
  let dateStr = '';
  if(rawDate instanceof Date){
    const p = n => String(n).padStart(2,'0');
    dateStr = rawDate.getFullYear() + '-' + p(rawDate.getMonth()+1) + '-' + p(rawDate.getDate());
  }else if(rawDate){
    dateStr = String(rawDate).trim().slice(0,10);
  }
  const tp = g(grid, 1, 4);   // E1 (0-based col 4)

  let hrow = null;
  for(let r = 1; r < Math.min(grid.length, 40); r++){
    const row = grid[r-1] || [];
    if(String(row[1] || '').trim() === '任务' && String(row[2] || '').trim() === '完成'){ hrow = r; break; }
  }
  if(!hrow) return null;

  const people = [];
  let total = null;
  for(let r = hrow + 1; r <= grid.length; r++){
    const cell0 = grid[r-1] ? grid[r-1][0] : null;
    if(cell0 === null || cell0 === undefined) continue;
    const name = String(cell0).trim();
    if(name === '') continue;
    if(name === '合计'){
      total = { task:g(grid,r,1), done:g(grid,r,2), gap:g(grid,r,3), rate:g(grid,r,4) };
      continue;
    }
    people.push({ name:name, task:g(grid,r,1), done:g(grid,r,2), gap:g(grid,r,3), rate:g(grid,r,4) });
  }
  return { timeDate:dateStr, timeRate:tp, total:total, people:people };
}

function parseWorkbook(ab, fileName){
  const wb = XLSX.read(ab, {type:'array', cellDates:true});
  if(wb.SheetNames.indexOf(SHEET_NAME) < 0)
    throw new Error('找不到工作表「' + SHEET_NAME + '」，该文件包含：' + wb.SheetNames.slice(0,8).join('、'));
  const ws = wb.Sheets[SHEET_NAME];
  const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true, blankrows:true});

  /* 结构校验：防止模板被改动导致静默错位 */
  const nameCol = r => { const x = grid[r-1]; return x && x[0] ? String(x[0]).trim() : ''; };
  const bad = [];
  PEOPLE_ORDER.forEach(n => {
    if(nameCol(P1_ROWS[n]) !== n) bad.push('业绩考核区第' + P1_ROWS[n] + '行应为「' + n + '」，实为「' + nameCol(P1_ROWS[n]) + '」');
    if(nameCol(P2_ROWS[n]) !== n) bad.push('全科生区第' + P2_ROWS[n] + '行应为「' + n + '」，实为「' + nameCol(P2_ROWS[n]) + '」');
  });
  if(nameCol(P1_TOTAL) !== '合计') bad.push('第' + P1_TOTAL + '行应为「合计」');
  if(bad.length) throw new Error('表格结构和预期不一致，为避免读出错数已中止：\n· ' + bad.slice(0,4).join('\n· '));

  /* 元信息 */
  let dateStr = '';
  const rawDate = (grid[0] || [])[1];
  if(rawDate instanceof Date){
    const p = n => String(n).padStart(2,'0');
    dateStr = rawDate.getFullYear() + '-' + p(rawDate.getMonth()+1) + '-' + p(rawDate.getDate());
  }else if(rawDate){
    dateStr = String(rawDate).trim().slice(0,10);
  }
  const tp = g(grid,1,8);
  const dayTitle = ((grid[24] || [])[1]) ? String(grid[24][1]).trim() : '';
  const d3 = readLabels(grid, P3_LABEL, 1, 15);
  const d4 = readLabels(grid, P4_LABEL, 1, 15);

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const out = {
    meta:{
      storeName:'华为李家村万达授权体验店',
      date:dateStr, dayTitle:dayTitle, timeProgress:tp,
      employees:PEOPLE_ORDER.slice(),
      sourceFile:fileName,
      generatedAt: now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
                 + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())
    },
    store:{
      performance: readPerf(grid, P1_TOTAL),
      qcs:         readQcs(grid, P2_TOTAL),
      dailyDone:   readFlat(grid, P3_TOTAL, d3, 1),
      dailyGap:    readFlat(grid, P4_TOTAL, d4, 1)
    },
    people:{}
  };
  PEOPLE_ORDER.forEach(n => {
    out.people[n] = {
      performance: readPerf(grid, P1_ROWS[n]),
      qcs:         readQcs(grid, P2_ROWS[n]),
      dailyDone:   readFlat(grid, P3_ROWS[n], d3, 1),
      dailyGap:    P4_ROWS[n] ? readFlat(grid, P4_ROWS[n], d4, 1) : {}
    };
  });

  /* 渠道挂账（独立 sheet） */
  const qdName = '渠道挂账';
  if(wb.SheetNames.indexOf(qdName) >= 0){
    const qdWs = wb.Sheets[qdName];
    const qdGrid = XLSX.utils.sheet_to_json(qdWs, {header:1, defval:null, raw:true, blankrows:true});
    out.qudao = readQudao(qdGrid);
  }

  return out;
}

/* ==========================================================
   GitHub 同步
   ========================================================== */
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for(let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(bin);
}

async function pushToGitHub(token, json, log){
  const api = 'https://api.github.com/repos/' + CFG.repo + '/contents/' + CFG.dataFile;
  const hd  = { 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' };

  log('连接 GitHub…', 'in');
  let sha = null;
  const gr = await fetch(api + '?ref=' + CFG.branch, {headers:hd, cache:'no-store'});
  if(gr.status === 200){
    sha = (await gr.json()).sha;
    log('找到现有 data.json', 'in');
  }else if(gr.status === 404){
    log('线上还没有 data.json，将新建', 'wa');
  }else if(gr.status === 401){
    throw new Error('密钥无效或已过期（401）');
  }else if(gr.status === 403){
    throw new Error('没有权限访问该仓库（403）');
  }else{
    throw new Error('读取失败：HTTP ' + gr.status);
  }

  const body = {
    message: '更新看板数据 ' + (json.meta.date || '') + ' via 看板上传',
    content: b64(JSON.stringify(json, null, 1)),
    branch : CFG.branch
  };
  if(sha) body.sha = sha;

  log('上传中…', 'in');
  const pr = await fetch(api, {method:'PUT', headers:hd, body:JSON.stringify(body)});
  if(!pr.ok){
    let msg = 'HTTP ' + pr.status;
    try{ const e = await pr.json(); if(e.message) msg += ' · ' + e.message; }catch(_){}
    throw new Error('上传失败：' + msg);
  }
  log('✓ 已同步到线上', 'ok');
  return true;
}

/* 动态加载 SheetJS（多源兜底，国内优先） */
const XLSX_CDNS = [
  'https://registry.npmmirror.com/xlsx/0.18.5/files/dist/xlsx.full.min.js',
  'https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js',
  'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
];
function loadXLSX(log){
  if(window.XLSX) return Promise.resolve();
  let i = 0;
  return new Promise((res, rej) => {
    const tryNext = () => {
      if(i >= XLSX_CDNS.length) return rej(new Error('解析组件加载失败，请检查网络后重试'));
      const url = XLSX_CDNS[i++];
      log('加载解析组件…（源 ' + i + '）', 'in');
      const s = document.createElement('script');
      s.src = url;
      s.onload  = () => window.XLSX ? res() : tryNext();
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}


/* ==========================================================
   交互：管理弹层 / 上传 / Toast
   ========================================================== */
let pickedFile = null;

function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('on'), ms || 1800);
}

function log(msg, type){
  const box = $('#logBox');
  box.style.display = 'block';
  const cls = type || 'in';
  box.innerHTML += '<span class="' + cls + '">' + esc(msg) + '</span>\n';
  box.scrollTop = box.scrollHeight;
}

/* 选文件 */
const dz = $('#dropZone'), fi = $('#fileInput');
dz.onclick = () => fi.click();
dz.ondragover = e => { e.preventDefault(); dz.classList.add('hover'); };
dz.ondragleave = () => dz.classList.remove('hover');
dz.ondrop = e => {
  e.preventDefault(); dz.classList.remove('hover');
  if(e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
fi.onchange = () => { if(fi.files.length) setFile(fi.files[0]); };

function setFile(f){
  if(!/\.xlsx?$/i.test(f.name)){ toast('请选择 .xlsx 文件'); return; }
  pickedFile = f;
  $('#dropTitle').textContent = f.name;
  $('#dropSub').textContent = (f.size/1024).toFixed(0) + ' KB · 点击可重选';
  $('#btnParse').disabled = false;
}

/* 解析 + 同步 */
$('#btnParse').onclick = async () => {
  if(!pickedFile) return;
  const btn = $('#btnParse');
  btn.disabled = true; btn.textContent = '处理中…';
  $('#logBox').innerHTML = '';

  try{
    await loadXLSX(log);
    log('读取文件…', 'in');
    const ab = await pickedFile.arrayBuffer();

    log('解析表格…', 'in');
    const json = parseWorkbook(ab, pickedFile.name);

    const gm = json.store.performance['毛利'];
    log('✓ 解析成功', 'ok');
    log('  数据日期 ' + (json.meta.date || '未知'), 'in');
    log('  时间进度 ' + (isNum(json.meta.timeProgress) ? pct(json.meta.timeProgress,1) : '—'), 'in');
    log('  门店毛利 ' + money(gm.done) + ' / ' + money(gm.task) + '（' + pct(gm.rate,1) + '）', 'in');
    PEOPLE_ORDER.forEach(n => {
      const p = json.people[n].performance['毛利'];
      log('  ' + n + '：' + money(p.done) + (hasTaskRaw(p) ? '' : '（未分配任务）'), 'in');
    });

    /* 先本地生效 */
    DATA = json;
    render();
    $('#liveTag').textContent = '仅当前设备';
    log('✓ 页面已刷新', 'ok');

    /* 同步线上 */
    const token = $('#tokenInput').value.trim();
    if(token){
      localStorage.setItem('gh_token', token);
      await pushToGitHub(token, json, log);
      $('#liveTag').textContent = '数据已更新';
      log('店员刷新页面即可看到新数据', 'ok');
      toast('已更新，店员刷新可见');
    }else{
      log('未填密钥，本次更新仅保存在当前设备，线上数据不会变化', 'wa');
      toast('仅在当前设备更新');
    }
  }catch(err){
    log('✗ ' + (err.message || err), 'er');
    toast('处理失败，看下方提示');
  }finally{
    btn.disabled = false; btn.textContent = '解析并更新';
  }
};

function hasTaskRaw(k){ return k && typeof k.task === 'number' && isFinite(k.task) && k.task !== 0; }

/* ==========================================================
   启动
   ========================================================== */
$('#actionClose').onclick = closeInsightAction;
$('#actionMask').onclick = e => { if(e.target === $('#actionMask')) closeInsightAction(); };
render();

/* 首次加载：若有目标已 100% 达成，撒一次彩带 */
(function celebrateIfAchieved(){
  const P = (DATA.store && DATA.store.performance) || {};
  const Q = (DATA.store && DATA.store.qcs) || {};
  const check = [P['销额'], P['毛利'], P['手机'], Q['增值']];
  const done = check.some(k => k && hasTask(k) && isNum(k.rate) && k.rate >= 1);
  if(done) setTimeout(() => confetti(90), 400);
})();

if(location.protocol === 'http:' || location.protocol === 'https:'){
  loadRemote(true);
}else{
  $('#liveTag').textContent = '本地文件';
}

<script id="ios26-v36-dynamic-material-engine">
/* 视觉材质引擎：仅更新 CSS 变量，不读取/修改业务数据，不接管任何按钮或导航。 */
(function(){
  const root=document.documentElement;
  let ticking=false,lastY=-1;
  function apply(){
    ticking=false;
    const y=Math.max(0,window.scrollY||document.documentElement.scrollTop||0);
    if(Math.abs(y-lastY)<1)return;
    lastY=y;
    const p=Math.min(1,y/720);
    const angle=128 + Math.sin(p*Math.PI)*7;
    root.style.setProperty('--lg-scroll',String(Math.round(y)));
    root.style.setProperty('--lg-angle',angle.toFixed(2)+'deg');
    root.style.setProperty('--lg-lift',(1 + Math.sin(p*Math.PI)*0.007).toFixed(4));
    root.classList.toggle('lg-scrolled',y>22);
    root.classList.toggle('lg-deep',y>360);
  }
  function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(apply)}}
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  apply();
})();
</script>
