<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>李家村万达华为 · 8月业绩看板</title>
<style>
:root{--blue:#4F8EF7;--blue-l:#DBEAFE;--purple:#8B5CF6;--purple-l:#EDE9FE;
  --green:#10B981;--green-l:#D1FAE5;--orange:#F59E0B;--orange-l:#FEF3C7;
  --red:#EF4444;--red-l:#FEE2E2;--dark:#0F172A;--gray:#64748B;--gray-l:#F1F5F9;
  --border:#E2E8F0;--bg:#F8FAFC;--card:#FFF;--glass:rgba(255,255,255,.75)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--dark);line-height:1.5;overflow-x:hidden}

.scene-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:linear-gradient(135deg,#EEF2FF 0%,#F0F9FF 40%,#F5F3FF 70%,#FFF 100%);perspective:1000px}
.scene-bg::before{content:'';position:absolute;top:-40%;right:-20%;width:60vw;height:60vw;
  border-radius:50%;background:radial-gradient(circle,rgba(79,142,247,.08) 0%,transparent 70%);
  animation:float1 20s ease-in-out infinite}
.scene-bg::after{content:'';position:absolute;bottom:-30%;left:-10%;width:50vw;height:50vw;
  border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%);
  animation:float2 25s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
@keyframes float2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(20px) scale(1.03)}}

/* Header */
.header{background:linear-gradient(135deg,#4F8EF7 0%,#7C5CFC 50%,#9333EA 100%);
  color:#fff;padding:24px 20px 16px;position:sticky;top:0;z-index:100;
  box-shadow:0 8px 32px rgba(79,142,247,.35),0 2px 8px rgba(0,0,0,.1);
  transform-style:preserve-3d;transition:transform .3s}
.header:hover{transform:perspective(800px) rotateX(1deg)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.header .sub{font-size:11px;opacity:.85;margin-top:2px}
.pbar-wrap{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,#FFF,#FDE68A);border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.pbar-meta{display:flex;justify-content:space-between;font-size:10px;margin-top:3px;opacity:.8}

/* Nav */
.nav{display:flex;gap:8px;padding:14px 20px 0;background:transparent;position:sticky;top:80px;z-index:99}
.nav button{border:none;background:var(--glass);color:var(--gray);padding:8px 18px;
  border-radius:12px 12px 0 0;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;backdrop-filter:blur(10px);border:1px solid var(--border);border-bottom:2px solid transparent;
  transition:all .25s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.nav button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,142,247,.15)}
.nav button.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;
  border-color:transparent;box-shadow:0 4px 16px rgba(79,142,247,.3);transform:translateY(-2px) scale(1.02)}

/* Main */
.main{padding:0 20px 40px}
.tab{display:none;animation:fadeUp .4s ease}
.tab.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Card3d */
.card3d{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
  border:1px solid rgba(226,232,240,.8);
  box-shadow:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -2px rgba(0,0,0,.03);
  transition:all .3s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative;overflow:hidden}
.card3d::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--purple));opacity:0;transition:opacity .3s}
.card3d:hover{transform:translateY(-4px) rotateX(1deg);
  box-shadow:0 20px 40px -12px rgba(79,142,247,.15),0 8px 16px -8px rgba(0,0,0,.08)}
.card3d:hover::before{opacity:1}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);
  position:relative;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:default}
.kpi::after{content:'';position:absolute;top:-50%;right:-30%;width:80px;height:80px;border-radius:50%;opacity:.08;transition:all .4s}
.kpi:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 24px -8px rgba(0,0,0,.12)}
.kpi.blue::after{background:var(--blue)}.kpi.purple::after{background:var(--purple)}
.kpi.green::after{background:var(--green)}.kpi.orange::after{background:var(--orange)}
.kpi.red::after{background:var(--red)}
.kpi-label{font-size:11px;color:var(--gray);margin-bottom:2px}
.kpi-val{font-size:22px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--dark) 0%,var(--gray) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kpi-sub{font-size:10px;color:var(--gray);margin-top:2px}

/* Person */
.person{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;
  border:1px solid var(--border);position:relative;overflow:hidden;
  transform-style:preserve-3d;transition:all .35s cubic-bezier(.4,0,.2,1)}
.person::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:0 4px 4px 0}
.person.r1::before{background:linear-gradient(180deg,#10B981,#34D399)}
.person.r2::before{background:linear-gradient(180deg,#4F8EF7,#60A5FA)}
.person.r3::before{background:linear-gradient(180deg,#F59E0B,#FBBF24)}
.person.r4::before{background:linear-gradient(180deg,#94A3B8,#CBD5E1)}
.person:hover{transform:perspective(600px) rotateY(-2deg) translateX(4px);
  box-shadow:0 12px 32px -8px rgba(0,0,0,.12),-4px 0 16px rgba(79,142,247,.08)}
.person-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.person-name{font-size:15px;font-weight:700}
.person-score{font-size:24px;font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.warn{background:linear-gradient(135deg,var(--orange),#FB923C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.danger{background:linear-gradient(135deg,var(--red),#F87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.good{background:linear-gradient(135deg,var(--green),#34D399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Metric bar */
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.m-label{width:60px;color:var(--gray);flex-shrink:0;font-weight:500}
.m-bar{flex:1;height:7px;background:var(--gray-l);border-radius:4px;overflow:hidden;position:relative}
.m-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
.m-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:20px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));border-radius:0 4px 4px 0}
.m-fill.blue{background:linear-gradient(90deg,#4F8EF7,#60A5FA)}
.m-fill.green{background:linear-gradient(90deg,#10B981,#34D399)}
.m-fill.orange{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.m-fill.red{background:linear-gradient(90deg,#EF4444,#F87171)}
.m-fill.purple{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.m-val{width:70px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}

/* Drill */
.drill{background:var(--gray-l);border-radius:10px;margin-top:10px;
  max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease;padding:0 12px}
.drill.open{max-height:2000px;padding:12px;overflow-y:auto}
.drill-title{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--blue);cursor:pointer}
.drill-cat{margin-bottom:8px}
.drill-cat-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:4px}
.drill-item{display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:11px;border-bottom:1px dashed var(--border)}
.drill-item:last-child{border:none}
.drill-sub{font-size:10px;color:var(--gray);margin-left:4px}

/* Channel table */
.ch-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ch-table th{background:var(--gray-l);padding:10px 12px;text-align:left;font-weight:700;position:sticky;top:0;border-bottom:2px solid var(--border)}
.ch-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
.ch-table tr:hover td{background:var(--blue-l)}
.ch-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Perf */
.perf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.perf-card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--border);
  transform-style:preserve-3d;transition:all .3s cubic-bezier(.4,0,.2,1)}
.perf-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -8px rgba(0,0,0,.1)}
.perf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.perf-name{font-size:15px;font-weight:800}
.perf-score{font-size:28px;font-weight:900;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.perf-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}
.perf-row .l{width:70px;color:var(--gray)}.perf-row .v{width:60px;text-align:right;font-weight:700}
.perf-row .t{width:50px;text-align:right;color:var(--gray);font-size:10px}
.perf-row .bar{flex:1;height:5px;background:var(--gray-l);border-radius:3px;overflow:hidden}
.perf-row .fill{height:100%;border-radius:3px;transition:width .5s}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  };
});

// Calc totals
var totalGP = 0, totalAmt = 0, totalQty = 0;
MAIN_EMP.forEach(function(n){
  var d = EMP_SUM[n];
  if(d){ totalGP += d.profit; totalAmt += d.amount; totalQty += d.qty; }
});

// Header
var monthTargetGP = 10000;
var pct = Math.min(totalGP / monthTargetGP * 100, 100);
document.getElementById('hdrPct').textContent = (totalGP/monthTargetGP*100).toFixed(1) + '%';
document.getElementById('hdrBar').style.width = pct + '%';
document.getElementById('hdrDone').textContent = '已达成 \u00A5' + totalGP.toFixed(0);
document.getElementById('hdrTarget').textContent = '月目标 \u00A5' + monthTargetGP;

// === Tab 1: Sales ===
(function(){
  var avgGP = totalQty > 0 ? totalGP/totalQty : 0;
  var kpis = [
    {label:'总毛利',val:'\u00A5'+totalGP.toFixed(0),cls:'blue',sub:'08-01~08-07'},
    {label:'总销售额',val:'\u00A5'+(totalAmt/10000).toFixed(1)+'万',cls:'purple',sub:'出库口径'},
    {label:'总销量',val:totalQty+'台',cls:'green',sub:'不含退换'},
    {label:'客单毛利',val:'\u00A5'+avgGP.toFixed(0),cls:'orange',sub:'毛利/销量'},
    {label:'业务员',val:MAIN_EMP.length+'人',cls:'blue',sub:'在岗考核'},
    {label:'日均毛利',val:'\u00A5'+(totalGP/7).toFixed(0),cls:'purple',sub:'7天平均'}
  ];
  var grid = document.getElementById('kpiGrid');
  kpis.forEach(function(k){
    grid.innerHTML += '<div class="kpi '+k.cls+'"><div class="kpi-label">'+k.label+'</div><div class="kpi-val">'+k.val+'</div><div class="kpi-sub">'+k.sub+'</div></div>';
  });

  var sorted = MAIN_EMP.slice().sort(function(a,b){ return (EMP_SUM[b]?EMP_SUM[b].profit:0) - (EMP_SUM[a]?EMP_SUM[a].profit:0); });
  var container = document.getElementById('salesPersons');

  sorted.forEach(function(name, idx){
    var d = EMP_SUM[name] || {qty:0,amount:0,profit:0,cats:{}};
    var gpTarget = 2500;
    var scoreClass = d.profit >= gpTarget ? 'good' : d.profit >= gpTarget*0.7 ? 'warn' : 'danger';
    var html = '<div class="person r'+(idx+1)+'" onclick="toggleDrill(this)">';
    html += '<div class="person-top">';
    html += '<div><div class="person-name">'+name+'</div><div style="font-size:11px;color:var(--gray)">销量'+d.qty+'台 \u00B7 销售额\u00A5'+(d.amount/10000).toFixed(1)+'万</div></div>';
    html += '<div class="person-score '+scoreClass+'">'+(d.profit>=0?'+':'')+'\u00A5'+d.profit.toFixed(0)+'</div>';
    html += '</div>';

    // Category bars
    CATS.forEach(function(cat){
      var catKey = '';
      for(var k in CAT_MAP){ if(CAT_MAP[k]===cat){ catKey=k; break; } }
      var actual = 0;
      if(d.cats){
        for(var ck in d.cats){
          if(ck === catKey || ck === cat) actual += d.cats[ck].profit;
        }
      }
      if(actual === 0) return;
      var pctVal = Math.min(actual / 3000 * 100, 100);
      var color = actual >= 0 ? (cat==='手机'?'blue':'green') : 'red';
      html += '<div class="m-row">';
      html += '<div class="m-label">'+cat+'</div>';
      html += '<div class="m-bar"><div class="m-fill '+color+'" style="width:'+Math.max(pctVal,3)+'%"></div></div>';
      html += '<div class="m-val" style="color:'+(actual>=0?'var(--dark)':'var(--red)')+'">\u00A5'+actual.toFixed(0)+'</div>';
      html += '</div>';
    });

    // Drill-down
    html += '<div class="drill" id="drill_'+name+'">';
    html += '<div class="drill-title">\u25BC SKU明细展开</div>';

    if(EMP_DETAIL[name]){
      for(var catName in EMP_DETAIL[name]){
        var items = EMP_DETAIL[name][catName];
        html += '<div class="drill-cat"><div class="drill-cat-title">\u3010'+catName+'\u3011</div>';
        items.forEach(function(item){
          var gpColor = item.gp >= 0 ? 'var(--green)' : 'var(--red)';
          html += '<div class="drill-item"><span>'+item.date.slice(5)+' '+item.name+'<span class="drill-sub">\u00D7'+item.qty+'</span></span>';
          html += '<span style="color:'+gpColor+';font-weight:600">\u00A5'+item.gp.toFixed(0)+'</span></div>';
        });
        html += '</div>';
      }
    }
    html += '</div></div>';
    container.innerHTML += html;
  });
})();

function toggleDrill(el){
  var drill = el.querySelector('.drill');
  if(drill) drill.classList.toggle('open');
}

// === Tab 2: Channel ===
(function(){
  var channels = ['三大地图','京东到家','企业上门购','自然客流'];
  var table = document.getElementById('channelTable');
  var html = '<thead><tr><th>业务员</th>';
  channels.forEach(function(ch){ html += '<th class="num">'+ch+'</th>'; });
  html += '<th class="num">合计</th></tr></thead><tbody>';

  MAIN_EMP.forEach(function(name){
    var emp = CHANNEL[name] || {};
    var total = 0;
    html += '<tr><td style="font-weight:700">'+name+'</td>';
    channels.forEach(function(ch){
      var v = emp[ch] || 0;
      total += v;
      html += '<td class="num" style="color:'+(v>0?'var(--dark)':'var(--gray)')+'">\u00A5'+(v>0?v.toFixed(0):'-')+'</td>';
    });
    html += '<td class="num" style="font-weight:800;color:var(--blue)">\u00A5'+total.toFixed(0)+'</td></tr>';
  });

  // Total row
  html += '<tr style="background:var(--gray-l);font-weight:700"><td>合计</td>';
  channels.forEach(function(ch){
    var s = 0;
    MAIN_EMP.forEach(function(n){ s += (CHANNEL[n]?CHANNEL[n][ch]||0:0); });
    html += '<td class="num">\u00A5'+s.toFixed(0)+'</td>';
  });
  var grandTotal = 0;
  MAIN_EMP.forEach(function(n){
    if(!CHANNEL[n]) return;
    for(var k in CHANNEL[n]) grandTotal += CHANNEL[n][k];
  });
  html += '<td class="num" style="color:var(--purple)">\u00A5'+grandTotal.toFixed(0)+'</td></tr></tbody>';
  table.innerHTML = html;

  // Channel viz
  var viz = document.getElementById('channelViz');
  var colors = {'三大地图':'var(--blue)','京东到家':'var(--purple)','企业上门购':'var(--orange)','自然客流':'var(--green)'};
  channels.forEach(function(ch){
    var s = 0;
    MAIN_EMP.forEach(function(n){ s += (CHANNEL[n]?CHANNEL[n][ch]||0:0); });
    var p = grandTotal > 0 ? (s/grandTotal*100) : 0;
    viz.innerHTML += '<div class="m-row" style="margin-bottom:8px">';
    viz.innerHTML += '<div class="m-label" style="width:70px">'+ch+'</div>';
    viz.innerHTML += '<div class="m-bar" style="height:10px"><div style="height:100%;border-radius:5px;background:'+colors[ch]+';width:'+Math.max(p,2)+'%;transition:width .6s"></div></div>';
    viz.innerHTML += '<div class="m-val">\u00A5'+s.toFixed(0)+' <span style="font-size:9px;color:var(--gray)">'+p.toFixed(1)+'%</span></div></div>';
  });
})();

// === Tab 3: Performance ===
(function(){
  var perfKpi = document.getElementById('perfKpi');
  var perfGrid = document.getElementById('perfGrid');

  var perfScores = [];
  MAIN_EMP.forEach(function(name){
    var d = EMP_SUM[name];
    if(!d) return;
    var score = 0;
    var phoneGP = 0, vasGP = 0, carrierAmt = 0, wearGP = 0;
    if(d.cats){
      for(var k in d.cats){
        if(k.indexOf('手机')>=0) phoneGP += d.cats[k].profit;
        if(k.indexOf('增值')>=0) vasGP += d.cats[k].profit;
        if(k.indexOf('运营商')>=0) carrierAmt += d.cats[k].amount;
        if(k.indexOf('穿戴')>=0) wearGP += d.cats[k].profit;
      }
    }
    score += Math.min(phoneGP/2500*40, 40);
    score += Math.min(vasGP/2000*20, 20);
    score += Math.min(carrierAmt/200*20, 20);
    score += Math.min(wearGP/500*20, 20);
    score = Math.min(score, 100);
    perfScores.push({name:name, score:score, d:d});
  });

  var totalPerfScore = 0;
  perfScores.forEach(function(s){ totalPerfScore += s.score; });
  var avgScore = perfScores.length > 0 ? totalPerfScore / perfScores.length : 0;
  var maxScore = Math.max.apply(null, perfScores.map(function(s){return s.score;}));
  var minScore = Math.min.apply(null, perfScores.map(function(s){return s.score;}));
  var maxName = perfScores.reduce(function(a,b){return a.score>b.score?a:b;}).name;
  var minName = perfScores.reduce(function(a,b){return a.score<b.score?a:b;}).name;
  var passCount = perfScores.filter(function(s){return s.score>=60;}).length;

  perfKpi.innerHTML = '<div class="kpi purple"><div class="kpi-label">平均绩效分</div><div class="kpi-val">'+avgScore.toFixed(1)+'</div><div class="kpi-sub">满分100</div></div>';
  perfKpi.innerHTML += '<div class="kpi blue"><div class="kpi-label">最高分</div><div class="kpi-val">'+maxScore.toFixed(1)+'</div><div class="kpi-sub">'+maxName+'</div></div>';
  perfKpi.innerHTML += '<div class="kpi orange"><div class="kpi-label">最低分</div><div class="kpi-val">'+minScore.toFixed(1)+'</div><div class="kpi-sub">'+minName+'</div></div>';
  perfKpi.innerHTML += '<div class="kpi green"><div class="kpi-label">达标人数</div><div class="kpi-val">'+passCount+'/'+perfScores.length+'</div><div class="kpi-sub">60分及格线</div></div>';

  perfScores.sort(function(a,b){return b.score-a.score;});
  perfScores.forEach(function(item, idx){
    var d = item.d;
    var metrics = [];
    if(d.cats){
      var phoneGP = 0, vasGP = 0, carrierAmt = 0, wearGP = 0;
      for(var k in d.cats){
        if(k.indexOf('手机')>=0) phoneGP += d.cats[k].profit;
        if(k.indexOf('增值')>=0) vasGP += d.cats[k].profit;
        if(k.indexOf('运营商')>=0) carrierAmt += d.cats[k].amount;
        if(k.indexOf('穿戴')>=0) wearGP += d.cats[k].profit;
      }
      metrics.push({label:'手机毛利',val:phoneGP,target:2500,max:3000});
      metrics.push({label:'增值服务',val:vasGP,target:2000,max:3000});
      metrics.push({label:'运营商',val:carrierAmt,target:200,max:300});
      metrics.push({label:'穿戴毛利',val:wearGP,target:500,max:1000});
      metrics.push({label:'总毛利',val:d.profit,target:2500,max:5000});
    }
    var scoreColor = item.score>=80?'var(--green)':item.score>=60?'var(--blue)':item.score>=40?'var(--orange)':'var(--red)';
    var html = '<div class="perf-card">';
    html += '<div class="perf-header"><div class="perf-name">#'+(idx+1)+' '+item.name+'</div>';
    html += '<div class="perf-score" style="background:linear-gradient(135deg,'+scoreColor+',var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+item.score.toFixed(1)+'</div></div>';
    metrics.forEach(function(m){
      var p = m.target>0 ? Math.min(m.val/m.target*100,100) : 0;
      var barP = m.max>0 ? Math.min(m.val/m.max*100,100) : 0;
      var c = p>=100?'var(--green)':p>=70?'var(--blue)':p>=40?'var(--orange)':'var(--red)';
      html += '<div class="perf-row"><div class="l">'+m.label+'</div>';
      html += '<div class="bar"><div class="fill" style="width:'+barP+'%;background:'+c+'"></div></div>';
      html += '<div class="v" style="color:'+c+'">\u00A5'+m.val.toFixed(0)+'</div>';
      html += '<div class="t">/\u00A5'+m.target+'</div></div>';
    });
    html += '</div>';
    perfGrid.innerHTML += html;
  });
})();

// 3D Tilt effect
document.addEventListener('mousemove', function(e){
  var cards = document.querySelectorAll('.card3d,.kpi,.person,.perf-card');
  cards.forEach(function(card){
    var rect = card.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    if(x < 0 || x > rect.width || y < 0 || y > rect.height) return;
    var rotateY = ((x / rect.width) - 0.5) * 4;
    var rotateX = (0.5 - (y / rect.height)) * 4;
    card.style.transform = 'perspective(600px) rotateX('+rotateX+'deg) rotateY('+rotateY+'deg) translateY(-2px)';
  });
});
</script>
