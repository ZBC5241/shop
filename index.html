<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>李家村万达华为 · 8月业绩看板</title>
<style>
:root{
  --bg:#F2F6FA;
  --bg-card:#FFFFFF;
  --bg-nav:#FFFFFF;
  --border:rgba(71,84,103,.10);
  --border-h:rgba(71,84,103,.20);
  --text:#1D2939;--text-sub:#475467;--text-dim:#667085;
  --primary:#7382F0;--primary-act:#5A8AFF;
  --blue:#4A80F8;--blue-l:rgba(74,128,248,.12);
  --purple:#A57CFF;--purple-l:rgba(165,124,255,.12);
  --green:#33C657;--green-l:rgba(51,198,87,.12);
  --orange:#FF983B;--orange-l:rgba(255,152,59,.12);
  --pink:#FF70A5;--pink-l:rgba(255,112,165,.12);
  --yellow:#F9CC24;--yellow-l:rgba(249,204,36,.15);
  --red:#F43F5E;--red-l:rgba(244,63,94,.10);
  --track:#E9EDF2;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.12);
  --shadow-h:0 2px 6px rgba(16,24,40,.08),0 16px 36px -14px rgba(16,24,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}

/* Ambient background (light) */
.scene-bg{position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 55% 45% at 18% 12%,rgba(115,130,240,.07),transparent),
    radial-gradient(ellipse 50% 55% at 85% 80%,rgba(90,138,255,.05),transparent),
    linear-gradient(135deg,#F2F6FA 0%,#EEF3FA 50%,#F4F7FB 100%);
  animation:ambientShift 30s ease-in-out infinite alternate}
@keyframes ambientShift{0%{filter:brightness(1)}50%{filter:brightness(1.02)}100%{filter:brightness(1)}}

/* Header */
.header{background:var(--bg-nav);
  border-bottom:1px solid var(--border);color:var(--text);padding:20px 24px 16px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px;color:var(--primary)}
.header .sub{font-size:11px;color:var(--text-dim);margin-top:3px}
.hdr-pct{font-size:26px;font-weight:900;color:var(--text)}
.pbar-wrap{height:6px;background:var(--track);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#7382F0,#5A8AFF)}
.pbar-meta{display:flex;justify-content:space-between;font-size:10px;margin-top:4px;color:var(--text-dim)}

/* Nav tabs */
.nav{display:flex;gap:6px;padding:14px 24px 0;background:transparent;position:sticky;top:76px;z-index:99}
.nav button{border:none;background:#FFFFFF;color:var(--text-dim);padding:8px 20px;
  border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);border-bottom:2px solid transparent;
  transition:all .25s cubic-bezier(.4,0,.2,1)}
.nav button:hover{background:#F7F9FC;color:var(--text-sub);transform:translateY(-1px)}
.nav button.active{background:#FFFFFF;color:var(--primary);border-color:var(--border);
  box-shadow:0 4px 16px rgba(115,130,240,.12),inset 0 1px 0 rgba(255,255,255,1);
  border-bottom:2px solid var(--primary)}

.main{padding:0 24px 40px}
.tab{display:none;animation:fadeUp .4s ease}
.tab.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Card */
.card{background:var(--bg-card);
  border-radius:16px;padding:18px;margin-bottom:14px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card:hover{border-color:var(--border-h);box-shadow:var(--shadow-h)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg-card);
  border-radius:14px;padding:14px;border:1px solid var(--border);
  position:relative;overflow:hidden;transition:all .3s;cursor:default;box-shadow:var(--shadow)}
.kpi:hover{transform:translateY(-3px);border-color:var(--border-h);box-shadow:var(--shadow-h)}
.kpi-label{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.kpi-val{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.kpi-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.kpi.blue .kpi-val{color:#4A80F8}.kpi.purple .kpi-val{color:#A57CFF}
.kpi.green .kpi-val{color:#33C657}.kpi.orange .kpi-val{color:#FF983B}
.kpi.red .kpi-val{color:#F43F5E}

/* Person card */
.person{background:var(--bg-card);
  border-radius:16px;padding:16px 18px;margin-bottom:12px;
  border:1px solid var(--border);position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
.person::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:0 3px 3px 0}
.person.r1::before{background:linear-gradient(180deg,#33C657,#33C657)}
.person.r2::before{background:linear-gradient(180deg,#4A80F8,#4A80F8)}
.person.r3::before{background:linear-gradient(180deg,#FF983B,#FF983B)}
.person.r4::before{background:linear-gradient(180deg,#94A3B8,#94A3B8)}
.person:hover{transform:translateY(-3px);border-color:var(--border-h);box-shadow:var(--shadow-h)}
.person-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.person-name{font-size:15px;font-weight:700;color:var(--text)}
.person-score{font-size:24px;font-weight:900;color:var(--text)}
.person-score.warn{color:#FF983B}
.person-score.danger{color:#F43F5E}
.person-score.good{color:#33C657}

/* Metric bar */
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.m-label{width:60px;color:var(--text-dim);flex-shrink:0;font-weight:500}
.m-bar{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden;position:relative}
.m-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.m-fill.blue{background:linear-gradient(90deg,#4A80F8,#5A8AFF)}
.m-fill.green{background:linear-gradient(90deg,#33C657,#5BD17B)}
.m-fill.orange{background:linear-gradient(90deg,#FF983B,#FFB36B)}
.m-fill.red{background:linear-gradient(90deg,#F43F5E,#FB7185)}
.m-fill.purple{background:linear-gradient(90deg,#A57CFF,#C4A4FF)}
.m-val{width:70px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--text)}

/* Drill down */
.drill{background:#F6F8FB;border-radius:10px;margin-top:10px;
  max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease;padding:0 12px;
  border:1px solid transparent}
.drill.open{max-height:2000px;padding:12px;overflow-y:auto;border-color:var(--border)}
.drill-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#4A80F8;cursor:pointer}
.drill-cat{margin-bottom:8px}
.drill-cat-title{font-size:12px;font-weight:700;color:#A57CFF;margin-bottom:4px}
.drill-item{display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:11px;border-bottom:1px dashed var(--border)}
.drill-item:last-child{border:none}
.drill-sub{font-size:10px;color:var(--text-dim);margin-left:4px}

/* Channel table */
.ch-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ch-table th{background:#F6F8FB;padding:10px 12px;text-align:left;font-weight:700;
  color:var(--text-sub);border-bottom:1px solid var(--border)}
.ch-table td{padding:8px 12px;border-bottom:1px solid rgba(71,84,103,.06);color:var(--text)}
.ch-table tr:hover td{background:rgba(90,138,255,.05)}
.ch-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Perf */
.perf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.perf-card{background:var(--bg-card);
  border-radius:16px;padding:16px;border:1px solid var(--border);
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
.perf-card:hover{transform:translateY(-3px);border-color:var(--border-h);box-shadow:var(--shadow-h)}
.perf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.perf-name{font-size:15px;font-weight:800;color:var(--text)}
.perf-score{font-size:28px;font-weight:900;color:var(--text)}
.perf-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}
.perf-row .l{width:70px;color:var(--text-dim)}.perf-row .v{width:60px;text-align:right;font-weight:700;color:var(--text)}
.perf-row .t{width:50px;text-align:right;color:var(--text-dim);font-size:10px}
.perf-row .bar{flex:1;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
.perf-row .fill{height:100%;border-radius:3px;transition:width .5s}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(71,84,103,.18);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(71,84,103,.3)}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

    html += '<td class="num" style="font-weight:800;color:#4A80F8">¥'+total.toFixed(0)+'</td></tr>';
  });

  html += '<tr style="background:#F6F8FB;font-weight:700"><td style="color:var(--text-sub)">合计</td>';
  channels.forEach(function(ch){
    var s = 0;
    MAIN_EMP.forEach(function(n){ s += (CHANNEL[n]?CHANNEL[n][ch]||0:0); });
    html += '<td class="num" style="color:var(--text-sub)">¥'+s.toFixed(0)+'</td>';
  });
  var grandTotal = 0;
  MAIN_EMP.forEach(function(n){
    if(!CHANNEL[n]) return;
    for(var k in CHANNEL[n]) grandTotal += CHANNEL[n][k];
  });
  html += '<td class="num" style="color:#A57CFF">¥'+grandTotal.toFixed(0)+'</td></tr></tbody>';
  table.innerHTML = html;

  var viz = document.getElementById('channelViz');
  var colors = {'三大地图':'#4A80F8','京东到家':'#A57CFF','企业上门购':'#FF983B','自然客流':'#33C657'};
  channels.forEach(function(ch){
    var s = 0;
    MAIN_EMP.forEach(function(n){ s += (CHANNEL[n]?CHANNEL[n][ch]||0:0); });
    var p = grandTotal > 0 ? (s/grandTotal*100) : 0;
    viz.innerHTML += '<div class="m-row" style="margin-bottom:8px">';
    viz.innerHTML += '<div class="m-label" style="width:70px">'+ch+'</div>';
    viz.innerHTML += '<div class="m-bar" style="height:8px"><div style="height:100%;border-radius:4px;background:'+colors[ch]+';width:'+Math.max(p,2)+'%;transition:width .6s"></div></div>';
    viz.innerHTML += '<div class="m-val">¥'+s.toFixed(0)+' <span style="font-size:9px;color:var(--text-dim)">'+p.toFixed(1)+'%</span></div></div>';
  });
})();

// === Tab 3: Performance ===
(function(){
  var perfKpi = document.getElementById('perfKpi');
  var perfGrid = document.getElementById('perfGrid');

  var perfScores = [];
  MAIN_EMP.forEach(function(name){
    var d = EMP_SUM[name];
    if(!d) return;
    var score = 0;
    var phoneGP = 0, vasGP = 0, carrierAmt = 0, wearGP = 0;
    if(d.cats){
      for(var k in d.cats){
        if(k.indexOf('手机')>=0) phoneGP += d.cats[k].profit;
        if(k.indexOf('增值')>=0) vasGP += d.cats[k].profit;
        if(k.indexOf('运营商')>=0) carrierAmt += d.cats[k].amount;
        if(k.indexOf('穿戴')>=0) wearGP += d.cats[k].profit;
      }
    }
    score += Math.min(phoneGP/2500*40, 40);
    score += Math.min(vasGP/2000*20, 20);
    score += Math.min(carrierAmt/200*20, 20);
    score += Math.min(wearGP/500*20, 20);
    score = Math.min(score, 100);
    perfScores.push({name:name, score:score, d:d});
  });

  var totalPerfScore = 0;
  perfScores.forEach(function(s){ totalPerfScore += s.score; });
  var avgScore = perfScores.length > 0 ? totalPerfScore / perfScores.length : 0;
  var maxScore = Math.max.apply(null, perfScores.map(function(s){return s.score;}));
  var minScore = Math.min.apply(null, perfScores.map(function(s){return s.score;}));
  var maxName = perfScores.reduce(function(a,b){return a.score>b.score?a:b;}).name;
  var minName = perfScores.reduce(function(a,b){return a.score<b.score?a:b;}).name;
  var passCount = perfScores.filter(function(s){return s.score>=60;}).length;

  perfKpi.innerHTML = '<div class="kpi purple"><div class="kpi-label">平均绩效分</div><div class="kpi-val">'+avgScore.toFixed(1)+'</div><div class="kpi-sub">满分100</div></div>';
  perfKpi.innerHTML += '<div class="kpi blue"><div class="kpi-label">最高分</div><div class="kpi-val">'+maxScore.toFixed(1)+'</div><div class="kpi-sub">'+maxName+'</div></div>';
  perfKpi.innerHTML += '<div class="kpi orange"><div class="kpi-label">最低分</div><div class="kpi-val">'+minScore.toFixed(1)+'</div><div class="kpi-sub">'+minName+'</div></div>';
  perfKpi.innerHTML += '<div class="kpi green"><div class="kpi-label">达标人数</div><div class="kpi-val">'+passCount+'/'+perfScores.length+'</div><div class="kpi-sub">60分及格线</div></div>';

  perfScores.sort(function(a,b){return b.score-a.score;});
  perfScores.forEach(function(item, idx){
    var d = item.d;
    var metrics = [];
    if(d.cats){
      var phoneGP = 0, vasGP = 0, carrierAmt = 0, wearGP = 0;
      for(var k in d.cats){
        if(k.indexOf('手机')>=0) phoneGP += d.cats[k].profit;
        if(k.indexOf('增值')>=0) vasGP += d.cats[k].profit;
        if(k.indexOf('运营商')>=0) carrierAmt += d.cats[k].amount;
        if(k.indexOf('穿戴')>=0) wearGP += d.cats[k].profit;
      }
      metrics.push({label:'手机毛利',val:phoneGP,target:2500,max:3000});
      metrics.push({label:'增值服务',val:vasGP,target:2000,max:3000});
      metrics.push({label:'运营商',val:carrierAmt,target:200,max:300});
      metrics.push({label:'穿戴毛利',val:wearGP,target:500,max:1000});
      metrics.push({label:'总毛利',val:d.profit,target:2500,max:5000});
    }
    var scoreColor = item.score>=80?'#33C657':item.score>=60?'#4A80F8':item.score>=40?'#FF983B':'#F43F5E';
    var html = '<div class="perf-card">';
    html += '<div class="perf-header"><div class="perf-name">#'+(idx+1)+' '+item.name+'</div>';
    html += '<div class="perf-score" style="color:'+scoreColor+'">'+item.score.toFixed(1)+'</div></div>';
    metrics.forEach(function(m){
      var p = m.target>0 ? Math.min(m.val/m.target*100,100) : 0;
      var barP = m.max>0 ? Math.min(m.val/m.max*100,100) : 0;
      var c = p>=100?'#33C657':p>=70?'#4A80F8':p>=40?'#FF983B':'#F43F5E';
      html += '<div class="perf-row"><div class="l">'+m.label+'</div>';
      html += '<div class="bar"><div class="fill" style="width:'+barP+'%;background:'+c+'"></div></div>';
      html += '<div class="v" style="color:'+c+'">¥'+m.val.toFixed(0)+'</div>';
      html += '<div class="t">/¥'+m.target+'</div></div>';
    });
    html += '</div>';
    perfGrid.innerHTML += html;
  });
})();
</script>
