<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>李家村万达华为 · 8月业绩看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F4F6F9;--card:#ffffff;
  --ink:#1a1a2e;--sub:#7a7f8e;--dim:#a0a5b4;
  --blue:#4F7DF7;--purple:#7C5CFC;--teal:#2CBBC8;--green:#10B981;
  --amber:#F5A623;--rose:#E8557A;--red:#DC2626;
  --border:#ECEEF3;
}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 16px 60px}

/* ===== HEADER ===== */
.header{background:linear-gradient(135deg,#4F7DF7 0%,#7C5CFC 50%,#9B6FFC 100%);
  border-radius:0 0 24px 24px;padding:24px 20px 20px;margin:0 -16px 20px;
  box-shadow:0 12px 40px -12px rgba(79,125,247,.35)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:18px;font-weight:800;letter-spacing:.3px;color:#fff}
.header .sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:4px}
.time-box{text-align:right}
.time-box .pct{font-size:32px;font-weight:900;line-height:1;color:#fff}
.time-box .lab{font-size:11px;color:rgba(255,255,255,.65);margin-top:3px}
.progress-bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#34D399,#6EE7B7);border-radius:2px;transition:width .8s}

/* ===== VIEW SWITCH ===== */
.view-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.view-btn{border:none;background:var(--card);color:var(--sub);padding:6px 14px;border-radius:999px;
  font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:all .2s}
.view-btn:hover{background:#E8ECF4}
.view-btn.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}

/* ===== ALERT BANNER ===== */
.alert-card{background:linear-gradient(135deg,#FFF5F5,#FFF8F0);border:1px solid #FECACA;
  border-radius:18px;padding:14px 16px;margin-bottom:18px;position:relative;overflow:hidden;
  animation:fadeInUp .5s ease}
.alert-card::before{content:'⚠️';position:absolute;top:12px;right:16px;font-size:20px;opacity:.3}
.alert-card .a-title{font-size:13px;font-weight:700;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alert-card .a-items{display:flex;flex-direction:column;gap:5px}
.alert-item{font-size:12px;color:var(--ink);padding:4px 10px;background:rgba(255,255,255,.7);border-radius:8px;
  display:flex;align-items:center;gap:6px}
.alert-item .a-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.alert-item .a-dot.r{background:var(--red)}.alert-item .a-dot.o{background:var(--amber)}.alert-item .a-dot.b{background:var(--blue)}

/* ===== FORECAST CARD ===== */
.forecast-card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:18px;
  border:1px solid var(--border);box-shadow:0 2px 8px rgba(30,41,59,.04);
  animation:fadeInUp .5s ease .1s both}
.forecast-card .f-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.forecast-card .f-title::before{content:'';width:4px;height:16px;background:linear-gradient(180deg,var(--amber),var(--rose));border-radius:3px;display:inline-block}
.forecast-row{display:flex;gap:8px;flex-wrap:wrap}
.forecast-item{background:#F8F9FC;border-radius:12px;padding:10px 14px;flex:1;min-width:100px;text-align:center}
.forecast-item .f-label{font-size:10px;color:var(--dim);margin-bottom:3px}
.forecast-item .f-val{font-size:16px;font-weight:800;color:var(--ink)}
.forecast-item .f-val.danger{color:var(--red)}
.forecast-item .f-val.ok{color:var(--green)}

/* ===== KPI STRIP ===== */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:20px;padding:16px 14px;
  box-shadow:0 2px 12px rgba(30,41,59,.06);transition:all .25s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(30,41,59,.12)}
.kpi .k-label{font-size:10.5px;color:var(--dim);margin-bottom:6px;font-weight:600}
.kpi .k-val{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.kpi .k-sub{font-size:10px;color:var(--sub);margin-top:4px}
.kpi .k-sub.red{color:var(--red);font-weight:700}
.kpi .k-sub.green{color:var(--green);font-weight:700}
.kpi .share-btn{position:absolute;top:10px;right:10px;width:24px;height:24px;border:none;background:#F0F2F7;
  border-radius:6px;font-size:11px;color:var(--dim);cursor:pointer;opacity:0;transition:all .2s;display:flex;align-items:center;justify-content:center}
.kpi:hover .share-btn{opacity:1}
.kpi .share-btn:hover{background:#E4E7EE;color:var(--ink)}

/* ===== SECTION TITLE ===== */
.sec-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;
  padding-left:2px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';display:inline-block;width:4px;height:16px;
  background:linear-gradient(180deg,var(--blue),var(--purple));border-radius:3px}
.sec-title .s-share{margin-left:auto;width:26px;height:26px;border:none;background:#F0F2F7;
  border-radius:8px;font-size:12px;color:var(--dim);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center}
.sec-title .s-share:hover{background:#E4E7EE;color:var(--ink)}

/* ===== CATEGORY GRID ===== */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.cat{background:var(--card);border-radius:22px;padding:18px 16px;
  box-shadow:0 2px 12px rgba(30,41,59,.06);transition:all .3s;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;position:relative}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 32px -8px rgba(30,41,59,.14)}
.cat .cat-share{position:absolute;top:10px;right:10px;width:24px;height:24px;border:none;background:#F0F2F7;
  border-radius:6px;font-size:11px;color:var(--dim);cursor:pointer;opacity:0;transition:all .2s;
  display:flex;align-items:center;justify-content:center}
.cat:hover .cat-share{opacity:1}
.cat .cat-share:hover{background:#E4E7EE;color:var(--ink)}

.cat-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;width:100%}
.cat-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0}
.cat-icon.blue{background:rgba(79,125,247,.1);color:var(--blue)}.cat-icon.purple{background:rgba(124,92,252,.1);color:var(--purple)}
.cat-icon.teal{background:rgba(44,188,200,.1);color:var(--teal)}.cat-icon.green{background:rgba(16,185,129,.1);color:var(--green)}
.cat-icon.amber{background:rgba(245,166,35,.1);color:var(--amber)}.cat-icon.rose{background:rgba(232,85,122,.1);color:var(--rose)}
.cat-name{font-size:13px;font-weight:700;color:var(--ink)}

.ring-wrap{position:relative;width:90px;height:90px;margin-bottom:12px}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#F0F1F5;stroke-width:7}
.ring-fg{fill:none;stroke-width:7;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:16px;font-weight:800;color:var(--ink);line-height:1}
.ring-lab{font-size:9px;color:var(--dim);margin-top:2px}

.cat-rows{width:100%}
.cat-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);padding:3px 0;line-height:1.6}
.cat-row span:last-child{color:var(--ink);font-weight:600}
.cat-row .gap-val{color:var(--red)!important;font-weight:700!important}

.cat-tag{margin-top:10px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700}
.cat-tag.warn{background:#FFF8E1;color:#E6A100;animation:pulse-warn 2s ease-in-out infinite}
.cat-tag.ok{background:#E6F9EE;color:#059669}

@keyframes pulse-warn{0%,100%{opacity:1}50%{opacity:.7}}

/* ===== DAILY TABLE ===== */
.daily-card{background:var(--card);border-radius:22px;
  box-shadow:0 2px 12px rgba(30,41,59,.06);overflow:hidden;margin-bottom:20px}
.daily-header{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.daily-header .dh-title{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.daily-header .dh-title::before{content:'';display:inline-block;width:4px;height:16px;
  background:linear-gradient(180deg,var(--green),var(--teal));border-radius:3px}
.chips{display:flex;gap:5px}
.chip{border:none;background:#F0F2F7;color:var(--dim);padding:5px 11px;
  border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
.chip:hover{background:#E4E7EE;color:var(--sub)}
.chip.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px}
.scroll::-webkit-scrollbar{height:3px}
.scroll::-webkit-scrollbar-thumb{background:#D4DBE8;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap}
th,td{padding:8px 7px;text-align:center;border:none}
thead th{background:#F8F9FC;color:var(--dim);font-weight:600;font-size:10.5px;border-bottom:1px solid var(--border)}
th.emp,td.emp{text-align:left;font-weight:700;padding-left:10px;min-width:56px}
th.emp{color:var(--ink)}td.emp{color:var(--sub);font-size:12px}
tbody tr{border-bottom:1px solid #F5F6FA;transition:background .15s}
tbody tr:hover td{background:#EFF4FF!important}
tbody tr:nth-child(even) td{background:#FAFBFD}
td.val{color:var(--ink);font-weight:600}td.blank{color:var(--dim)}
td.top{background:rgba(16,185,129,.06)!important;color:#059669;font-weight:800}
td.zero-hard{color:var(--red)!important;font-weight:700;position:relative}
td.zero-hard::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:8px;height:2px;border-radius:1px;background:var(--red);animation:pulse-warn 2s ease-in-out infinite}
tr.total-row td{border-top:1px solid var(--border);font-weight:700;color:var(--sub);background:#F8F9FC!important}

/* ===== EMPLOYEE CARDS ===== */
.emp-grid-wrap{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:20px}
.emp-card{background:var(--card);border-radius:20px;
  box-shadow:0 2px 12px rgba(30,41,59,.06);overflow:hidden;transition:all .25s}
.emp-card:hover{box-shadow:0 6px 20px rgba(30,41,59,.1)}
.emp-head{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.emp-avatar{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.emp-info{flex:1;min-width:0}
.emp-info .e-name{font-size:14px;font-weight:700;color:var(--ink)}
.emp-info .e-sum{font-size:11px;color:var(--sub);margin-top:1px}
.emp-arrow{color:var(--dim);font-size:12px;transition:transform .2s;padding:4px}
.emp-card.open .emp-arrow{transform:rotate(180deg)}
.emp-body{display:none;padding:0 16px 14px}
.emp-card.open .emp-body{display:block}
.emp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.emp-cell{background:#F8F9FC;border-radius:12px;padding:10px 12px;text-align:center}
.emp-cell .ec-label{font-size:10px;color:var(--dim);margin-bottom:3px}
.emp-cell .ec-val{font-size:15px;font-weight:800;color:var(--ink)}
.emp-cell .ec-val.red{color:var(--red)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px -12px rgba(0,0,0,.2);padding:0}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.modal-header .m-title{font-size:16px;font-weight:700;color:var(--ink)}
.modal-close{width:28px;height:28px;border:none;background:#F0F2F7;border-radius:8px;font-size:14px;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:#E4E7EE;color:var(--ink)}
.modal-summary{padding:14px 20px;display:flex;gap:4px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);border-bottom:1px solid #F5F6FA}
.modal-summary .ms-item{padding:0 10px;border-right:1px solid #ECEEF3}
.modal-summary .ms-item:last-child{border:none}
.modal-summary .ms-item .ms-val{color:var(--ink);font-weight:700}
.modal-chart{padding:16px 16px 8px}
.modal-chart canvas{width:100%!important;height:200px!important}
.modal-legend{padding:6px 20px 16px;display:flex;gap:16px;font-size:11px;color:var(--dim)}
.modal-legend span{display:flex;align-items:center;gap:4px}
.modal-legend .leg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.foot{text-align:center;font-size:10.5px;color:var(--dim);padding:16px 0 8px;border-top:1px solid var(--border);margin-top:10px}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim-in{opacity:0;transform:translateY(16px);transition:all .5s cubic-bezier(.4,0,.2,1)}
.anim-in.visible{opacity:1;transform:translateY(0)}

/* ===== RESPONSIVE ===== */
@media(min-width:768px){
  .wrap{padding:0 24px 60px}
  .header{border-radius:0 0 28px 28px;margin:0 -24px 24px;padding:28px 32px 24px}
  .header h1{font-size:22px}.time-box .pct{font-size:38px}
  .kpi-strip{gap:14px}.kpi{padding:20px 18px}.kpi .k-val{font-size:22px}
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .emp-grid-wrap{grid-template-columns:repeat(2,1fr);gap:12px}
  .sec-title{font-size:16px;margin:24px 0 14px}
  table{font-size:12.5px}th,td{padding:9px 10px}
  .modal-card{max-width:560px}
}
@media(min-width:1200px){
  .wrap{padding:0 32px 60px}
  .header{margin:0 -32px 28px;padding:32px 40px 28px}.header h1{font-size:24px}
  .kpi-strip{grid-template-columns:repeat(3,1fr);gap:16px}
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:18px}
  .emp-grid-wrap{grid-template-columns:repeat(3,1fr);gap:14px}
  .modal-card{max-width:640px}.modal-chart canvas{height:260px!important}
}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;
  padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;
  box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header anim-in">

      <div>
        <h1>李家村万达华为 · 8月业绩看板</h1>

      <div class="k-val" data-count="120533">¥0</div>

      <div class="k-label">累计单数</div>
      <div class="k-val" data-count="171">0</div>
      <div class="k-sub" id="kpiSj">手机 37台</div>
      <button class="share-btn" title="分享" onclick="shareThis(this)">↗</button>

  </div>

  <!-- CATEGORIES -->
  <div class="sec-title anim-in">品类达成 <button class="s-share" title="分享品类" onclick="shareSection('品类达成')">↗</button></div>
  <div class="cat-grid anim-in" id="catGrid"></div>

  <!-- DAILY TABLE -->
  <div class="daily-card anim-in">
    <div class="daily-header">
      <div class="dh-title">每日达成全览</div>

  <!-- EMPLOYEE -->

  <div class="emp-grid-wrap anim-in" id="empSection"></div>

  <div class="foot">数据取自用友云「门店毛利明细表-华为终端」XS出库明细</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="m-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-chart"><canvas id="modalChart"></canvas></div>
    <div class="modal-legend">
      <span><i class="leg-dot" style="background:var(--blue)"></i>日毛利</span>
      <span><i class="leg-dot" style="background:var(--green)"></i>累计</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const D={"emps":["邵乐乐","杨丽华","陈超磊","李泽","张博晨"],

// ===== NUMBER COUNT UP =====
function animateCount(el,target,prefix='',suffix=''){
  const dur=1200;let start=null;
  function step(ts){if(!start)start=ts;const p=Math.min((ts-start)/dur,1);
    const ease=1-Math.pow(1-p,3);const v=Math.round(ease*target);
    el.textContent=prefix+v.toLocaleString('zh-CN')+suffix;
    if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

function renderAlerts(){
  const alerts=[];
  // who is zero today (last date)
  const today=D.dates[D.dates.length-1];
  const zeros=[];const lowLi=[];
  D.emps.forEach(e=>{
    const c=D.rows[e][today]||{};
    if(c.cnt===0&&e!=='张博晨')zeros.push(e);
  });
  // consecutive zeros (last 2+ days)
  D.emps.forEach(e=>{
    const last2=D.dates.slice(-2);
    const both0=last2.every(d=>(D.rows[e][d]||{}).cnt===0);
    if(both0&&e!=='张博晨')lowLi.push(e);
  });
  if(zeros.length)alerts.push({dot:'r',text:`今日挂零：${zeros.join('、')}`});
  if(lowLi.length)alerts.push({dot:'r',text:`连续2天挂零：${lowLi.join('、')}，需关注`});
  // biggest category gap
  let maxGapCat='';let maxGap=0;
  CATS.forEach(c=>{const g=c.task-c.done;if(g>maxGap){maxGap=g;maxGapCat=c.name;}});
  if(maxGapCat)alerts.push({dot:'o',text:`最大缺口品类：${maxGapCat}（差${maxGap}台）`});
  // li trend (last 3 days store total)
  const d3=D.dates.slice(-3);
  const li3=d3.map(d=>D.emps.reduce((s,e)=>s+((D.rows[e][d]||{}).li||0),0));
  if(li3.length>=2&&li3[li3.length-1]<li3[li3.length-2])alerts.push({dot:'o',text:`门店毛利连续下滑，注意节奏`});

  if(!alerts.length){document.getElementById('alertCard').style.display='none';return;}
  document.getElementById('alertItems').innerHTML=alerts.map(a=>
    `<div class="alert-item"><span class="a-dot ${a.dot}"></span>${a.text}</div>`).join('');
}

function renderForecast(){
  const totalLi=D.emps.reduce((s,e)=>{return s+D.dates.reduce((s2,d)=>s2+((D.rows[e][d]||{}).li||0),0);},0);
  const activeDays=D.dates.filter(d=>D.emps.some(e=>(D.rows[e][d]||{}).cnt>0)).length||1;
  const dailyAvg=totalLi/activeDays;
  const remainDays=31-activeDays;

// ===== DAILY TABLE =====
function renderDaily(){
  const m=MF[curM];const ds=D.dates;
  const es=curView==='all'?D.emps:[curView].filter(e=>D.emps.includes(e));
  const maxByD={};ds.forEach(d=>{let mx=0;es.forEach(e=>{const v=(D.rows[e][d]||{})[curM]||0;if(v>mx)mx=v;});maxByD[d]=mx;});
  const cum={};es.forEach(e=>{let s=0;ds.forEach(d=>s+=(D.rows[e][d]||{})[curM]||0);cum[e]=s;});
  const sorted=[...es].sort((a,b)=>cum[b]-cum[a]);

  // find consecutive zeros
  function consecZeros(emp){
    let c=0,maxc=0;
    ds.forEach(d=>{if((D.rows[emp][d]||{}).cnt===0){c++;if(c>maxc)maxc=c;}else c=0;});
    return maxc;
  }

  let h='<thead><tr><th class="emp">员工</th>';
  ds.forEach(d=>h+=`<th>${d}</th>`);h+='<th>累计</th></tr></thead><tbody>';
  sorted.forEach(e=>{
    let s=0;let tds='';const cz=consecZeros(e);
    ds.forEach(d=>{
      const v=(D.rows[e][d]||{})[curM]||0;s+=v;
      if(v===0)tds+=`<td class="blank">—</td>`;
      else if(v===maxByD[d]&&maxByD[d]>0)tds+=`<td class="top">${m.f(v)}</td>`;
      else tds+=`<td class="val">${m.f(v)}</td>`;
    });
    const warnTag=cz>=2?`<span style="color:var(--red);font-size:10px;margin-left:4px">⚠${cz}天挂零</span>`:'';
    h+=`<tr><td class="emp">${e}${warnTag}</td>${tds}<td class="val" style="font-weight:800">${m.f(s)}</td></tr>`;
  });
  if(es.length>1){
    let tots='';let grand=0;
    ds.forEach(d=>{let t=0;es.forEach(e=>t+=(D.rows[e][d]||{})[curM]||0);grand+=t;
      tots+=`<td class="val" style="font-weight:700">${t?m.f(t):'—'}</td>`;});
    h+=`<tr class="total-row"><td class="emp" style="color:var(--ink)">合计</td>${tots}<td class="val" style="font-weight:800">${m.f(grand)}</td></tr>`;
  }
  h+='</tbody>';document.getElementById('dtable').innerHTML=h;
}

function drawChart(dates,vals,strokeColor){
  const canvas=document.getElementById('modalChart');
  const dpr=window.devicePixelRatio||1;const w=canvas.clientWidth,h=canvas.clientHeight||200;
  canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const pad={t:20,r:16,b:28,l:52};const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const maxV=Math.max(...vals,1)*1.2;
  ctx.strokeStyle='#F0F1F5';ctx.lineWidth=1;
  for(let i=0;i<4;i++){const y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();}
  ctx.fillStyle='#94a3b8';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='center';
  dates.forEach((d,i)=>{const x=dates.length===1?pad.l+cw/2:pad.l+cw*i/(dates.length-1);ctx.fillText(d.slice(3),x,h-4);});
  ctx.textAlign='right';
  for(let i=0;i<4;i++){const v=Math.round(maxV*(3-i)/3);const y=pad.t+ch*i/3;ctx.fillText(v>=1000?(v/1000).toFixed(1)+'k':v,pad.l-8,y+4);}
  const pts=vals.map((v,i)=>{const x=vals.length===1?pad.l+cw/2:pad.l+cw*i/(vals.length-1);const y=pad.t+ch-ch*v/maxV;return{x,y};});
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+ch);pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.closePath();ctx.globalAlpha=.08;ctx.fillStyle=strokeColor;ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=strokeColor;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=strokeColor;ctx.lineWidth=2;ctx.stroke();});
}

    document.querySelectorAll('.view-btn').forEach(b=>{b.classList.toggle('active',b.dataset.view===v);});
  }
}

// ===== INIT =====
checkUrlView();

// Dynamic KPI from D
(function(){
  let totalLi=0,totalXj=0,totalCnt=0,totalSj=0;
  D.emps.forEach(e=>D.dates.forEach(d=>{
    const c=D.rows[e][d]||{};totalLi+=c.li||0;totalXj+=c.xj||0;totalCnt+=c.cnt||0;totalSj+=c.sj||0;
  }));
  const targetLi=205000;
  const pct=Math.round(totalLi/targetLi*100);
  // Update KPI DOM
  const kpis=document.querySelectorAll('.kpi');
  kpis[0].querySelector('.k-val').dataset.count=Math.round(totalLi);
  kpis[0].querySelector('.k-sub').textContent='完成率 '+pct+'%';
  kpis[0].querySelector('.k-sub').className='k-sub '+(pct<50?'red':'green');
  const activeDays=D.dates.filter(d=>D.emps.some(e=>(D.rows[e][d]||{}).cnt>0)).length||1;
  kpis[1].querySelector('.k-val').dataset.count=Math.round(totalXj);
  kpis[1].querySelector('.k-sub').textContent='日均 ¥'+fmtN(totalXj/activeDays);
  kpis[2].querySelector('.k-val').dataset.count=Math.round(totalCnt);
  kpis[2].querySelector('.k-sub').textContent='手机 '+totalSj+'台';
})();

renderAlerts();
renderForecast();
renderCats();
renderDaily();
renderEmps();
initObserver();

// animate KPI numbers
document.querySelectorAll('.k-val[data-count]').forEach(el=>{
  const t=parseInt(el.dataset.count);const pre=el.textContent.startsWith('¥')?'¥':'';
  animateCount(el,t,pre);
});

// animate time progress
(function(){
  const now=new Date();const day=now.getDate();const pct=Math.round(day/31*100);
  setTimeout(()=>{document.getElementById('timePct').textContent=pct+'%';document.getElementById('timeBar').style.width=pct+'%';
    document.getElementById('timeLab').textContent='时间进度 '+day+'/31天';},300);
})();
</script>
