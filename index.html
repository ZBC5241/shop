<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>李家村万达 · 业绩看板</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --soft:#eef0fb;
  --line:#e7e9f2; --line2:#dcdfee;
  --tx:#1f2233; --tx2:#5b6180; --tx3:#8a90ab;
  --purple:#7c3aed; --purple2:#a855f7; --purpleDim:rgba(124,58,237,.10);
  --red:#ef4444; --red2:#f87171; --redDim:rgba(239,68,68,.12);
  --green:#22c55e; --greenDim:rgba(34,197,94,.13);
  --amber:#f59e0b; --amberDim:rgba(245,158,11,.14);
  --blue:#6366f1; --blueDim:rgba(99,102,241,.12);
  --gray:#9aa0bd; --grayDim:rgba(154,160,189,.14);
  --grad:linear-gradient(135deg,var(--purple),var(--purple2));
  --r:16px;
  --shadow:0 6px 22px rgba(70,60,130,.08);
  --shadow-s:0 3px 12px rgba(70,60,130,.06);
  --shadow-h:0 10px 30px rgba(124,58,237,.14);
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  padding-bottom:calc(78px + var(--safeB));
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  background:
    radial-gradient(1100px 520px at 50% -10%, rgba(124,58,237,.10), transparent 60%),
    radial-gradient(820px 460px at 100% -2%, rgba(168,85,247,.07), transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{display:block}

/* ============ 布局骨架（响应式核心）============ */
/* 手机：side 里的顶栏吸顶、Tab 固定底部；contents 让二者各自定位 */
.side{display:contents}

/* ============ 顶栏 ============ */
.top{
  position:sticky;top:0;z-index:60;
  padding:calc(12px + var(--safeT)) 16px 12px;
  background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,247,251,.90));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 6px 22px rgba(70,60,130,.06);
}
.top-row{display:flex;align-items:center;gap:11px;padding-right:80px}
.logo{
  width:36px;height:36px;border-radius:10px;flex:0 0 auto;
  background:var(--grad);cursor:pointer;
  display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;line-height:1;
  box-shadow:0 4px 14px rgba(124,58,237,.38);transition:.18s;
}
.logo:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(124,58,237,.45)}
.logo:active{transform:scale(.93)}
.logo.on{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 4px 16px rgba(245,158,11,.55)}
.top-t{flex:1;min-width:0}
.top-t h1{font-size:clamp(14px,1.02rem + .35vw,17px);font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{font-size:11px;color:var(--tx3);margin-top:2px}

/* 时间进度圆环：绝对定位挂右上角，不撑高头部（保持 v10 高度） */
.tp-ring{
    position:absolute;
    top:6px;
    right:13px;
    width:66px;
    height:66px;
    display:grid;
    place-items:center;
    flex:0 0 auto
}
.tp-ring svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%
}
.tp-ring-c{
    position:relative;
    font-size:13px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.3px;
    font-variant-numeric:tabular-nums
}

/* 时间进度：tp 区保持 v10 紧凑样式（小数字+进度条+剩余天数） */
.tp{margin-top:11px}
.tp-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--tx3);margin-bottom:5px}
.tp-h b{color:var(--tx);font-weight:700}
.tp-bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.tp-bar{flex:1;height:7px;border-radius:5px;background:var(--soft);overflow:hidden;position:relative}
.tp-fill{height:100%;border-radius:5px;background:var(--grad);box-shadow:0 0 10px rgba(124,58,237,.35);transition:width 1s cubic-bezier(.22,1,.36,1)}
.tp-days{font-size:11px;color:var(--tx3);white-space:nowrap;letter-spacing:.2px}
.tp-days b{color:#f59e0b;font-weight:800;font-variant-numeric:tabular-nums}

/* ============ 标签栏 ============ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:flex;background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safeB);
  box-shadow:0 -6px 22px rgba(70,60,130,.07);
}
.tab{
  flex:1;padding:8px 0 7px;text-align:center;cursor:pointer;
  color:var(--tx3);transition:.18s;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tab svg{width:21px;height:21px;stroke:currentColor;transition:.18s}
.tab span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;transition:.18s}
.tab.on{color:var(--purple)}
.tab.on::after{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:2px;background:var(--grad);box-shadow:0 0 9px rgba(124,58,237,.5)}
.tab.on svg{transform:translateY(-1px)}
@media (max-width:360px){.tab span{display:none}}

/* ============ 通用 ============ */
.wrap{padding:16px 14px 22px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-left:1px}
.sec-h b{font-size:clamp(13px,.85rem + .35vw,16px);font-weight:800;letter-spacing:.3px}
.sec-h .bar{width:3px;height:14px;border-radius:2px;background:var(--grad)}
.sec-h .tail{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-s);
}
/* 指针设备：卡片 hover 轻微上浮（融外部看板微交互，提升大屏质感） */
@media(hover:hover) and (pointer:fine){
  .kpi:hover,.rk:hover,.day:hover,.bt-c:hover,.q:hover,.ct:hover,.pf:hover,.adv:hover,.mc:hover{
    transform:translateY(-2px);box-shadow:var(--shadow-h);
  }
  .kpi,.rk,.day,.bt-c,.q,.ct,.pf,.adv,.mc{transition:transform .16s ease,box-shadow .16s ease}
}
.empty{padding:26px 0;text-align:center;color:var(--tx3);font-size:12px}

/* ============ 店长洞察 ============ */
/* 今日战况 */
.bt{display:flex;gap:9px;margin-bottom:9px}
.bt-c{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:11px 11px;text-align:center;box-shadow:var(--shadow-s)}
.bt-v{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.bt-l{font-size:10px;color:var(--tx3);margin-top:3px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.who-i{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;
       font-size:11.5px;background:var(--soft);border:1px solid var(--line)}
.who-i b{font-weight:700}
.who-i.on{background:var(--redDim);border-color:rgba(239,68,68,.30)}
.who-i.off{background:var(--greenDim);border-color:rgba(34,197,94,.30);color:var(--green)}
.who-i .n{font-weight:600}
.who-i .s{color:var(--tx3);font-size:10.5px}
.who-i.off .s{color:var(--green);opacity:.82}

/* 建议卡 */
.adv{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tx3);
     border-radius:var(--r);padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow-s)}
.adv.danger{border-left-color:var(--green);background:var(--greenDim)}
.adv.warn{border-left-color:var(--amber);background:var(--amberDim)}
.adv.good{border-left-color:var(--red);background:var(--redDim)}
.adv-t{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;margin-bottom:4px}
.adv-t svg{width:15px;height:15px}
.adv-b{font-size:11.5px;line-height:1.75;color:var(--tx2)}

/* 品类体检行 */
.ct{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:var(--shadow-s)}
.ct-bg{position:absolute;left:0;top:0;bottom:0;opacity:.12;border-radius:var(--r) 0 0 var(--r)}
.ct-r{position:relative;display:flex;align-items:center;gap:8px}
.ct-n{font-size:12.5px;font-weight:800;min-width:58px}
.ct-tag{font-size:9.5px;padding:1.5px 6px;border-radius:5px;font-weight:800;white-space:nowrap;color:#fff}
.ct-m{margin-left:auto;text-align:right}
.ct-v{font-size:12px;font-weight:800;letter-spacing:-.2px}
.ct-s{font-size:10px;color:var(--tx3);margin-top:1px}
.ct-x{position:relative;font-size:10.5px;color:var(--tx3);margin-top:6px;line-height:1.65}
.ct-x b{color:var(--green);font-weight:700}

/* 员工体检行 */
.pf{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow-s)}
.pf-r{display:flex;align-items:center;gap:10px}
.pf-no{width:20px;height:20px;border-radius:7px;background:var(--soft);color:var(--tx3);
       font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.pf-no.n1{background:linear-gradient(135deg,#ffd257,#f0a723);color:#4a3400;box-shadow:0 2px 8px rgba(240,167,35,.32)}
.pf-n{font-size:12.5px;font-weight:800}
.pf-m{margin-left:auto;display:flex;gap:12px;text-align:right}
.pf-k{min-width:42px}
.pf-kv{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.pf-kl{font-size:9.5px;color:var(--tx3);margin-top:1px}
.pf-x{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pf-t{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}
.pf-t.g{background:var(--redDim);color:var(--red)}
.pf-t.b{background:var(--greenDim);color:#15803d}

/* ============ 上账时效提示条 ============ */
.lag-tip{
  display:flex;flex-direction:column;gap:3px;
  background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:11px;padding:10px 13px;margin-bottom:15px;
  box-shadow:var(--shadow-s);
}
.lag-tip b{font-size:12px;color:var(--tx2);font-weight:700;line-height:1.5}
.lag-tip span{font-size:10.5px;color:var(--tx3);line-height:1.65}
.lag-tip.warn{border-left-color:var(--amber);background:var(--amberDim)}
.lag-tip.warn b{color:#b45309}

/* ============ 深度成交分析 ============ */
/* 成交流水卡片 */
.tx-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-s)}
.tx-top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.tx-emp{font-size:12px;font-weight:800;white-space:nowrap}
.tx-ch{font-size:9.5px;padding:2px 7px;border-radius:5px;font-weight:700;white-space:nowrap}
.tx-ch.nat{background:var(--blueDim);color:var(--blue)}
.tx-ch.map{background:var(--purpleDim);color:var(--purple)}
.tx-ch.ref{background:var(--amberDim);color:#b45309}
.tx-ch.vip{background:var(--redDim);color:var(--red)}
.tx-type{font-size:9.5px;padding:2px 6px;border-radius:5px;font-weight:700;background:var(--soft);color:var(--tx3)}
.tx-prod{font-size:11px;color:var(--tx2);line-height:1.5;margin-bottom:5px}
.tx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tx-k{background:var(--soft);border-radius:8px;padding:5px 7px;text-align:center}
.tx-kv{font-size:12px;font-weight:800;letter-spacing:-.2px}
.tx-kl{font-size:9px;color:var(--tx3);margin-top:1px}
.tx-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tx-tag{font-size:9.5px;padding:2px 6px;border-radius:5px;font-weight:700;white-space:nowrap}
.tx-tag.disc{background:var(--amberDim);color:#b45309}
.tx-tag.bund{background:var(--purpleDim);color:var(--purple)}
.tx-tag.ret{background:var(--greenDim);color:#15803d}
.tx-tag.mem{background:var(--blueDim);color:var(--blue)}

/* 员工成交模式卡 */
.tx-pf{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow-s)}
.tx-pf-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.tx-pf-n{font-size:12.5px;font-weight:800}
.tx-pf-badge{font-size:9px;padding:2px 6px;border-radius:5px;font-weight:700;color:#fff}
.tx-pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.tx-pf-k{background:var(--soft);border-radius:8px;padding:5px 7px;text-align:center}
.tx-pf-kv{font-size:13px;font-weight:800;letter-spacing:-.2px}
.tx-pf-kl{font-size:9px;color:var(--tx3);margin-top:1px}
.tx-pf-act{font-size:11px;color:var(--tx2);line-height:1.7;padding:7px 9px;background:var(--soft);
  border-radius:9px;border-left:3px solid var(--blue)}
.tx-pf-act b{color:var(--blue)}

/* ============ 周计划 ============ */
.wp-tab{display:flex;gap:3px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.wp-tab::-webkit-scrollbar{height:0}
.wp-tab button{flex:none;padding:5px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:11px;font-weight:700;color:var(--tx2);cursor:pointer;
  transition:.16s;white-space:nowrap;font-family:inherit}
.wp-tab button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-s)}
.wp-tab button small{font-size:9px;font-weight:400;opacity:.75}
.wp-grid{display:grid;gap:7px}
.wp-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.wp-name{font-size:11.5px;font-weight:800;padding:7px 0;text-align:center;background:var(--soft);
  border-radius:8px;color:var(--tx)}
.wp-task{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:11px;color:var(--tx2);line-height:1.65}
.wp-task .done{color:var(--red);font-weight:700}
.wp-task .todo{color:var(--tx3)}
.wp-empty{padding:20px 0;text-align:center;color:var(--tx3);font-size:11px}

/* 运营周计划分区 */
.wp-sec-t{font-size:11px;font-weight:800;color:var(--tx2);margin:12px 0 7px;display:flex;align-items:center;gap:5px}
.wp-sec-t:first-child{margin-top:0}
.wp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.wp-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 6px;text-align:center;box-shadow:var(--shadow-s);position:relative}
.wp-kpi.st{border-color:rgba(245,158,11,.45);background:var(--amberDim)}
.wp-kpi-i{font-size:14px;line-height:1.2}
.wp-kpi-n{font-size:10.5px;font-weight:700;color:var(--tx);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-kpi-t{font-size:11px;font-weight:800;color:var(--blue);margin-top:1px}
.wp-kpi-note{font-size:8.5px;color:var(--tx3);margin-top:2px;line-height:1.4}
.wp-checks{display:flex;flex-wrap:wrap;gap:6px}
.wp-check{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--tx2);box-shadow:var(--shadow-s)}
.wp-check-i{font-size:12px}
.wp-who{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-bottom:6px;box-shadow:var(--shadow-s)}
.wp-who-n{font-size:11.5px;font-weight:800;color:var(--tx);flex:none}
.wp-who-p{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--purpleDim);color:var(--purple);flex:none}
.wp-who-t{font-size:11px;color:var(--tx2);margin-left:auto;text-align:right}
.wp-name.all{background:var(--amberDim);color:#b45309}
.wp-rules{font-size:10px;color:var(--tx3);line-height:1.8;background:var(--soft);
  border-radius:9px;padding:8px 11px;margin-top:10px}

/* ============ 核心 KPI ============ */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 13px 12px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-s);
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray)}
.kpi.s-done::after{background:var(--red)}
.kpi.s-over::after{background:var(--red)}
.kpi.s-on::after{background:var(--amber)}
.kpi.s-low::after{background:var(--green)}
.kpi.s-zero::after{background:var(--red)}
.kpi-l{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.kpi-v{font-size:clamp(21px,1.35rem + .55vw,28px);font-weight:800;margin:6px 0 3px;letter-spacing:-.6px}
.kpi-s{font-size:10.5px;color:var(--tx3)}
.kpi-r{
  position:absolute;right:11px;top:11px;font-size:11px;font-weight:800;
  padding:2px 7px;border-radius:7px;
}
.r-done{background:var(--redDim);color:var(--red)}
.r-over{background:var(--redDim);color:var(--red)}
.r-on{background:var(--amberDim);color:#b45309}
.r-low{background:var(--greenDim);color:#15803d}
.r-zero{background:var(--redDim);color:var(--red)}
.r-good{background:var(--redDim);color:var(--red)}
.r-na{background:var(--grayDim);color:var(--gray)}
.kpi-bar{height:5px;border-radius:3px;background:var(--soft);margin-top:9px;overflow:hidden}
.kpi-bar i{display:block;height:100%;border-radius:3px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.f-done{background:var(--red)} .f-over{background:var(--red)}
.f-on{background:var(--amber)} .f-low{background:var(--green)}
.f-zero{background:var(--red)}
.f-na{background:var(--gray)}

/* ============ 总览 hero + 图表 ============ */
.hero{display:flex;gap:15px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:100px;height:100px;flex:0 0 auto;cursor:pointer}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:clamp(21px,1.3rem + .5vw,29px);font-weight:800;letter-spacing:-.6px}
.ring-c span{font-size:9.5px;color:var(--tx3);margin-top:1px}
.hero-r{flex:1;min-width:0}
.hero-t{font-size:12px;font-weight:800;margin-bottom:8px;color:var(--tx2)}
.hero-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.hero-row span{color:var(--tx3)}
.hero-row b{font-weight:800}
.hero-tp{margin-top:9px;font-size:11.5px;color:var(--tx3)}
.hero-tp b{color:var(--purple);font-weight:800}

/* 品类速览柱状图 */
.mc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 12px 10px;box-shadow:var(--shadow-s)}
.mc-bars{display:flex;align-items:flex-end;gap:6px;height:122px}
.mc-b{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.mc-track{position:relative;width:100%;max-width:28px;height:100px;background:var(--soft);
  border-radius:7px;overflow:hidden;display:flex;align-items:flex-end}
.mc-f{width:100%;border-radius:7px 7px 0 0;transition:height .9s cubic-bezier(.22,1,.36,1)}
.mc-mk{position:absolute;left:-4px;right:-4px;height:0;border-top:1.5px dashed var(--purple);opacity:.8}
.mc-l{font-size:9px;color:var(--tx3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mc-leg{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx3);margin-top:9px}
.mc-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--purple)}

/* ============ 品类行 ============ */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-s)}
.row{padding:11px 13px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.row-t{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.row-n{font-size:13px;font-weight:700;flex:0 0 auto}
.row-v{font-size:12px;color:var(--tx2);margin-left:auto}
.row-v b{color:var(--tx);font-weight:800;font-size:14px}
.row-p{font-size:11px;font-weight:800;padding:1.5px 6px;border-radius:6px;flex:0 0 auto}
.row-bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;position:relative}
.row-bar i{display:block;height:100%;border-radius:3px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.row-bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--purple);border-radius:1px;opacity:.7}
.row-g{font-size:10.5px;color:var(--tx3);margin-top:6px;display:flex;justify-content:space-between}
.row-g em{font-style:normal;color:var(--green);font-weight:700}
.stat-low{color:var(--green)}
/* 品类达成：可点击下钻明细 */
.row.cat-click{cursor:pointer;transition:background .15s}
.row.cat-click:active{background:var(--soft)}
.row.cat-click.on{background:var(--soft)}
.row.cat-click .chev{margin-left:auto;color:var(--tx3);display:inline-flex;transition:transform .2s ease}
.row.cat-click .chev svg{width:16px;height:16px}
.row.cat-click.on .chev{transform:rotate(90deg);color:var(--purple)}
.row.pp-click{cursor:pointer;transition:background .15s}
.row.pp-click:active{background:var(--soft)}
.row.pp-click.on{background:var(--soft)}
.row.pp-click .chev{margin-left:auto;color:var(--tx3);display:inline-flex;transition:transform .2s ease}
.row.pp-click .chev svg{width:16px;height:16px}
.row.pp-click.on .chev{transform:rotate(90deg);color:var(--purple)}
.cat-det{display:none;padding:2px 13px 12px}
.cat-det.open{display:block;animation:detIn .22s ease}
.pp-det{display:none;padding:2px 13px 12px}
.pp-det.open{display:block;animation:detIn .22s ease}
/* 渠道挂账二级下钻：渠道 → 单品明细 */
.cd-click{cursor:pointer}
.cd-click:active{background:var(--soft)}
.cd-det{display:none;margin:4px 0 2px 10px}
.cd-det.open{display:block;animation:detIn .22s ease}
/* 点日期展开单号 */
.cd-date-click{cursor:pointer;color:var(--purple);text-decoration:underline dotted;text-underline-offset:2px}
.cd-date-click:active{opacity:.6}
.code-det{display:none}
.code-det.open{display:block;animation:detIn .22s ease}
.cdet-det{display:none}
.cdet-det.open{display:block;animation:detIn .22s ease}
.ddet-det{display:none}
.ddet-det.open{display:block;animation:detIn .22s ease}
.dcdet-det{display:none}
.dcdet-det.open{display:block;animation:detIn .22s ease}
.code-line{color:var(--tx3);font-size:10.5px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-list{border-top:1px dashed var(--line2);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.cd-item{background:rgba(124,58,237,.05);border-radius:10px;padding:7px 10px;font-size:11.5px}
.cd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cd-name{font-size:12px;font-weight:600;color:var(--tx1);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56%}
.cd-date{font-size:11px;color:var(--tx3);flex:0 0 auto}
.cd-date b{color:var(--tx1)}
.cd-sub{color:var(--tx3);margin-top:3px;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes detIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.det-list{border-top:1px dashed var(--line2);padding-top:9px;display:flex;flex-direction:column;gap:8px}
.det-item{background:var(--soft);border-radius:12px;padding:9px 11px}
.det-item.neg{background:var(--redDim)}
.det-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.det-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.35}
.det-date{font-size:11px;color:var(--tx3);flex:0 0 auto}
.det-meta{display:flex;gap:8px;margin-top:3px;font-size:11px;color:var(--tx2)}
.det-sku{color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.det-row{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--tx2);align-items:baseline}
.det-row b{font-weight:700;font-variant-numeric:tabular-nums}
.det-row .dv-origin{color:var(--tx2)}
.det-row .dv-disc{color:var(--tx2)}
.det-row .dv-profit{color:var(--green)}
.det-row .dv-gpr{color:var(--green)}
.det-row .dv-so{color:var(--tx2)}
.det-row .dv-cost{color:var(--tx2)}
.det-item.neg .det-row .dv-profit{color:var(--red)}
.det-empty{font-size:12px;color:var(--tx3);text-align:center;padding:10px 0}
.row.warn{background:linear-gradient(90deg,var(--redDim),transparent 60%)}

/* ============ 排行 ============ */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);color:var(--tx2);cursor:pointer;
  transition:.16s;white-space:nowrap;
}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.32)}
.rk{
  display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  position:relative;overflow:hidden;cursor:pointer;transition:.16s;
  box-shadow:var(--shadow-s);
}
.rk:active{transform:scale(.985)}
.rk-bg{position:absolute;left:0;top:0;bottom:0;opacity:.10;transition:width .9s cubic-bezier(.22,1,.36,1)}
.rk-no{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:0 0 auto;background:var(--soft);color:var(--tx3);
  position:relative;z-index:1;
}
.rk-no.n1{background:linear-gradient(135deg,#ffd257,#f0a723);color:#4a3400;box-shadow:0 2px 8px rgba(240,167,35,.32)}
.rk-no.n2{background:linear-gradient(135deg,#d6dbe8,#a9b3c6);color:#333c4c}
.rk-no.n3{background:linear-gradient(135deg,#e0b389,#c08a56);color:#3a2410}
.rk-m{flex:1;min-width:0;position:relative;z-index:1}
.rk-n{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.rk-n .me{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--purpleDim);color:var(--purple)}
.rk-sub{font-size:11px;color:var(--tx3);margin-top:3px}
.rk-r{text-align:right;flex:0 0 auto;position:relative;z-index:1}
.rk-r .p{font-size:18px;font-weight:800;letter-spacing:-.3px}
.rk-r .g{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* ============ 今日战报 ============ */
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* 今日品类横排 */
.strip-lab{font-size:10.5px;color:var(--tx3);font-weight:700;margin:2px 2px 8px}
.cat-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-strip::-webkit-scrollbar{display:none}
.cat-blk{flex:0 0 auto;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 7px 8px;text-align:center;box-shadow:var(--shadow-s);cursor:pointer;
  -webkit-tap-highlight-color:transparent;position:relative;transition:transform .15s ease,box-shadow .15s ease}
.cat-blk:active{transform:scale(.95)}
.cat-blk.zero{opacity:.38}
.cat-n{font-size:11.5px;font-weight:700}
.cat-q{font-size:10px;color:var(--tx3);margin-top:3px}
.cat-a{font-size:14.5px;font-weight:800;margin-top:1px;letter-spacing:-.3px}
.cat-p{font-size:9.5px;color:var(--green);margin-top:1px;font-weight:600}
/* 今日品类行式：无销售品类置灰 */
.row.zero-row{opacity:.45}
/* 今日品类横向柱 */
.cat-chart{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:7px}
.cat-chart i{display:block;height:100%;border-radius:3px;background:var(--grad);transform-origin:left;animation:barGrow .9s cubic-bezier(.22,1,.36,1) both}
.day{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 8px;text-align:center;box-shadow:var(--shadow-s);
  cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;
  transition:transform .15s ease,box-shadow .15s ease;
}
.day:active{transform:scale(.95)}
.day-det{display:none;padding:2px 2px 10px}
.day-det.open{display:block;animation:detIn .22s ease}

/* 今日图表：Donut + Bar 双卡 */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.chart-grid{grid-template-columns:1fr}}
.cg-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.cg-h{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--tx)}
.donut-wrap{position:relative;width:150px;height:150px;margin:4px auto 10px}
.donut-wrap svg{display:block}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center b{font-size:22px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.1}
.donut-center span{font-size:10px;color:var(--tx3);margin-top:1px;letter-spacing:.5px}
.donut-legend{display:flex;flex-direction:column;gap:4px}
.dl-i{display:grid;grid-template-columns:10px 1fr auto auto;gap:7px;align-items:center;font-size:12px}
.dl-swatch{width:10px;height:10px;border-radius:3px}
.dl-t{color:var(--tx);font-weight:600}
.dl-v{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.dl-p{color:var(--tx3);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.hb-list{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.hb-row{display:grid;grid-template-columns:54px 1fr 56px;gap:8px;align-items:center}
.hb-name{font-size:12.5px;font-weight:600;color:var(--tx);white-space:nowrap}
.hb-track{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;min-width:0}
.hb-fill{display:block;height:100%;border-radius:6px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.hb-v{font-size:12.5px;font-weight:700;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
.day-l{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-v{font-size:clamp(16px,1.1rem + .3vw,21px);font-weight:800;margin-top:3px;letter-spacing:-.3px}
.day-g{font-size:10px;margin-top:2px;font-weight:700}
.day.hit{border-color:rgba(239,68,68,.35);background:linear-gradient(180deg,var(--redDim),var(--panel))}
.day.miss .day-g{color:var(--green)}
.day.ok .day-g{color:var(--red)}
.day.zero .day-v{color:var(--red)}

/* ============ QCS ============ */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:var(--shadow-s)}
.q-l{font-size:11px;color:var(--tx3);margin-bottom:6px}
.q-v{font-size:19px;font-weight:800;letter-spacing:-.3px}
.q-v small{font-size:11px;font-weight:700;color:var(--tx3);margin-left:3px}
.q-s{font-size:10.5px;color:var(--tx3);margin-top:5px;line-height:1.5}
.q-s em{font-style:normal;font-weight:700}
.q.wide{grid-column:span 2}

/* ============ 弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:200;background:rgba(40,36,80,.42);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:flex-end;
}
.mask.on{display:flex;animation:fade .2s}
.sheet{
  width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:8px 18px calc(24px + var(--safeB));
  animation:up .34s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -12px 44px rgba(40,36,80,.28);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:4px}
.sheet .desc{font-size:12px;color:var(--tx3);line-height:1.6;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:700}
.fld input[type=text],.fld input[type=password]{
  width:100%;padding:11px 12px;border-radius:11px;font-size:13px;
  background:#fcfcff;border:1px solid var(--line2);color:var(--tx);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.fld input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purpleDim)}
.fld .hint{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.5}
.drop{
  border:1.5px dashed var(--line2);border-radius:13px;padding:28px 14px;
  text-align:center;cursor:pointer;transition:.18s;background:#fcfcff;
}
.drop:active,.drop.hover{border-color:var(--purple);background:var(--purpleDim)}
.drop .ic{color:var(--purple);margin:0 auto 8px;width:34px;height:34px}
.drop .ic svg{width:34px;height:34px;stroke:var(--purple)}
.drop .t{font-size:13px;font-weight:700}
.drop .s{font-size:11px;color:var(--tx3);margin-top:4px}
.btn{
  width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  font-size:14px;font-weight:800;transition:.16s;margin-top:6px;
  font-family:inherit;
}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.32)}
.btn-p:active{filter:brightness(.94)}
.btn-p:disabled{background:var(--soft);color:var(--tx3);cursor:not-allowed;box-shadow:none}
.btn-g{background:var(--soft);color:var(--tx2);border:1px solid var(--line)}
.log{
  margin-top:12px;padding:11px;border-radius:11px;background:#1b1e30;
  border:1px solid var(--line);font-size:11.5px;line-height:1.75;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#cdd2ea;
}
.log .ok{color:#4ade80} .log .er{color:#f87171}
.log .wa{color:#fbbf24} .log .in{color:#8a90ab}

/* ============ 其他 ============ */
.foot{text-align:center;font-size:10.5px;color:var(--tx3);padding:14px 0 4px;line-height:1.7}
.badge-live{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;
  color:#15803d;font-weight:700;
}
.badge-live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.toast{
  position:fixed;left:50%;top:calc(50% - 20px);transform:translate(-50%,-50%);
  background:#1f2233;color:#fff;border:1px solid rgba(255,255,255,.1);
  padding:13px 22px;border-radius:13px;font-size:13px;z-index:300;
  display:none;box-shadow:0 12px 44px rgba(40,36,80,.4);max-width:80vw;text-align:center;
}
.toast.on{display:block;animation:fade .2s}

/* ============ 彩带 ============ */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:15px;border-radius:2px;animation:fall 2.5s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) translateX(var(--x)) rotate(var(--r));opacity:.5}}

/* 桌面多栏（默认单列，≥1024 时启用） */
.cols{display:block}

/* ============ 平板：≥768 顶部横向导航 ============ */
@media(min-width:768px){
  body{padding-bottom:22px}
  .side{
    display:block;position:sticky;top:0;z-index:60;
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,247,251,.92));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 6px 22px rgba(70,60,130,.06);
  }
  .top{position:relative;box-shadow:none;border-bottom:none;padding:16px 22px 12px;max-width:960px;margin:0 auto}
  .tabs{
    position:static;flex:none;background:transparent;border-top:none;box-shadow:none;
    padding:0 22px 12px;max-width:960px;margin:0 auto;gap:6px;
    border-bottom:1px solid var(--line);
  }
  .tab{flex:none;flex-direction:row;gap:7px;padding:9px 16px;border-radius:11px;font-size:13px}
  .tab svg{width:18px;height:18px}
  .tab span{display:block!important;font-size:13px}
  .tab.on{background:var(--purpleDim)}
  .tab.on::after{display:none}
  .wrap{max-width:min(980px,100%);margin:0 auto;padding:20px 22px 40px}
  /* 流式网格：随平板宽度自动增减列（融外部看板 auto-fit 思路） */
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
  .day-grid{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
  .q-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .sheet{max-width:600px;margin:0 auto;border-radius:22px;align-self:center}
  .mask.on{align-items:center}
}
/* 平板横屏/小笔记本：早启用两栏，避免 880-1024 留白 */
@media(min-width:880px){
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .cols>.sec{margin-bottom:0}
}

/* ============ 电脑：≥1024 左侧固定边栏 + 流式多栏 ============ */
@media(min-width:1024px){
  /* 小桌面用窄侧栏，给内容区留够列宽；大桌面再加宽 */
  :root{--sideW:220px}
  body{padding-bottom:22px}
  .side{
    position:fixed;left:0;top:0;bottom:0;width:var(--sideW);z-index:60;
    display:flex;flex-direction:column;align-items:stretch;
    background:linear-gradient(180deg,#ffffff,#fbfbff);
    border-right:1px solid var(--line);border-bottom:none;
    padding:24px 16px;box-shadow:2px 0 22px rgba(70,60,130,.05);
    backdrop-filter:none;
  }
  .top{position:relative;padding:0 8px 16px;max-width:none;margin:0;background:transparent;border:none;box-shadow:none}
  .top-row{flex-wrap:wrap;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;font-size:12.5px}
  .top-t{flex:1 0 100%;order:3;margin-top:12px}
  .top-t h1{white-space:normal;line-height:1.45;letter-spacing:.3px}
  .top-t p{font-size:12px;margin-top:3px}
  .tp{margin-top:16px}
  .tabs{
    position:static;flex-direction:column;background:transparent;border-top:none;
    box-shadow:none;padding:8px 0 0;margin:0;gap:6px;border-bottom:none;
    flex:1;overflow-y:auto;
  }
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 15px;border-radius:12px;font-size:15px;text-align:left;transition:.16s}
  .tab svg{width:20px;height:20px}
  .tab span{display:block!important;font-size:15px;text-align:left}
  .tab.on{background:var(--purpleDim)}
  .tab.on::after{display:none}
  #app{margin-left:var(--sideW)}
  /* 内容宽度随屏幕伸缩：小屏铺满，超大屏封顶 1480 保证可读性 */
  .wrap{max-width:min(1480px,100%);margin:0 auto;padding:26px clamp(20px,3vw,42px) 52px}
  /* KPI / 今日战报：流式列数，屏幕越宽卡越多，绝不浪费 */
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .day-grid{grid-template-columns:repeat(auto-fit,minmax(116px,1fr))}
  .q-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .kpi-l{font-size:12px}
  .hero{padding:20px 22px;gap:22px}
  .ring{width:118px;height:118px}
  .mc-bars{height:140px}
  .mc-track{height:118px}
  /* 桌面：相邻区块并两列（minmax(0,1fr) 防止内容撑破） */
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  .cols>.sec{margin-bottom:0}
  .sheet{max-width:560px;margin:0 auto;border-radius:22px;align-self:center}
  .mask.on{align-items:center}
}

/* ============ 大桌面：≥1280 更宽侧栏、更大字号（融外部大屏优化思路） ============ */
@media(min-width:1280px){
  :root{--sideW:248px}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
}
/* ============ 动效（晨哥 2026-08-19：增加反馈与质感，先本地试行） ============ */
/* 入场：整屏淡入 + 卡片逐张浮现 */
.wrap{animation:viewIn .38s cubic-bezier(.22,1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpi,.rk,.day,.bt-c,.q,.ct,.pf,.adv,.mc,.card{animation:cardIn .4s cubic-bezier(.22,1,.36,1) both}
.kpi:nth-child(2){animation-delay:.04s}
.kpi:nth-child(3){animation-delay:.08s}
.kpi:nth-child(4){animation-delay:.12s}
.sec:nth-child(2){animation-delay:.05s}
.sec:nth-child(3){animation-delay:.1s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.row{animation:rowIn .32s cubic-bezier(.22,1,.36,1) both}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 进度条/图表：生长动画（scale 动画不依赖内联宽度，重渲染也会播） */
.kpi-bar i,.row-bar i{transform-origin:left;animation:barGrow .9s cubic-bezier(.22,1,.36,1) both}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mc-f{transform-origin:bottom;animation:barUp .8s cubic-bezier(.22,1,.36,1) both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* 可点元素：按压缩放 + 去点击高亮 */
.kpi,.rk,.day,.bt-c,.q,.ct,.pf,.adv,.mc,.tab,.chip,.row.cat-click,.pp-click,.cd-click,.mc-b[data-cat],.cat-dot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.kpi:active,.rk:active,.day:active,.tab:active,.chip:active,.row.cat-click:active,.pp-click:active,.cd-click:active:active,.mc-b[data-cat]:active{transform:scale(.965)}

/* 水波纹 */
.rp-ring{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.28),rgba(124,58,237,0) 70%);transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none;z-index:5}
@keyframes rp{0%{transform:scale(0);opacity:.9}100%{transform:scale(1);opacity:0}}
/* 让水波纹容器裁剪：对可点卡片类加 overflow 裁剪（不破坏布局） */
.kpi,.rk,.day,.bt-c,.q,.ct,.pf,.adv,.mc,.tab,.chip,.row.cat-click,.pp-click,.cd-click,.mc-b[data-cat]{position:relative;overflow:hidden}

/* 品类速览柱→达成行 联动高亮 */
.row.flash{background:var(--purpleDim);box-shadow:inset 0 0 0 1.5px var(--purple)}
.row.flash{animation:flashPulse .6s ease 2}
@keyframes flashPulse{0%,100%{background:var(--purpleDim)}50%{background:var(--soft)}}

/* —— 回收业务合并两行（乐机收 + 太力回收）—— */
.rec-list{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.rec-list .q-s{font-size:13px;color:var(--tx2);padding:1px 0}
.rec-list .num{color:var(--tx1);margin:0 2px;font-weight:700}
</style>
</head>

/* ---------------- 工具 ---------------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const isNum = v => typeof v === 'number' && isFinite(v);

function money(v, dec){
  if(!isNum(v)) return '—';
  const d = dec === undefined ? (Math.abs(v) >= 10000 ? 0 : 0) : dec;
  return '¥' + Number(v).toFixed(d);
}
function moneyShort(v){
  if(!isNum(v)) return '—';
  return String(Math.round(v));
}
function cnt(v){ return isNum(v) ? String(Math.round(v)) : '—'; }
/* 精准金额：整数原样（带千分位），不缩写「万」。用于渠道挂账板块。 */
function moneyFull(v){
  if(!isNum(v)) return '—';
  return String(Math.round(v));
}
function pct(v, dec){
  if(!isNum(v)) return '—';
  return (v*100).toFixed(dec === undefined ? 1 : dec) + '%';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 状态判定：done / over / on / low / zero / na
   颜色规则（与Excel底表条件格式一致，晨哥拍板）：
   红 = 在时间进度内/已达标/超额，绿 = 不在时间进度（落后），零成交 = 红色提醒 */
function stat(rate){
  const tp = DATA.meta.timeProgress;
  if(!isNum(rate)) return 'na';
  if(rate >= 1) return 'done';
  if(!isNum(tp) || tp <= 0) return 'done';
  if(rate === 0) return 'zero';
  if(rate >= tp) return 'over';
  if(rate >= tp * CFG.th.on)  return 'on';
  return 'low';
}
function isCritical(rate){
  return isNum(rate) && rate === 0;
}
/* 绩效得分颜色：满分105（100基础分+全科生加5分），≥100 达标→红，<100 未达标→绿（晨哥2026-09-01拍板：红=达标语义） */
function perfCol(v){
  return (isNum(v) && v >= 100) ? 'color:var(--red)' : 'color:var(--green)';
}
/* 全科生搭售率数值颜色：gap>=0（达标/超额）→红，gap<0（未达标）→绿（晨哥2026-09-01） */
function qRateCol(gap){
  if(!isNum(gap)) return '';
  return gap >= 0 ? 'color:var(--red)' : 'color:var(--green)';
}
const STAT_TXT = { done:'已达成', over:'在进度', on:'接近进度', low:'不在进度', zero:'未开张', na:'无任务' };

/* 进度提示行（short = 缺口量，>0=缺口多少，<0=超额完成）：
   - short>0 未完成：状态词 + 「缺口 X[单位]」
   - short<=0 已完成：只给形容词（超额完成/任务已达成），不写金额——
     月份未结束，写金额容易给人已结清/超额完成的错觉（晨哥 2026-08-19 拍板）。
   注意：品类行 gap 是 done-task（负=缺），挂账行 gap 是 task-done（正=缺），
   调用方需先把 gap 归一到「缺口」语义再传入。 */
function gapHintHTML(s, short, fmt, unit){
  if(!isNum(short)) return '';
  let inner;
  if(short > 0){
    const w = {low:'不在进度', on:'接近进度', over:'在进度', done:'已达成', zero:'未开张'}[s] || STAT_TXT[s] || '进度';
    inner = '<span>' + w + '</span><em>缺口 ' + fmt(short) + (unit || '') + '</em>';
  }else{
    const w = (short < 0) ? '超额完成' : '任务已达成';
    inner = '<span style="color:var(--red);font-weight:700">' + w + '</span>';
  }
  return '<div class="row-g">' + inner + '</div>';
}

/* 是否有任务 */
function hasTask(k){ return k && isNum(k.task) && k.task !== 0; }

/* 单位：哪些指标是金额 */
const MONEY_KEYS = new Set(['毛利','销额','增值']);

/* 同一行内统一单位：完成量和任务量都上万才换算成"万"，否则一律用元 */
function unitOf(key, k){
  if(!MONEY_KEYS.has(key)) return 'cnt';
  if(!k) return 'yuan';
  const d = isNum(k.done) ? Math.abs(k.done) : 0;
  const t = isNum(k.task) ? Math.abs(k.task) : d;
  return (d >= 10000 && t >= 10000) ? 'wan' : 'yuan';
}
function fmtU(v, u){
  if(!isNum(v)) return '—';
  if(u === 'cnt')  return String(Math.round(v));
  return String(Math.round(v));
}

/* ---------------- 渲染：进度条组件 ---------------- */
function barHTML(rate, s){
  const tp = DATA.meta.timeProgress;
  const w  = isNum(rate) ? Math.min(rate, 1) * 100 : 0;
  const mk = isNum(tp) ? Math.min(tp, 1) * 100 : null;
  return '<div class="row-bar"><i class="f-' + s + '" style="width:' + w.toFixed(1) + '%"></i>'
       + (mk !== null ? '<span class="mk" style="left:' + mk.toFixed(1) + '%"></span>' : '')
       + '</div>';
}

function kpiCard(label, k, key){
  if(!k) return '';
  const s = hasTask(k) ? stat(k.rate) : 'na';
  const rateTxt = hasTask(k) ? pct(k.rate,1) : '无任务';
  const u = unitOf(key, k);
  return '<div class="kpi s-' + s + '" data-kpi="' + esc(key) + '">'
    + '<div class="kpi-r r-' + s + '">' + rateTxt + '</div>'
    + '<div class="kpi-l">' + esc(label) + '</div>'
    + '<div class="kpi-v num">' + fmtU(k.done, u) + '</div>'
    + '<div class="kpi-s num">任务 ' + (hasTask(k) ? fmtU(k.task, u) : '—')
    + (isNum(k.gap) && hasTask(k) && k.gap < 0 ? ' · <span style="color:var(--green)">缺 ' + fmtU(-k.gap, u) + '</span>' : '')
    + (isNum(k.gap) && hasTask(k) && k.gap > 0 ? ' · <span style="color:var(--red)">超 ' + fmtU(k.gap, u) + '</span>' : '') + '</div>'
    + '<div class="kpi-bar"><i class="f-' + s + '" style="width:'
    + (isNum(k.rate) ? Math.min(k.rate,1)*100 : 0).toFixed(1) + '%"></i></div>'
    + '</div>';
}

function catRow(name, k, key, person){
  if(!k) return '';
  const has = hasTask(k);
  const s   = has ? stat(k.rate) : 'na';
  const crit = has && isCritical(k.rate);
  const u = unitOf(key, k);
  const pc = person ? ' data-person="' + esc(person) + '"' : '';
  return '<div class="row cat-click' + (crit ? ' warn' : '') + '" data-cat="' + esc(name) + '"' + pc + '>'
    + '<div class="row-t">'
      + '<span class="row-n">' + esc(name) + '</span>'
      + '<span class="row-p r-' + s + '">' + (has ? pct(k.rate,0) : '无任务') + '</span>'
      + '<span class="row-v num"><b>' + fmtU(k.done, u) + '</b>'
      + (has ? ' / ' + fmtU(k.task, u) : '') + '</span>'
      + '<span class="chev">' + ic('chev') + '</span>'
    + '</div>'
    + barHTML(k.rate, s)
    + (has ? gapHintHTML(s, -k.gap, v => fmtU(v, u), u === 'cnt' ? '台' : '') : '')
    + '</div>'
    + '<div class="cat-det" data-cat="' + esc(name) + '"' + pc + '></div>';
}

/* 环形进度 */
function ringSVG(rate, s, size){
  const r = (size - 16) / 2, c = 2 * Math.PI * r;
  const w = isNum(rate) ? Math.min(rate, 1) : 0;
  const off = c * (1 - w);
  const col = {done:'#ef4444', over:'#ef4444', on:'#f59e0b', low:'#22c55e', zero:'#ef4444', na:'#9aa0bd'}[s] || '#9aa0bd';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="rgba(30,28,60,.07)" stroke-width="10"/>'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round"'
    + ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"'
    + ' transform="rotate(-90 ' + (size/2) + ' ' + (size/2) + ')" style="transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)"/>'
    + '</svg>';
}

/* ============ 今日图表：Donut(毛利占比) + Bar(增值排行) ============ */
const CHART_PALETTE = ['#6366f1','#22c55e','#06b6d4','#eab308','#f43f5e','#a855f7','#14b8a6','#fb923c'];

/* Donut 环形图：items=[{label,value,color}], size=直径。返回 SVG 字符串。
   中心数字与标签由调用方在外层 HTML 叠加（更灵活）。 */
function donutSVG(items, size){
  const total = items.reduce((s,it) => s + (isNum(it.value) ? it.value : 0), 0);
  if(!total) return '<div style="width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px">暂无数据</div>';
  const cx = size / 2, cy = size / 2;
  const r = (size / 2) - 14;
  const c = 2 * Math.PI * r;
  let acc = 0, parts = '';
  items.forEach((it) => {
    const v = isNum(it.value) ? it.value : 0;
    if(!v) return;
    const frac = v / total;
    const dash = (frac * c).toFixed(2);
    const gap  = (c - parseFloat(dash)).toFixed(2);
    const off  = (-acc * c).toFixed(2);
    parts += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + it.color + '" stroke-width="18"'
          + ' stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="' + off + '"'
          + ' transform="rotate(-90 ' + cx + ' ' + cy + ')" style="transition:stroke-dasharray .8s cubic-bezier(.22,1,.36,1)"/>';
    acc += frac;
  });
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + parts + '</svg>';
}

/* 横向条形排行：items=[{label,value}] 已降序。maxV 不传时自动取 items 中最大值。返回 HTML 字符串。 */
function hbarSVG(items, maxV){
  if(!maxV) maxV = items.reduce((m,it) => Math.max(m, isNum(it.value) ? it.value : 0), 1);
  const mv = Math.max(maxV, 1);
  let h = '';
  items.forEach((it, i) => {
    const v = isNum(it.value) ? it.value : 0;
    const w = v > 0 ? Math.max(v / mv * 100, 4) : 0;
    const col = CHART_PALETTE[i % CHART_PALETTE.length];
    const valTxt = v > 0 ? moneyShort(v) : '0';
    h += '<div class="hb-row">'
       +   '<span class="hb-name">' + esc(it.label) + '</span>'
       +   '<span class="hb-track"><span class="hb-fill" style="width:' + w.toFixed(1) + '%;background:' + col + '"></span></span>'
       +   '<span class="hb-v num">' + valTxt + '</span>'
       + '</div>';
  });
  return h;
}

/* 彩带动效（纯 DOM，无 canvas，无外部库） */
function confetti(n){
  n = n || 110;
  const box = document.createElement('div');
  box.className = 'confetti';
  const cols = ['#7c3aed','#a855f7','#22c55e','#ef4444','#f59e0b','#6366f1'];
  for(let i = 0; i < n; i++){
    const s = document.createElement('i');
    s.style.left = (Math.random() * 100) + '%';
    s.style.background = cols[i % cols.length];
    s.style.setProperty('--x', (Math.random() * 220 - 110) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = (Math.random() * 0.4) + 's';
    s.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3000);
}

/* 考核机型 —— 独立板块
   names 传入姓名数组则逐人列出；不传只显示单条 */
function assessHTML(kh, names){
  if(!kh) return '';
  const gc = v => (isNum(v) && v < 0) ? 'var(--green)' : 'var(--red)';   /* 缺=绿(落后)，超/齐=红(领先) */
  let h = '<div class="sec"><div class="sec-h"><span class="bar"></span><b>考核机型</b>'
        + '<span class="tail">未完成 −100/台</span></div>';
  h += '<div class="card" style="padding:13px 14px">';

  h += '<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'
     + '<span style="font-size:11.5px;color:var(--tx3)">' + (names ? '门店任务' : '任务') + '</span>'
     + '<b class="num" style="font-size:24px;letter-spacing:-.5px">' + cnt(kh.task) + '</b>'
     + '<span style="font-size:11.5px;color:var(--tx3)">台</span>'
     + '<span style="flex:1"></span>'
     + '<span style="font-size:11.5px;color:var(--tx3)">' + (isNum(kh.gap) && kh.gap >= 0 ? '超额' : '缺口') + '</span>'
     + '<b class="num" style="font-size:20px;color:' + gc(kh.gap) + '">' + cnt(kh.gap) + '</b>'
     + '</div>';

  if(names && names.length){
    h += '<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:4px">';
    names.forEach(n => {
      const p = DATA.people[n];
      const k = p && p.qcs && p.qcs['考核机型'];
      if(!k) return;
      const noTask = !isNum(k.task) || k.task === 0;
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">'
         + '<span style="flex:1;font-size:13px;font-weight:600">' + esc(n) + '</span>'
         + '<span class="num" style="font-size:12.5px;color:var(--tx2)">任务 '
         + (noTask ? '<em style="color:var(--tx3);font-style:normal">—</em>' : cnt(k.task)) + '</span>'
         + '<span class="num" style="font-size:13px;font-weight:700;min-width:42px;text-align:right;color:'
         + (noTask ? 'var(--tx3)' : gc(k.gap)) + '">' + (noTask ? '—' : cnt(k.gap)) + '</span>'
         + '</div>';
    });
    h += '</div>';
  }

  h += '</div></div>';
  return h;
}

/* QCS 卡片组 */
function qcsHTML(Q){
  if(!Q) return '<div class="empty">暂无数据</div>';
  let h = '<div class="q-grid">';

  const dx = Q['电信积分'];
  if(dx){
    const s = hasTask(dx) ? stat(dx.rate) : 'na';
    const dxs = isNum(dx.gap) ? (dx.gap > 0 ? ' · <span style="color:var(--red)">超 ' + cnt(dx.gap) + '</span>'
                                          : (dx.gap < 0 ? ' · <span style="color:var(--green)">缺 ' + cnt(-dx.gap) + '</span>' : '')) : '';
    h += '<div class="q"><div class="q-l">电信积分（5分）</div>'
      + '<div class="q-v num">' + cnt(dx.done) + '<small>/ ' + cnt(dx.task) + '</small></div>'
      + '<div class="q-s">达成 <em class="r-' + s + '" style="padding:1px 4px;border-radius:4px">' + pct(dx.rate,0) + '</em>' + dxs + '</div></div>';
  }

  const hy = Q['会员搭售率'];
  if(hy){
    h += '<div class="q"><div class="q-l">会员搭售率（30%）</div>'
      + '<div class="q-v num" style="' + qRateCol(hy.gap) + '">' + pct(hy.rate,1) + '</div>'
      + '<div class="q-s">Care+ ' + cnt(hy.care) + ' / 终端 ' + cnt(hy.terminal)
      + (isNum(hy.gap) && hy.gap > 0 ? ' · 超 <em style="color:var(--red)">' + cnt(hy.gap) + '</em>' : '')
      + (isNum(hy.gap) && hy.gap < 0 ? ' · 缺 <em style="color:var(--green)">' + cnt(-hy.gap) + '</em>' : '')
      + '</div></div>';
  }

  const hs = Q['回收搭售率'];
  if(hs){
    h += '<div class="q"><div class="q-l">回收搭售率（20%）</div>'
      + '<div class="q-v num" style="' + qRateCol(hs.gap) + '">' + pct(hs.rate,1) + '</div>'
      + '<div class="q-s">单数 ' + cnt(hs.orders)
      + (isNum(hs.gap) && hs.gap > 0 ? ' · 超 <em style="color:var(--red)">' + cnt(hs.gap) + '</em>' : '')
      + (isNum(hs.gap) && hs.gap < 0 ? ' · 缺 <em style="color:var(--green)">' + cnt(-hs.gap) + '</em>' : '')
      + '</div></div>';
  }

  const tm = Q['贴膜率'];
  if(tm){
    h += '<div class="q"><div class="q-l">贴膜率（50%）</div>'
      + '<div class="q-v num" style="' + qRateCol(tm.gap) + '">' + pct(tm.rate,1) + '</div>'
      + '<div class="q-s">单数 ' + cnt(tm.orders)
      + (isNum(tm.gap) && tm.gap > 0 ? ' · 超 <em style="color:var(--red)">' + cnt(tm.gap) + '</em>' : '')
      + (isNum(tm.gap) && tm.gap < 0 ? ' · 缺 <em style="color:var(--green)">' + cnt(-tm.gap) + '</em>' : '')
      + '</div></div>';
  }

  /* 回收业务：乐机收(《李家村销售》T14:U18 直读) + 太力回收 合并为单卡两行 */
  const lh = Q['乐机收'];
  const th = Q['太力回收'];
  if(lh || th){
    let _rows = '';
    if(lh){
      _rows += '<div class="q-s">乐机收 <b class="num">' + cnt(lh.orders)
            + '</b> 单 · 公司净利 ' + money(lh.amount) + '</div>';
    }
    if(th){
      _rows += '<div class="q-s">太力回收 <b class="num">' + cnt(th.orders)
            + '</b> 单 · ' + money(th.amount)
            + (isNum(th['增值']) ? ' · 增值 ' + money(th['增值']) : '') + '</div>';
    }
    h += '<div class="q wide">'
      + '<div class="q-l">回收业务</div>'
      + '<div class="rec-list">' + _rows + '</div></div>';
  }

  const xl = Q['星联会员'];
  if(xl){
    h += '<div class="q"><div class="q-l">星联会员</div>'
      + '<div class="q-v num">' + cnt(xl['合计']) + '</div>'
      + '<div class="q-s">优享 ' + cnt(xl['优享']) + ' · 尊享 ' + cnt(xl['尊享']) + '</div></div>';
  }

  const jk = Q['健康度'];
  if(jk){
    h += '<div class="q"><div class="q-l">健康度</div>'
      + '<div class="q-v num">' + pct(jk.grossMargin,1) + '<small>毛利率</small></div>'
      + '<div class="q-s">券 ' + moneyShort(jk.coupon) + ' · 占比 ' + pct(jk.ratio,0)
      + '<br>增值率 ' + pct(jk['增值率'],1) + '</div></div>';
  }

  h += '</div>';
  return h;
}

/* ---------------- 渠道挂账（运营板内复用） ---------------- */
function qudaoSections(){
  const Q = DATA.qudao;
  if(!Q) return '<div class="sec"><div class="card" style="padding:20px;text-align:center;color:var(--tx3)">暂无渠道挂账数据</div></div>';
  const t = Q.total || {};
  const tp = Q.timeRate;
  const s = isNum(t.rate) ? stat(t.rate) : 'na';
  let h = '';

  /* 汇总卡 */
  h += '<div class="sec"><div class="sec-h"><span class="bar"></span><b>渠道挂账</b>'
     + '<span class="tail">时间进度 ' + pct(tp,1) + '</span></div>';
  h += '<div class="card" style="padding:15px">';
  h += '<div style="display:flex;align-items:baseline;gap:8px">'
     + '<b class="num" style="font-size:28px;font-weight:800;letter-spacing:-.5px">' + moneyFull(t.done) + '</b>'
     + '<span style="font-size:12px;color:var(--tx3)">/ ' + moneyFull(t.task) + ' 目标</span>'
     + '<span style="flex:1"></span>'
     + '<span class="r-' + s + '" style="font-size:13px;font-weight:800;padding:3px 9px;border-radius:8px">' + pct(t.rate,1) + '</span>'
     + '</div>';
  h += '<div class="kpi-bar" style="margin-top:12px"><i class="f-' + s + '" style="width:'
     + (isNum(t.rate) ? Math.min(t.rate,1)*100 : 0).toFixed(1) + '%"></i></div>';
  const lag = isNum(t.rate) && isNum(tp) && t.rate < tp;
  h += '<div style="margin-top:10px;font-size:11.5px;color:var(--tx3);line-height:1.6">'
     + '数据日期 ' + esc(Q.timeDate || '—') + ' · 已过 ' + pct(tp,1)
     + (lag ? ' <span style="color:var(--green);font-weight:700;display:inline-flex;align-items:center;gap:3px">'
              + ic('warn',13) + ' 进度落后</span>'
            : ' <span style="color:var(--red);font-weight:700">跟上节奏</span>')
     + '</div>';
  h += '</div></div>';

  /* 逐人（渠道挂账口径：含全部业务类型；点击行下钻渠道明细） */
  h += '<div class="sec"><div class="sec-h"><span class="bar"></span><b>逐人进度</b>'
     + '<span class="tail">点击行下钻渠道明细</span></div><div class="rows">';
  (Q.people || []).forEach(p => {
    const has = isNum(p.task) && p.task !== 0;
    const ps = has ? stat(p.rate) : 'na';
    const crit = has && isCritical(p.rate);
    h += '<div class="row pp-click' + (crit ? ' warn' : '') + '" data-person="' + esc(p.name) + '" onclick="togglePerson(\'' + esc(p.name) + '\')">'
      + '<div class="row-t">'
        + '<span class="row-n">' + esc(p.name) + '</span>'
        + '<span class="row-p r-' + ps + '">' + (has ? pct(p.rate,0) : '无任务') + '</span>'
        + '<span class="row-v num"><b>' + moneyFull(p.done) + '</b>' + (has ? ' / ' + moneyFull(p.task) : '') + '</span>'
        + '<span class="chev">' + ic('chev') + '</span>'
      + '</div>'
      + barHTML(p.rate, ps)
      + (has ? gapHintHTML(ps, p.gap, moneyFull) : '')
      + '</div>'
      + '<div class="pp-det" data-person="' + esc(p.name) + '"></div>';
  });
  h += '</div></div>';
  return h;
}
function renderQudao(){
  if(!DATA.qudao) return '<div class="wrap"><div class="empty">暂无渠道挂账数据</div></div>';
  return '<div class="wrap">' + qudaoSections() + foot() + '</div>';
}

/* ---------------- 动效：点击水波纹（一次性委托，避免每次 render 重绑） ---------------- */
(function(){
  var RP_SEL = '.kpi,.rk,.day,.tab,.chip,.row.cat-click,.pp-click,.cd-click,.mc-b[data-cat]';
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest(RP_SEL) : null;
    if(!t) return;
    var rect = t.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height, 40);
    var r = document.createElement('span');
    r.className = 'rp-ring';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size / 2) + 'px';
    r.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
    t.appendChild(r);
    setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 600);
  });
})();

/* 今日明细：点击展开某指标/品类的当天逐单明细（供今日品类行下钻调用） */
function dayMetricItems(k){
  const dd = DATA.dayDetails || [];
  const CATS = { '手机':['手机'],'PC':['PC'],'平板':['平板'],'穿戴':['穿戴'],'音频':['音频'],
                 'HD':['HD'],'智慧办公':['PC','平板'],'音频穿戴':['穿戴','音频'],'增值':['增值'] };
  if(CATS[k]) return dd.filter(r => CATS[k].indexOf(r.cat) !== -1);
  if(k === '毛利' || k === '销额') return dd.slice();
  if(k === '滞销'){
    const khj = ["01.001.010.00","01.001.011.002","01.001.012.00","01.001.013.0","01.001.031.002",
                 "01.001.032.002","01.001.043.002","01.001.044.002","01.001.001.0","01.001.002.0","01.001.003"];
    return dd.filter(r => khj.some(p => r.sku.indexOf(p) === 0));
  }
  const rx = { '贴膜':/膜|套包/, '回收':/回收/, '会员':/Care|会员|星联优享/,
               '电信积分':/入网/, '摄影课':/大师课/ }[k];
  if(rx) return dd.filter(r => ((k === '贴膜' || k === '摄影课') ? (r.amount > 0 && rx.test(r.product)) : rx.test(r.product)));
  return null;
}

function dayMetricHTML(k, items){
  let h = '<div class="det-list">';
  items.forEach((it, i) => {
    const neg = (it.amount || 0) < 0;
    h += '<div class="det-item' + (neg ? ' neg' : '') + '">'
      + '<div class="det-top"><span class="det-name">' + esc(it.product || '—') + '</span>'
      + '<span class="det-date num">' + esc(it.emp || '—') + ' · ' + (it.qty || 0) + '件</span></div>'
      + '<div class="det-row num">'
      + '<span class="dv-profit">金额: <b>' + fmtNum(it.amount) + '</b></span>'
      + '<span class="dv-profit">毛利: <b>' + fmtNum(it.profit) + '</b></span>'
      + '<span class="dv-gpr">毛利率: <b>' + (it.gpr == null ? '—' : (it.gpr * 100).toFixed(1) + '%') + '</b></span>'
      + '<span class="dv-cost">成本: <b>' + fmtNum(it.cost) + '</b></span>'
      + '</div></div>';
  });
  h += '</div>';
  return '<div class="sec-h" style="margin-top:10px"><span class="bar"></span><b>' + esc(k) + ' · 当天明细</b>'
       + '<span class="tail">' + items.length + ' 行</span></div>' + h;
}

function clickDayMetric(k){
  const det = document.querySelector('.day-det');
  if(!det) return;
  const items = dayMetricItems(k);
  if(!items || !items.length){
    toast('今日「' + k + '」暂无逐单明细');
    return;
  }
  det.innerHTML = dayMetricHTML(k, items);
  det.scrollIntoView({behavior:'smooth', block:'nearest'});
  det.classList.add('open');
}


/* ---------------- 视图 2：排行 ---------------- */
const RANK_DIMS = [
  {k:'毛利',   src:'performance'},
  {k:'销额',   src:'performance', label:'销售额'},
  {k:'手机',   src:'performance'},
  {k:'音频穿戴', src:'performance'},
  {k:'穿戴',   src:'performance'},
  {k:'增值',   src:'qcs'},
  {k:'电信积分', src:'qcs'},
];

function renderRank(){
  const dim = RANK_DIMS.find(d => d.k === RANK_BY) || RANK_DIMS[0];
  const list = DATA.meta.employees.map(n => {
    const p = DATA.people[n] || {};
    const k = ((p[dim.src] || {})[dim.k]) || null;
    return { name:n, k:k, done: (k && isNum(k.done)) ? k.done : -Infinity,
             rate:(k && isNum(k.rate)) ? k.rate : null, has: hasTask(k) };
  });
  // 排序：有任务的按达成率，没任务的按完成量垫底
  list.sort((a,b) => {
    if(a.has !== b.has) return a.has ? -1 : 1;
    if(a.has) return (b.rate||0) - (a.rate||0);
    return b.done - a.done;
  });

  let h = '<div class="wrap">';
  h += '<div class="chips">';
  RANK_DIMS.forEach(d => {
    h += '<div class="chip' + (d.k === RANK_BY ? ' on' : '') + '" data-dim="' + d.k + '">'
       + esc(d.label || d.k) + '</div>';
  });
  h += '</div>';

  h += '<div class="sec-h"><span class="bar"></span><b>' + esc(dim.label||dim.k) + ' 排行</b>'
     + '<span class="tail">共 ' + list.length + ' 人</span></div>';

  h += '<div class="cols">';
  list.forEach((it, i) => {
    const s = it.has ? stat(it.rate) : 'na';
    const colorVar = {done:'--red',over:'--red',on:'--amber',low:'--green',zero:'--red',na:'--gray'}[s];
    const w = it.has && isNum(it.rate) ? Math.min(it.rate,1)*100 : 0;
    h += '<div class="rk" data-person="' + esc(it.name) + '">'
      + '<div class="rk-bg" style="width:' + w.toFixed(1) + '%;background:var(' + colorVar + ')"></div>'
      + '<div class="rk-no' + (it.has && i<3 ? ' n'+(i+1) : '') + '">' + (it.has ? (i+1) : '—') + '</div>'
      + '<div class="rk-m">'
        + '<div class="rk-n">' + esc(it.name) + '</div>'
        + '<div class="rk-sub num">' + fmtU(it.k ? it.k.done : null, unitOf(dim.k, it.k))
        + (it.has ? ' / ' + fmtU(it.k.task, unitOf(dim.k, it.k)) : ' · 未分配任务') + '</div>'
      + '</div>'
      + '<div class="rk-r">'
        + '<div class="p num" style="color:var(' + colorVar + ')">' + (it.has ? pct(it.rate,0) : '—') + '</div>'
        + '<div class="g">' + (it.has && it.k && isNum(it.k.gap)
            ? (it.k.gap < 0 ? '缺 ' + fmtU(-it.k.gap, unitOf(dim.k, it.k))
                            : '超 ' + fmtU(it.k.gap, unitOf(dim.k, it.k)))
            : STAT_TXT[s]) + '</div>'
      + '</div>'
      + '</div>';
  });
  h += '</div>'; /* /cols */

  h += '<div style="font-size:11px;color:var(--tx3);text-align:center;padding:8px 0 2px;line-height:1.7">'
     + '点任意一行查看该员工完整数据</div>';
  h += foot();
  h += '</div>';
  return h;
}

     + '<span class="tail">' + esc(DATA.meta.dayTitle || '') + '</span></div>';

    h += '<div class="sec"><div class="card" style="padding:14px;text-align:center">'
      + '<div style="font-size:11px;color:var(--tx3)">个人绩效得分</div>'
      + '<div class="num" style="font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-1px;'
      + perfCol(P['绩效']) + '">' + P['绩效'].toFixed(2) + '</div></div></div>';
  }

  h += foot();
  h += '</div>';
  return h;
}

/* ---------------- 视图 4：今日 ---------------- */
const DAY_ORDER = ['毛利','销额','增值','手机','音频穿戴','智慧办公','HD','会员','回收','贴膜','电信积分','滞销','优享/会员','摄影课','尊享/储值'];
const GAP_ALIAS = { '会员':'Care+' };

function dayHTML(done, gap){
  done = done || {}; gap = gap || {};
  const keys = DAY_ORDER.filter(k => k in done || (GAP_ALIAS[k] || k) in gap);
  if(!keys.length) return '<div class="empty">暂无今日数据</div>';
  let h = '<div class="day-grid">';
  keys.forEach(k => {
    const dv = done[k];
    const gk = (GAP_ALIAS[k] && (GAP_ALIAS[k] in gap)) ? GAP_ALIAS[k] : k;
    const gv = gap[gk];
    const isM = MONEY_KEYS.has(k);
    /* dailyGap 口径（calc_data.calc_gap）：正数=今日任务，0=无任务；缺口=任务-完成 */
    const hasT = isNum(gv) && gv > 0;
    const dvNum = isNum(dv) ? dv : 0;
    const doneUp = hasT && dvNum >= gv;   /* 完成 >= 任务 = 已达成 */
    const zero = !isNum(dv) || dv === 0;
    let cls = 'day';
    if(doneUp) cls += ' hit ok'; else if(hasT) cls += ' miss';
    if(zero) cls += ' zero';
    h += '<div class="' + cls + '" data-metric="' + esc(k) + '" onclick="clickDayMetric(\'' + esc(k) + '\')">'
      + '<div class="day-l">' + esc(k) + '</div>'
      + '<div class="day-v num">' + (isM ? moneyShort(dv) : cnt(dv)) + '</div>'
      + '<div class="day-g num">' + (hasT
          ? (doneUp ? '达成 ✓' : '任务 ' + (isM ? moneyShort(gv) : cnt(gv)))
          : '&nbsp;') + '</div>'
      + '</div>';
  });
  h += '</div>';
  return h;
}

/* ============ 今日图表：Donut(当日增值品类构成) + Bar(当日全员增值排行) ============ */
function dayChartsHTML(dd, meta){
  /* 当日增值明细：优先从 dayDetails 取 cat=='增值'，回退到全月增值明细按当日日期过滤 */
  const dayDate = (meta.date || '').slice(0,10);
  let zzDay = (dd || []).filter(r => r.cat === '增值');
  if(!zzDay.length){
    const zzAll = (DATA.details && DATA.details['增值']) || [];
    zzDay = zzAll.filter(r => (r.date || '').slice(0,10) === dayDate);
  }

  /* Donut 数据：当日增值按商品名称聚合毛利，降序，取前 5 + 其他（含负数项，与每日任务口径一致） */
  const pfByName = {};
  let totalPfAll = 0;
  zzDay.forEach(r => {
    const n = (r.product || r.name || '其他').replace(/^COOYEE\s*/i,'').replace(/^Cooyee\s*/,'');
    const v = isNum(r.profit) ? r.profit : 0;
    pfByName[n] = (pfByName[n]||0) + v;
    totalPfAll += v;
  });
  const names = Object.keys(pfByName).sort((a,b) => Math.abs(pfByName[b]) - Math.abs(pfByName[a]));
  const top = names.slice(0, 5);
  const restSum = names.slice(5).reduce((s,c) => s + pfByName[c], 0);
  const donutItems = top.map((c,i) => ({ label:c, value:pfByName[c], color:CHART_PALETTE[i % CHART_PALETTE.length] }));
  if(Math.abs(restSum) > 0.001) donutItems.push({ label:'其余' + names.slice(5).length + '项', value:restSum, color:CHART_PALETTE[5 % CHART_PALETTE.length] });
  const totalPf = totalPfAll;

  /* Bar 数据：当日增值按 emp 聚合 profit(毛利)，降序，全员都列（含 0） */
  const incByEmp = {};
  (meta.employees || []).forEach(n => incByEmp[n] = 0);
  zzDay.forEach(r => { incByEmp[r.emp] = (incByEmp[r.emp]||0) + (isNum(r.profit) ? r.profit : 0); });
  const barItems = Object.keys(incByEmp).map(n => ({ label:n, value:incByEmp[n] })).sort((a,b) => b.value - a.value);

  const hasData = zzDay.length > 0;

  let h = '<div class="sec"><div class="sec-h"><span class="bar"></span><b>今日图表</b><span class="tail">当日增值 · 构成 · 排行</span></div>'
        + '<div class="chart-grid">';
  if(!hasData){
    h += '<div class="cg-card" style="grid-column:1/-1"><div class="empty">今日暂无增值上账数据</div></div>';
    h += '</div></div>';
    return h;
  }
  h +=   '<div class="cg-card"><div class="cg-h">当日增值品类构成</div>'
        +     '<div class="donut-wrap">' + donutSVG(donutItems, 150)
        +       '<div class="donut-center"><b class="num">' + moneyShort(totalPf) + '</b><span>当日增值毛利</span></div>'
        +     '</div>'
        +     '<div class="donut-legend">';
  donutItems.forEach(it => {
    const pct = totalPf ? (it.value / totalPf * 100) : 0;
    h += '<div class="dl-i"><span class="dl-swatch" style="background:' + it.color + '"></span>'
       +   '<span class="dl-t">' + esc(it.label) + '</span>'
       +   '<span class="dl-v num">' + moneyShort(it.value) + '</span>'
       +   '<span class="dl-p num">' + pct.toFixed(0) + '%</span>'
       + '</div>';
  });
  h +=   '</div></div>'
      +   '<div class="cg-card"><div class="cg-h">当日全员增值排行</div>'
      +     '<div class="hb-list">' + hbarSVG(barItems) + '</div>'
      +   '</div>'
      + '</div></div>';
  return h;
}

function renderDay(){
  let h = '<div class="wrap">';
  h += postingBanner();

  /* 今日图表 → 今日品类 → 每日任务：三段平铺，去掉冗余的"全店今日达成"大标题 */
  const dd = DATA.dayDetails || [];

  /* 今日图表：品类毛利占比(Donut) + 全员增值排行(Bar)，独立成节 */
  h += dayChartsHTML(dd, DATA.meta);

  /* 今日品类：统一排序（毛利/手机/增值置顶，其余按毛利降序），大数字=毛利合计 */
  const dayDone = DATA.store.dailyDone || {};
  const MONEY_CATS = ['毛利','手机','PC','平板','穿戴','音频','HD','智慧办公','音频穿戴','增值'];
  const SPECIALS = [['回收','单'],['贴膜','单'],['电信积分','分'],['滞销','台'],['摄影课','课']];
  const PRIORITY = ['毛利','手机','增值'];
  const mkCat = (c) => {
    if(c === '毛利'){
      const mv = isNum(dayDone['毛利']) ? dayDone['毛利'] : 0;
      return { name:'毛利', amt: mv, pf: mv, qty: (dayMetricItems('毛利') || []).length, unit:'单' };
    }
    const items = dayMetricItems(c) || [];
    return { name:c, amt: items.reduce((s,r) => s + (r.amount || 0), 0),
             pf:  items.reduce((s,r) => s + (r.profit || 0), 0),
             qty: items.reduce((s,r) => s + (r.qty || 0), 0),
             unit:'件' };
  };
  let items15 = MONEY_CATS.map(mkCat);
  SPECIALS.forEach(([c,u]) => {
    const its = dayMetricItems(c) || [];
    items15.push({ name:c, amt: isNum(dayDone[c]) ? dayDone[c] : 0,
                   pf: its.reduce((s,r) => s + (r.profit || 0), 0), qty: 0, unit:u });
  });
  items15.sort((a,b) => {
    const ia = PRIORITY.indexOf(a.name), ib = PRIORITY.indexOf(b.name);
    if(ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return b.pf - a.pf;
  });
  const maxV = Math.max.apply(null, items15.map(v => v.pf).concat([1]));

  /* 今日品类 + 每日任务合为一节，用 strip-lab 自然分两段 */
  h += '<div class="sec">';
  h += '<div class="strip-lab">今日品类 · 共' + items15.length + '个 · 毛利合计 ' + moneyShort(isNum(dayDone['毛利']) ? dayDone['毛利'] : 0) + ' · 点柱看当天明细</div><div class="rows">';
  items15.forEach(cv => {
    const pct = cv.pf ? Math.max(cv.pf / maxV * 100, 2) : 0;
    const neg = cv.pf < 0;
    const badge = cv.qty ? cv.qty + cv.unit : cnt(cv.amt) + cv.unit;
    const sub = (cv.name === '毛利')
      ? '<div class="row-g"><span>当日毛利合计</span><em style="font-style:normal">' + (cv.pf ? moneyShort(cv.pf) : '—') + '</em></div>'
      : '<div class="row-g"><span class="' + (neg ? 'stat-low' : '') + '">销 ' + (cv.amt ? moneyShort(cv.amt) : '—') + '</span>'
      + '<em style="font-style:normal">毛利 ' + (cv.pf ? moneyShort(cv.pf) + ' · 毛利率 ' + (cv.amt ? (cv.pf / cv.amt * 100).toFixed(1) + '%' : '—') : '—') + '</em></div>';
    h += '<div class="row pp-click' + (neg ? ' warn' : '') + (cv.pf ? '' : ' zero-row') + '" onclick="toggleDayCat(\'' + esc(cv.name) + '\')">'
      + '<div class="row-t">'
        + '<span class="row-n">' + esc(cv.name) + '</span>'
        + '<span class="row-p r-' + (cv.pf ? (neg ? 'low' : 'good') : 'na') + '">' + badge + '</span>'
        + '<span class="row-v num"><b>' + (cv.pf ? moneyShort(cv.pf) : '—') + '</b></span>'
        + '<span class="chev">' + ic('chev') + '</span>'
      + '</div>'
      + '<div class="cat-chart"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
      + sub
      + '<div class="dcdet-det" data-cat="' + esc(cv.name) + '"></div>'
      + '</div>';
  });
  h += '</div>';

  /* 每日任务：横排网格，点开看当天逐单明细 */
  h += '<div class="strip-lab" style="margin-top:12px">每日任务 · 点开看当天逐单</div>';
  h += dayHTML(DATA.store.dailyDone, DATA.store.dailyGap);
  h += '<div class="day-det"></div>';
  h += '</div>';

  /* 第2层：每人今日（展示所有销售品类） */
  h += '<div class="sec"><div class="sec-h"><span class="bar"></span><b>每人今日</b>'
     + '<span class="tail">全部销售品类</span></div>';
  const DAY_SHOW = ['销额','毛利','手机','PC','平板','穿戴','音频','音频穿戴','智慧办公','HD','增值','会员','回收','贴膜','电信积分','滞销','优享/会员','摄影课','尊享/储值'];
  DATA.meta.employees.forEach(n => {
    const p = DATA.people[n]; if(!p) return;
    const d = p.dailyDone || {};
    const items = DAY_SHOW.filter(k => k in d).map(k => [k, MONEY_KEYS.has(k) ? moneyShort(d[k]) : cnt(d[k])]);
    const allZero = items.every(([k]) => !isNum(d[k]) || d[k] === 0);
    h += '<div class="card" style="padding:11px 12px;margin-bottom:8px'
       + (allZero ? ';border-color:rgba(34,197,94,.22)' : '') + '">'
      + '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">'
        + '<b style="font-size:13px">' + esc(n) + '</b>'
        + (allZero ? '<span style="font-size:10px;color:var(--tx3);background:var(--card2);padding:1px 6px;border-radius:5px;font-weight:600">暂无上账</span>' : '')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">';
    items.forEach(([l,v]) => {
      h += '<div style="text-align:center">'
        + '<div style="font-size:10px;color:var(--tx3)">' + l + '</div>'
        + '<div style="font-size:13.5px;font-weight:700;margin-top:2px" class="num">' + v + '</div></div>';
    });
    h += '</div></div>';
  });
  h += '</div>';

  h += foot();
  h += '</div>';
  return h;
}

  /* ---- 6. 周计划（运营反馈制度） ---- */

  if(WP){
    h += '<div class="sec"><div class="sec-h"><span class="bar"></span><b>运营周计划</b>'
       + '<span class="tail">' + esc(WP.weekLabel||'') + '</span></div>';

      h += '<div class="wp-sec-t">🎯 每周指标 · 每晚11点前反馈</div>';
      h += '<div class="wp-kpis">';

           + '<div class="wp-kpi-n">' + esc(k.name) + (k.star ? ' ⭐' : '') + '</div>'
           + '<div class="wp-kpi-t num">' + esc(k.target) + '</div>'
           + (k.note ? '<div class="wp-kpi-note">' + esc(k.note) + '</div>' : '')
           + '</div>';

    /* 6c. 每日基础运营打卡 */
    const DB = WP.dailyBase || [];
    if(DB.length){
      h += '<div class="wp-sec-t">✅ 基础运营 · 每日打卡</div>';
      h += '<div class="wp-checks">';
      DB.forEach(k => {
        h += '<div class="wp-check"><span class="wp-check-i">' + (k.icon||'•') + '</span>' + esc(k.name) + '</div>';
      });
      h += '</div>';
    }

    /* 6d. 渠道运营分工（周五14:00截止） */
    const CO = WP.channelOps || [];
    if(CO.length){
      h += '<div class="wp-sec-t">📢 渠道运营 · 每周五 14:00 前反馈</div>';

           + '<span class="wp-who-t">' + esc(c.task) + '</span>'

    /* 6e. 按天轮值 */
    const DD = WP.dutyDays || [];
    if(DD.length){
      h += '<div class="wp-sec-t">🗓️ 按天轮值</div>';
      h += '<div class="wp-tab" id="wpTab">';

      });
      h += '</div>';
      DD.forEach((d,i) => {
        h += '<div class="wp-grid" id="wpDay' + i + '" style="display:' + (i===0?'grid':'none') + '">';
        const duties = d.duties || [];

               + '<div class="wp-name' + (t.who==='全员' ? ' all' : '') + '">' + esc(t.who) + '</div>'
               + '<div class="wp-task">' + esc(t.name) + (t.star ? ' ⭐' : '') + '</div>'
               + '</div>';

    /* 6f. 即时零售 + 公共规则 */
    if(WP.instant && WP.instant.who){
      h += '<div class="wp-who"><span class="wp-who-n">' + esc(WP.instant.who) + '</span>'

  h += foot();

  const ring = document.getElementById('tpRing');
  if(ring) ring.innerHTML = tpRingHTML(tp, 66);
  requestAnimationFrame(() => {
    $('#tpFill').style.width = (isNum(tp) ? Math.min(tp,1)*100 : 0).toFixed(1) + '%';

  if(days){

        const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();

/* 时间进度圆环：根据 tp 自动配色做提示警示
   tp<0.5（月初，时间充裕）紫色；0.5~0.75（月半将尽）橙色；>=0.75（接近月末）红色警示 */
function tpLevel(tp){
  if(!isNum(tp)) return {col:'#9aa0bd', level:0};
  if(tp < 0.5)  return {col:'#7c3aed', level:1};   /* 紫：正常 */
  if(tp < 0.75) return {col:'#f59e0b', level:2};   /* 橙：注意 */
  return {col:'#ef4444', level:3};                  /* 红：警示 */
}
function tpRingHTML(tp, size){
  size = size || 60;
  const r = (size - 12) / 2, c = 2 * Math.PI * r;
  const w = isNum(tp) ? Math.min(tp, 1) : 0, off = c * (1 - w);
  const lv = tpLevel(tp);
  const svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="rgba(30,28,60,.08)" stroke-width="9"/>'
    + '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="' + lv.col + '" stroke-width="9" stroke-linecap="round"'
    +   ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"'
    +   ' transform="rotate(-90 ' + (size/2) + ' ' + (size/2) + ')"'
    +   ' style="transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1),stroke 1s"/>'
    + '</svg>';
  const txt = isNum(tp) ? pct(tp, 1) : '—';
  return svg + '<b class="tp-ring-c" style="color:' + lv.col + '">' + txt + '</b>';
}
