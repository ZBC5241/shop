<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华为·李家村万达店 — 业绩考核看板 v7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
:root{--bg:#F2F6FA;--card:#fff;--primary:#7382F0;--primary2:#5A8AFF;--green:#2DB673;--orange:#FF9F43;--red:#EF5350;--gray:#8A94A6;--dark:#26314D;}
body{background:var(--bg);color:#26314D;padding-bottom:60px;}
.hd{background:linear-gradient(135deg,#7382F0,#5A8AFF);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(90,138,255,.25);}
.hd .t{font-size:19px;font-weight:700;letter-spacing:.5px;}
.hd .meta{font-size:11px;opacity:.85;margin-top:4px;}
.seg{display:flex;gap:6px;margin-top:12px;}
.seg button{flex:1;border:none;padding:9px 0;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.seg button.on{background:#fff;color:var(--primary);}
.pick{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0;}
.pick button{border:1px solid #d8dfe9;background:#fff;padding:7px 14px;border-radius:18px;font-size:13px;color:#4a5670;cursor:pointer;transition:.15s;}
.pick button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px;}
.tile{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(31,45,75,.06);margin-bottom:14px;}
.secT{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.secT .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.kcard{background:#f8faff;border-radius:12px;padding:12px;text-align:center;}
.kcard .k{font-size:11px;color:var(--gray);}
.kcard .v{font-size:20px;font-weight:800;color:var(--primary);margin-top:3px;}
.kcard .sub{font-size:11px;color:var(--gray);margin-top:2px;}
.cat{background:#f8faff;border-radius:12px;padding:12px;text-align:center;position:relative;cursor:pointer;transition:.2s;}
.cat:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 4px 14px rgba(90,138,255,.18);}
.cat .n{font-size:12px;color:#4a5670;font-weight:600;}
.cat .ring{position:relative;width:74px;height:74px;margin:8px auto 6px;}
.cat .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
.cat .dv{font-size:11px;color:var(--gray);}
.cat .g{font-size:11px;color:var(--red);font-weight:600;}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13px;}
.alert.danger{background:#fff2f2;color:#c0392b;border:1px solid #ffd5d5;}
.alert.warn{background:#fff7e8;color:#b9761a;border:1px solid #ffe2b0;}
.alert.ok{background:#eafaf1;color:#1e8449;border:1px solid #c6efd8;}
.alert b{font-weight:700;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:#f1f4fb;padding:8px 6px;text-align:center;font-weight:600;color:#4a5670;}
.tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid #eef1f6;color:#4a5670;}
.tbl tr td:first-child{font-weight:700;color:var(--dark);text-align:left;}
.tbl tr:last-child td{border-bottom:none;}
.tbl td.g{color:var(--green);font-weight:700;}
.tbl td.r{color:var(--red);font-weight:700;}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;}
.tag-done{background:var(--green);}
.tag-ahead{background:var(--primary);}
.tag-on{background:#5A8AFF;}
.tag-late{background:var(--orange);}
.tag-bad{background:var(--red);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.emp-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.emp-ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
.emp-ava.bad{background:linear-gradient(135deg,#EF5350,#FF9F43);}
.emp-ava.ok{background:linear-gradient(135deg,#2DB673,#5A8AFF);}
.emp-name{font-size:17px;font-weight:800;}
.emp-tag{font-size:12px;color:var(--gray);margin-top:2px;}
.foot{text-align:center;font-size:11px;color:var(--gray);padding:16px;}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:18px;}
.modal-box h3{font-size:15px;margin-bottom:12px;}
.mbar{height:14px;background:#eef1f6;border-radius:8px;overflow:hidden;margin:4px 0 2px;}
.mbar i{display:block;height:100%;border-radius:8px;transition:.4s;}
.mrow{margin-bottom:10px;}
.mrow .lbl{font-size:12px;color:#4a5670;display:flex;justify-content:space-between;margin-bottom:2px;}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f6;color:#4a5670;margin-left:6px;}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0;}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar .bv{background:linear-gradient(180deg,var(--primary),var(--primary2));width:75%;border-radius:6px 6px 0 0;min-height:3px;}
.bar .bday{font-size:10px;color:#4a5670;margin-top:4px;}
.hint{font-size:11px;color:var(--gray);margin-top:6px;}
.empty{text-align:center;color:var(--gray);padding:20px 0;font-size:13px;}
.small{font-size:11px;color:var(--gray);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
</style>
</head>
<body>
<div class="hd">
  <div class="t">华为·李家村万达店 — 业绩考核看板</div>
  <div class="meta">数据截至 8/8 · 时间进度 <b>25.8%</b> · 版本 v7</div>
  <div class="seg">
    <button id="segEmp" class="on" onclick="go('emp')">👨‍💼 员工视角</button>
    <button id="segShop" onclick="go('shop')">🏪 门店视角</button>
  </div>
</div>

<div class="pick" id="pickBar" style="display:block;">
  <button class="on" data-e="0" onclick="pickEmp(0)">全部</button>
  <button data-e="1" onclick="pickEmp(1)">邵乐乐</button>
  <button data-e="2" onclick="pickEmp(2)">杨丽华</button>
  <button data-e="3" onclick="pickEmp(3)">李泽</button>
  <button data-e="4" onclick="pickEmp(4)">陈超磊</button>
  <button data-e="5" onclick="pickEmp(5)">张博晨</button>
</div>

<div class="wrap">
  <div id="viewEmp"></div>
  <div id="viewShop" style="display:none;"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="foot">纯原生 · 零外部依赖 · 双击即用 · 数据快照 8/9 重制</div>

<script>
// ===== 时间进度 =====
const TP = 0.258;      // 8/8: 25.8%
const AHEAD = TP*1.1;  // 28.4% 超进度
const LOW   = TP*0.5;  // 12.9% 严重落后

function statusOf(rate){
  if(rate==null||isNaN(rate)) return {t:'未分配',c:'late'};
  if(rate>=1) return {t:'已达成',c:'done'};
  if(rate>=AHEAD) return {t:'超进度',c:'ahead'};
  if(rate>=TP*0.9) return {t:'在进度',c:'on'};
  if(rate<LOW) return {t:'严重落后',c:'bad'};
  return {t:'不在进度',c:'late'};
}
// 安全除法：任务为null/0时返回null
function rateOf(done, task){
  if(task==null||task===0||done==null||isNaN(done)) return null;
  return done/task;
}
function tag(st){return '<span class="tag tag-'+st.c+'">'+st.t+'</span>';}
function pct(r){return r==null?'-':(r*100).toFixed(1)+'%';}
function num(v,u){return v==null?'-':Number(v).toLocaleString('zh-CN')+(u||'');}
function C(key){return CATS.find(c=>c.k===key).col;}

// ===== 分类定义（顺序即展示顺序）=====
const CATS=[
 {k:'g',n:'毛利',unit:'',col:'c1'},
 {k:'s',n:'手机',unit:'台',col:'c2'},
 {k:'pc',n:'PC',unit:'台',col:'c3'},
 {k:'pad',n:'平板',unit:'台',col:'c4'},
 {k:'wear',n:'穿戴',unit:'台',col:'c1'},
 {k:'au',n:'音频',unit:'台',col:'c2'},
 {k:'hd',n:'HD',unit:'台',col:'c3'},
 {k:'office',n:'智慧办公',unit:'台',col:'c4'},
 {k:'audio',n:'音频穿戴',unit:'台',col:'c1'},
];
// 门店合计（合计行 R9）
const SHOPD = {
 g:[205000,35371.28], s:[170,37], pc:[14,1], pad:[34,5], wear:[100,37],
 au:[37,3], hd:[2,0], office:[48,6], audio:[137,40]
};
const SHOPKPI = {
 xiao:[1600000,270650.34],
 maoli:[205000,35371.28],
  phone:37,
  dan:167
};
// 员工板块1数据：[任务,完成]
const EMP = {
 sll:{full:'邵乐乐', m:{g:[50000,4840.47],s:[43,9],pc:[3,0],pad:[8,0],wear:[25,21],au:[9,0],hd:[0,0],office:[11,0],audio:[34,0]}},
 ylh:{full:'杨丽华', m:{g:[51000,10267.31],s:[43,10],pc:[3,0],pad:[8,3],wear:[25,5],au:[9,0],hd:[0,0],office:[11,3],audio:[34,5]}},
 lz:{full:'李泽', m:{g:[52000,7988.71],s:[42,8],pc:[4,0],pad:[9,0],wear:[25,6],au:[9,1],hd:[1,0],office:[13,0],audio:[34,6]}},
 ccl:{full:'陈超磊', m:{g:[52000,11316.64],s:[42,10],pc:[4,1],pad:[9,2],wear:[25,5],au:[10,2],hd:[1,0],office:[13,3],audio:[35,7]}},
 zbc:{full:'张博晨', m:{g:[null,958.15],s:[null,null],pc:[null,null],pad:[null,null],wear:[null,null],au:[null,null],hd:[null,null],office:[null,null],audio:[null,null]}}
};
// 板块2 增值/全科生每人：键对应 CATS 之外指标
const VAS = {
 sll:{tel:[150,64],care:0.111,ret:0.333,film:0.167,photo:[1,0],model:[3,0],zeng:[14250,1346.56],star:[1,0,1]},
 ylh:{tel:[150,0],care:0.10,ret:0.40,film:0.944,photo:[1,0],model:[3,0],zeng:[14250,3436.98],star:[1,0,1]},
 lz:{tel:[150,0],care:0.625,ret:0,film:0.50,photo:[1,0],model:[3,0],zeng:[14250,3257.54],star:[3,2,5]},
 ccl:{tel:[150,0],care:0.40,ret:0.30,film:0.778,photo:[1,0],model:[3,0],zeng:[14250,2481.71],star:[2,0,2]},
 zbc:{tel:[null,null],care:0,ret:0,film:0,photo:[null,null],model:[null,null],zeng:[null,958.15],star:[1,0,1]}
};
// 08-09 当日达成（板块3）
const TODAY = {
 sll:{g:0,s:0,z:0,office:0,audio:0,hd:0,care:0,ret:0,film:0,tel:0,stu:0,photo:0,star1:0,star2:0},
 ylh:{g:0,s:0,z:0,office:0,audio:0,hd:0,care:0,ret:0,film:0,tel:0,stu:0,photo:0,star1:0,star2:0},
 lz:{g:0,s:0,z:0,office:0,audio:0,hd:0,care:0,ret:0,film:0,tel:0,stu:0,photo:0,star1:0,star2:0},
 ccl:{g:591.6,s:0,z:63.6,office:1,audio:2,hd:0,care:1,ret:0,film:0,tel:0,stu:0,photo:0,star1:0,star2:0},
 zbc:{g:0,s:0,z:0,office:0,audio:0,hd:0,care:0,ret:0,film:0,tel:0,stu:0,photo:0,star1:0,star2:0}
};
// 每日任务缺口（板块4）
const DAILY = {
 sll:{g:-2258,s:-2,z:-646,office:-1,audio:-1,hd:0,care:-1,ret:1,film:-1,tel:-5,slow:-1,photo:0,star1:1,star2:1},
 ylh:{g:-2037,s:-2,z:-541,office:-1,audio:-2,hd:0,care:-1,ret:1,film:1,tel:-8,slow:-1,photo:0,star1:1,star2:1},
 lz:{g:-2201,s:-2,z:-550,office:-1,audio:-2,hd:-1,care:1,ret:-1,film:0,tel:-8,slow:-1,photo:0,star1:1,star2:1},
 ccl:{g:-2035,s:-2,z:-589,office:-1,audio:-2,hd:-1,care:1,ret:1,film:1,tel:-8,slow:-1,photo:0,star1:1,star2:1},
 zbc:{g:0,s:0,z:0,office:0,audio:0,hd:0,care:0,ret:0,film:0,tel:0,slow:0,photo:0,star1:0,star2:0}
};
const NAMES=['sll','ylh','lz','ccl','zbc'];
let curEmp=0; let curView='emp';

function go(v){curView=v;document.getElementById('segEmp').classList.toggle('on',v==='emp');document.getElementById('segShop').classList.toggle('on',v==='shop');document.getElementById('viewEmp').style.display=v==='emp'?'block':'none';document.getElementById('viewShop').style.display=v==='shop'?'block':'none';document.getElementById('pickBar').style.display=v==='emp'?'block':'none';if(v==='emp')renderEmp();else renderShop();}
function pickEmp(i){curEmp=i;document.querySelectorAll('#pickBar button').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.e)===i));renderEmp();}

// ==================== 通用组件 ====================
function ringHtml(rate, st){
  const r = rate==null?0:Math.min(rate,1);
  const circ = 2*Math.PI*33;
  const col = st.c==='done'?'#2DB673':st.c==='ahead'?'#7382F0':st.c==='on'?'#5A8AFF':st.c==='bad'?'#EF5350':'#FF9F43';
  return '<div class="ring">'
    +'<svg width="74" height="74"><circle cx="37" cy="37" r="33" fill="none" stroke="#e8ecf5" stroke-width="8"/>'
    +'<circle cx="37" cy="37" r="33" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-r))+'" transform="rotate(-90 37 37)"/></svg>'
    +'<div class="pct" style="color:'+col+'">'+pct(rate)+'</div></div>';
}
function kcard(k, v, sub){return '<div class="kcard"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="sub">'+sub+'</div></div>';}
function catCard(n, unit, t, d, rate, col){
  const st=statusOf(rate);
  const gap = t - d;
  return '<div class="cat" onclick="catModal(\''+n+'\','+rate+','+t+','+d+','+(unit||'')+')">'
    +'<div class="n">'+n+'</div>'
    +ringHtml(rate, st)
    +'<div class="dv">任务 '+num(t,unit)+' · 完成 '+num(d,unit)+'</div>'
    +'<div class="g" style="color:'+(gap>0?'var(--red)':'var(--green)')+'">缺口 '+num(Math.abs(gap),unit)+'</div>'
    +tag(st)
    +'</div>';
}
function fmt(x){return x==null?'-':Number(x).toLocaleString('zh-CN');}

// ==================== 门店视角 ====================
function renderShop(){
  const em = document.getElementById('viewShop');
  const timeSt = statusOf(TP);
  const maoliR = SHOPD.g[1]/SHOPD.g[0];
  const xiaoR = SHOPKPI.xiao[1]/SHOPKPI.xiao[0];
  let h='';
  // KPI
  h+='<div class="tile"><div class="secT"><span class="dot"></span>门店整体 KPI</div><div class="kpi">'
    +kcard('累计销额', num(SHOPKPI.xiao[1]), '目标 '+num(SHOPKPI.xiao[0])+' · 完成率 '+pct(xiaoR))
    +kcard('累计毛利', num(SHOPKPI.maoli[1]), '目标 '+num(SHOPKPI.maoli[0])+' · 完成率 '+pct(maoliR))
    +kcard('手机销量', num(SHOPKPI.phone)+'台', '目标 '+num(SHOPD.s[0])+'台 · 完成率 '+pct(SHOPD.s[1]/SHOPD.s[0]))
    +kcard('出库单数', num(SHOPKPI.dan)+'单', '时间进度 '+pct(TP)+tag(statusOf(TP)))
    +'</div></div>';
  // 店长分析
  h+='<div class="tile"><div class="secT"><span class="dot"></span>店长分析（门店销售问题）</div>';
  const lateCats = CATS.filter(c=>{const d=SHOPD[c.k][1],t=SHOPD[c.k][0]; return t>0&&statusOf(d/t).c==='bad';});
  if(lateCats.length) h+='<div class="alert danger"><b>严重落后品类：</b>'+lateCats.map(c=>c.n).join('、')+'，完成率不足 13%，需重点关注</div>';
  h+='<div class="alert warn"><b>毛利缺口：</b>累计毛利 '+num(SHOPKPI.maoli[1])+'，缺口 '+num(Math.abs(SHOPKPI.maoli[0]-SHOPKPI.maoli[1]))+'，完成率仅 '+pct(maoliR)+'，距时间进度还有差距</div>';
  h+='<div class="alert warn"><b>销额承压：</b>累计销额 '+num(SHOPKPI.xiao[1])+'，完成率 '+pct(xiaoR)+'，低于时间进度</div>';
  // 极低毛利员工
  const slowEmp = NAMES.filter(k=>{const r=rateOf(EMP[k].m.g[1],EMP[k].m.g[0]); return r!=null&&r<LOW;}).map(k=>EMP[k].full);
  h+='<div class="alert warn"><b>毛利严重落后：</b>'+(slowEmp.length?slowEmp.join('、')+' 毛利完成率不足 13%':'暂无')+'</div>';
  h+='</div>';
  // 品类达成（门店级6卡+全9卡）
  h+='<div class="tile"><div class="secT"><span class="dot"></span>品类达成（门店级）</div><div class="grid">';
  CATS.forEach(c=>{const r=SHOPD[c.k][1]/SHOPD[c.k][0]; h+=catCard(c.n, c.unit, SHOPD[c.k][0], SHOPD[c.k][1], r, c.col);});
  h+='</div></div>';
  // 全科生/增值（门店级）
  h+='<div class="tile"><div class="secT"><span class="dot"></span>全科生 / 增值 / 考核项（门店级）</div><div class="grid">';
  const svas = [
    {n:'电信积分', t:600, d:64, u:'', r:0.107, col:'c2'},
    {n:'Care+搭售率', t:null, d:null, u:'', r:0.324, col:'c3'},
    {n:'回收搭售率', t:null, d:null, u:'', r:0.297, col:'c4'},
    {n:'贴膜率', t:null, d:null, u:'', r:0.5375, col:'c1'},
    {n:'摄影课', t:4, d:4, u:'节', r:1, col:'c2'},
    {n:'考核机型', t:12, d:2, u:'台', r:0.167, col:'c3'},
    {n:'乐回收', t:null, d:1177, u:'单', r:null, col:'c4'},
    {n:'太力回收', t:null, d:983, u:'元', r:null, col:'c1'},
    {n:'增值', t:57000, d:11480.94, u:'', r:0.201, col:'c2'},
  ];
  svas.forEach(v=>{h+='<div class="cat" style="background:#f8faff">'
    +'<div class="n">'+v.n+'</div>'
    +'<div class="ring"><div class="pct">'+pct(v.r)+'</div></div>'
    +(v.t!=null?'<div class="dv">任务 '+num(v.t)+' · 完成 '+num(v.d)+'</div>':'<div class="dv">'+num(v.d)+'</div>')
    +'</div>';});
  h+='</div></div>';
  // 每日达成全览（板块3）
  h+='<div class="tile"><div class="secT"><span class="dot"></span>08-09 当日达成全览</div><table class="tbl"><tr><th>姓名</th><th>毛利</th><th>手机</th><th>增值</th><th>办公</th><th>音频</th><th>HD</th><th>Care+</th></tr>';
  NAMES.forEach(n=>{const t=TODAY[n]; h+='<tr><td>'+EMP[n].full+'</td><td class="'+(t.g?'g':'')+'">'+t.g+'</td><td>'+t.s+'</td><td>'+t.z+'</td><td>'+t.office+'</td><td>'+t.audio+'</td><td>'+t.hd+'</td><td>'+t.care+'</td></tr>';});
  h+='</table></div>';
  // 员工速览
  h+='<div class="tile"><div class="secT"><span class="dot"></span>员工速览</div><div class="grid">';
  NAMES.forEach(n=>{const m=EMP[n].m; const st=statusOf(rateOf(m.g[1],m.g[0]));
    h+='<div class="cat" onclick="empModal(\''+n+'\')"><div class="n">'+EMP[n].full+'</div>'
    +ringHtml(rateOf(m.g[1],m.g[0]), st)
    +'<div class="dv">毛利 '+num(m.g[1])+' / '+num(m.g[0])+'</div>'+tag(st)+'</div>';});
  h+='</div></div>';
  em.innerHTML=h;
}

// ==================== 员工视角 ====================
function renderEmp(){
  const em=document.getElementById('viewEmp');
  if(curEmp===0){renderEmpAll();return;}
  const k=NAMES[curEmp-1];
  const m=EMP[k].m;
  const v=VAS[k];
  const td=TODAY[k];
  const dl=DAILY[k];
  const mr = rateOf(m.g[1],m.g[0]);
  const avaCls = mr!=null&&mr<LOW?'bad':(mr!=null&&mr>=TP*0.9?'ok':'');
  let h='';
  h+='<div class="tile"><div class="emp-head"><div class="emp-ava '+avaCls+'">'+EMP[k].full[0]+'</div><div><div class="emp-name">'+EMP[k].full+' 的看板</div><div class="emp-tag">'+tag(statusOf(rateOf(m.g[1],m.g[0])))+' · 毛利完成率 '+pct(rateOf(m.g[1],m.g[0]))+'</div></div></div></div>';
  // 今日必做
  h+='<div class="tile"><div class="secT"><span class="dot"></span>今日必做（今日任务缺口）</div>';
  const dls=[
    ['手机',dl.s],['毛利',dl.g],['增值',dl.z],['智慧办公',dl.office],['音频穿戴',dl.audio],['HD',dl.hd],['Care+',dl.care],['回收',dl.ret],['贴膜',dl.film],['电信积分',dl.tel],['滞销',dl.slow]
  ];
  dls.forEach(d=>{if(d[1]&&d[1]<0)h+='<div class="alert danger"><b>'+d[0]+'：</b>今日还差 '+num(Math.abs(d[1]))+'</div>';else if(d[1]&&d[1]>0)h+='<div class="alert ok"><b>'+d[0]+'：</b>今日已完成 '+num(d[1])+'</div>';});
  if(!dls.some(d=>d[1]<0))h+='<div class="alert ok"><b>今日任务全部达成 ✔</b></div>';
  h+='</div>';
  // 业绩考核达成
  h+='<div class="tile"><div class="secT"><span class="dot"></span>业绩考核达成</div><div class="grid">';
  CATS.forEach(c=>{const [t,d]=m[c.k]; if(t==null||t<=0)return; const r=d/t;
    h+='<div class="cat"><div class="n">'+c.n+'</div>'+ringHtml(r,statusOf(r))+'<div class="dv">'+fmt(d)+'/'+fmt(t)+'</div>'
      +'<div class="g" style="color:'+(d<t?'var(--red)':'var(--green)')+'">'+(d<t?'缺 '+num(t-d):'超 '+num(d-t))+'</div>'+tag(statusOf(r))+'</div>';});
  h+='</div></div>';
  // 全科生/增值
  h+='<div class="tile"><div class="secT"><span class="dot"></span>全科生 · 增值 · 考核项</div><div class="grid">';
  // 任务/完成型
  const vasC=[
    ['电信积分',v.tel[0],v.tel[1]],['摄影课',v.photo[0],v.photo[1]],['考核机型',v.model[0],v.model[1]],['增值',v.zeng[0],v.zeng[1]]
  ];
  vasC.forEach(x=>{
    const [n,t,d]=x;
    if(t==null){h+='<div class="cat"><div class="n">'+n+'</div>'+ringHtml(0,{t:'未分配',c:'late'})+'<div class="dv">完成 '+num(d)+'</div>'+tag({t:'未分配',c:'late'})+'</div>';return;}
    const rr = (t&&t>0)? d/t : 0;
    const st=statusOf(rr);
    h+='<div class="cat"><div class="n">'+n+'</div>'+ringHtml(rr,st)+'<div class="dv">'+(t>0? num(d)+'/'+num(t):'-')+'</div>'+tag(st)+'</div>';
  });
  // 搭售率型（显示实际比率，不套完成率状态）
  const vasR=[['Care+搭售率',v.care],['回收率',v.ret],['贴膜率',v.film],['星联会员',v.star[2]?1:0]];
  vasR.forEach(x=>{
    const [n,rr]=x;
    h+='<div class="cat"><div class="n">'+n+'</div>'+ringHtml(rr,statusOf(rr))+'<div class="dv">'+pct(rr)+'</div>'+tag(statusOf(rr))+'</div>';
  });
  h+='</div></div>';
  // 今日达成
  h+='<div class="tile"><div class="secT"><span class="dot"></span>今日达成（08-09）</div><table class="tbl"><tr><th>毛利</th><th>手机</th><th>增值</th><th>办公</th><th>音频</th><th>HD</th><th>Care+</th><th>会员</th></tr>'
    +'<tr><td>'+td.g+'</td><td>'+td.s+'</td><td>'+td.z+'</td><td>'+td.office+'</td><td>'+td.audio+'</td><td>'+td.hd+'</td><td>'+td.care+'</td><td>'+td.star1+'</td></tr></table></div>';
  em.innerHTML=h;
}
function renderEmpAll(){
  const em=document.getElementById('viewEmp');
  let h='<div class="tile"><div class="secT"><span class="dot"></span>全员速览 · 点击查看个人详情</div><div class="grid">';
  NAMES.forEach(n=>{const m=EMP[n].m; const r=rateOf(m.g[1],m.g[0]); const st=statusOf(r);
    h+='<div class="cat" onclick="pickEmp('+(NAMES.indexOf(n)+1)+')"><div class="n">'+EMP[n].full+'</div>'+ringHtml(r,st)+'<div class="dv">毛利 '+fmt(m.g[1])+'</div>'+tag(st)+'</div>';});
  h+='</div></div>';
  em.innerHTML=h;
}

// ==================== 模态框 ====================
function catModal(n, rate, task, done, unit){
  const st=statusOf(rate); const col=st.c==='done'?'#2DB673':st.c==='ahead'?'#7382F0':st.c==='on'?'#5A8AFF':st.c==='bad'?'#EF5350':'#FF9F43';
  document.getElementById('modalBox').innerHTML='<h3>'+n+' <span class="tag tag-'+st.c+'">'+st.t+'</span></h3>'
    +'<div class="mrow"><div class="lbl"><span>任务</span><b>'+num(task,unit)+'</b></div></div>'
    +'<div class="mrow"><div class="lbl"><span>完成</span><b>'+num(done,unit)+'</b></div></div>'
    +'<div class="mrow"><div class="lbl"><span>完成率</span><b style="color:'+col+'">'+pct(rate)+'</b></div><div class="mbar"><i style="width:'+(rate*100)+'%;background:'+col+'"></i></div></div>'
    +'<div class="mrow"><div class="lbl"><span>缺口</span><b style="color:var(--red)">'+num(Math.abs(task-done),unit)+'</b></div></div>'
    +'<p class="hint">判定基准：时间进度 '+pct(TP)+'</p>';
  document.getElementById('modal').classList.add('show');
}
function catModalX(){}
function catModalEmpty(){}
function closeModal(){document.getElementById('modal').classList.remove('show');}
go('emp');
</script>
