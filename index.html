<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>李家村万达华为 · 8月业绩看板</title>
<style>
:root{
  --bg-deep:#0B1120;--bg-card:rgba(15,23,42,.85);--bg-nav:rgba(15,23,42,.75);
  --glass-border:rgba(148,163,184,.08);--glass-border-h:rgba(148,163,184,.15);
  --text:#F1F5F9;--text-sub:#94A3B8;--text-dim:#64748B;
  --blue:#3B82F6;--blue-l:rgba(59,130,246,.15);
  --purple:#8B5CF6;--purple-l:rgba(139,92,246,.15);
  --green:#10B981;--green-l:rgba(16,185,129,.15);
  --orange:#F59E0B;--orange-l:rgba(245,158,11,.15);
  --red:#EF4444;--red-l:rgba(239,68,68,.15);
  --cyan:#06B6D4;--cyan-l:rgba(6,182,212,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-deep);color:var(--text);line-height:1.5;overflow-x:hidden}

/* Ambient background */
.scene-bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(59,130,246,.06),transparent),
  radial-gradient(ellipse 50% 60% at 80% 70%,rgba(139,92,246,.05),transparent),
  radial-gradient(ellipse 40% 40% at 50% 50%,rgba(6,182,212,.03),transparent),
  linear-gradient(135deg,#0B1120 0%,#0F172A 40%,#111827 100%);
  animation:ambientShift 30s ease-in-out infinite alternate}
@keyframes ambientShift{0%{filter:brightness(1)}50%{filter:brightness(1.05)}100%{filter:brightness(1)}}

/* Header with glass */
.header{background:var(--bg-nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);color:var(--text);padding:20px 24px 16px;
  position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:800;letter-spacing:.5px}
.header .sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.hdr-pct{font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pbar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:10px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#3B82F6,#8B5CF6,#06B6D4)}
.pbar-meta{display:flex;justify-content:space-between;font-size:10px;margin-top:3px;color:var(--text-dim)}

/* Nav tabs */
.nav{display:flex;gap:6px;padding:14px 24px 0;background:transparent;position:sticky;top:76px;z-index:99}
.nav button{border:none;background:rgba(255,255,255,.04);color:var(--text-dim);padding:8px 20px;
  border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid transparent;border-bottom:2px solid transparent;
  transition:all .25s cubic-bezier(.4,0,.2,1)}
.nav button:hover{background:rgba(255,255,255,.08);color:var(--text);transform:translateY(-1px)}
.nav button.active{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(139,92,246,.2));
  color:#fff;border-color:var(--glass-border-h);
  box-shadow:0 4px 16px rgba(59,130,246,.15),inset 0 1px 0 rgba(255,255,255,.05)}

.main{padding:0 24px 40px}
.tab{display:none;animation:fadeUp .4s ease}
.tab.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Glass Card */
.card{background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:14px;padding:18px;margin-bottom:14px;
  border:1px solid var(--glass-border);
  box-shadow:0 8px 32px -8px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
  transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card:hover{border-color:var(--glass-border-h);
  box-shadow:0 16px 40px -12px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:12px;padding:14px;border:1px solid var(--glass-border);
  position:relative;overflow:hidden;transition:all .3s;cursor:default}
.kpi:hover{transform:translateY(-3px);border-color:var(--glass-border-h);
  box-shadow:0 12px 24px -8px rgba(0,0,0,.4)}
.kpi-label{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.kpi-val{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.kpi-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.kpi.blue .kpi-val{color:#60A5FA}.kpi.purple .kpi-val{color:#A78BFA}
.kpi.green .kpi-val{color:#34D399}.kpi.orange .kpi-val{color:#FBBF24}
.kpi.red .kpi-val{color:#F87171}

/* Person card */
.person{background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:14px;padding:16px 18px;margin-bottom:12px;
  border:1px solid var(--glass-border);position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.4,0,.2,1)}
.person::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:0 3px 3px 0}
.person.r1::before{background:linear-gradient(180deg,#10B981,#34D399)}
.person.r2::before{background:linear-gradient(180deg,#3B82F6,#60A5FA)}
.person.r3::before{background:linear-gradient(180deg,#F59E0B,#FBBF24)}
.person.r4::before{background:linear-gradient(180deg,#64748B,#94A3B8)}
.person:hover{transform:translateY(-3px);border-color:var(--glass-border-h);
  box-shadow:0 12px 32px -8px rgba(0,0,0,.4),-3px 0 16px rgba(59,130,246,.06)}
.person-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.person-name{font-size:15px;font-weight:700;color:var(--text)}
.person-score{font-size:24px;font-weight:900;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.warn{background:linear-gradient(135deg,#F59E0B,#FB923C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.danger{background:linear-gradient(135deg,#EF4444,#F87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.person-score.good{background:linear-gradient(135deg,#10B981,#34D399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Metric bar */
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.m-label{width:60px;color:var(--text-dim);flex-shrink:0;font-weight:500}
.m-bar{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;position:relative}
.m-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.m-fill.blue{background:linear-gradient(90deg,#3B82F6,#60A5FA)}
.m-fill.green{background:linear-gradient(90deg,#10B981,#34D399)}
.m-fill.orange{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.m-fill.red{background:linear-gradient(90deg,#EF4444,#F87171)}
.m-fill.purple{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.m-val{width:70px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--text)}

/* Drill down */
.drill{background:rgba(0,0,0,.2);border-radius:10px;margin-top:10px;
  max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease;padding:0 12px;
  border:1px solid transparent}
.drill.open{max-height:2000px;padding:12px;overflow-y:auto;border-color:var(--glass-border)}
.drill-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#60A5FA;cursor:pointer}
.drill-cat{margin-bottom:8px}
.drill-cat-title{font-size:12px;font-weight:700;color:#A78BFA;margin-bottom:4px}
.drill-item{display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;font-size:11px;border-bottom:1px dashed rgba(255,255,255,.05)}
.drill-item:last-child{border:none}
.drill-sub{font-size:10px;color:var(--text-dim);margin-left:4px}

/* Channel table */
.ch-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ch-table th{background:rgba(255,255,255,.04);padding:10px 12px;text-align:left;font-weight:700;
  color:var(--text-sub);border-bottom:1px solid var(--glass-border)}
.ch-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text)}
.ch-table tr:hover td{background:rgba(59,130,246,.06)}
.ch-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Perf */
.perf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.perf-card{background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:14px;padding:16px;border:1px solid var(--glass-border);
  transition:all .3s cubic-bezier(.4,0,.2,1)}
.perf-card:hover{transform:translateY(-3px);border-color:var(--glass-border-h);
  box-shadow:0 16px 32px -8px rgba(0,0,0,.4)}
.perf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.perf-name{font-size:15px;font-weight:800;color:var(--text)}
.perf-score{font-size:28px;font-weight:900;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.perf-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}
.perf-row .l{width:70px;color:var(--text-dim)}.perf-row .v{width:60px;text-align:right;font-weight:700;color:var(--text)}
.perf-row .t{width:50px;text-align:right;color:var(--text-dim);font-size:10px}
.perf-row .bar{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.perf-row .fill{height:100%;border-radius:3px;transition:width .5s}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.35)}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  var avgScore = perfScores.length > 0 ? totalPerfScore / perfScores.length : 0;

    var metrics = [];
    if(d.cats){
      var phoneGP = 0, vasGP = 0, carrierAmt = 0, wearGP = 0;
      for(var k in d.cats){
        if(k.indexOf('手机')>=0) phoneGP += d.cats[k].profit;
        if(k.indexOf('增值')>=0) vasGP += d.cats[k].profit;
        if(k.indexOf('运营商')>=0) carrierAmt += d.cats[k].amount;
        if(k.indexOf('穿戴')>=0) wearGP += d.cats[k].profit;
      }
      metrics.push({label:'手机毛利',val:phoneGP,target:2500,max:3000});
      metrics.push({label:'增值服务',val:vasGP,target:2000,max:3000});
      metrics.push({label:'运营商',val:carrierAmt,target:200,max:300});
      metrics.push({label:'穿戴毛利',val:wearGP,target:500,max:1000});
      metrics.push({label:'总毛利',val:d.profit,target:2500,max:5000});
    }
    var scoreColor = item.score>=80?'#10B981':item.score>=60?'#3B82F6':item.score>=40?'#F59E0B':'#EF4444';
    var html = '<div class="perf-card">';
    html += '<div class="perf-header"><div class="perf-name">#'+(idx+1)+' '+item.name+'</div>';
    html += '<div class="perf-score" style="background:linear-gradient(135deg,'+scoreColor+',#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+item.score.toFixed(1)+'</div></div>';
    metrics.forEach(function(m){
      var p = m.target>0 ? Math.min(m.val/m.target*100,100) : 0;
      var barP = m.max>0 ? Math.min(m.val/m.max*100,100) : 0;
      var c = p>=100?'#10B981':p>=70?'#3B82F6':p>=40?'#F59E0B':'#EF4444';
      html += '<div class="perf-row"><div class="l">'+m.label+'</div>';
      html += '<div class="bar"><div class="fill" style="width:'+barP+'%;background:'+c+'"></div></div>';
      html += '<div class="v" style="color:'+c+'">\u00A5'+m.val.toFixed(0)+'</div>';
      html += '<div class="t">/\u00A5'+m.target+'</div></div>';
    });
    html += '</div>';
    perfGrid.innerHTML += html;
  });
})();

// === Tab 4: Task Target Progress ===
(function(){
  var kpiEl = document.getElementById('targetKpi');
  var tblEl = document.getElementById('targetTable');

  // KPI cards
  var totalTargetGP = 0, totalDoneGP = 0, totalTargetPhone = 0, totalDonePhone = 0;
  MAIN_EMP.forEach(function(n){ var d = TASK_DATA[n]; totalTargetGP += d.t_gp; totalDoneGP += d.d_gp; totalTargetPhone += d.t_phone; totalDonePhone += d.d_phone; });
  var overallPct = (totalDoneGP / totalTargetGP * 100).toFixed(1);
  kpiEl.innerHTML = '<div class="kpi red"><div class="kpi-label">时间进度</div><div class="kpi-val">23%</div><div class="kpi-sub">8/31天</div></div>';
  kpiEl.innerHTML += '<div class="kpi purple"><div class="kpi-label">毛利总达成</div><div class="kpi-val">' + overallPct + '%</div><div class="kpi-sub">\u00A5' + totalDoneGP.toFixed(0) + '/\u00A5' + totalTargetGP + '</div></div>';
  kpiEl.innerHTML += '<div class="kpi blue"><div class="kpi-label">手机总完成</div><div class="kpi-val">' + totalDonePhone + '/' + totalTargetPhone + '</div><div class="kpi-sub">' + (totalDonePhone/totalTargetPhone*100).toFixed(0) + '%</div></div>';
  kpiEl.innerHTML += '<div class="kpi orange"><div class="kpi-label">PC总完成</div><div class="kpi-val">1/14</div><div class="kpi-sub">7%</div></div>';

  // Define task dimensions: [key, label, isCurrency]
  var dims = [
    ['gp', '毛利（35分）', true],
    ['phone', '手机（15分）', false],
    ['pc', 'PC', false],
    ['tab', '平板', false],
    ['wear', '穿戴', false],
    ['audio', '音频', false],
    ['vas', '增值服务', true]
  ];

  // Build table
  var html = '<thead>';
  // Row 1: top header
  html += '<tr><th rowspan="2" style="text-align:center;min-width:60px">姓名</th>';
  dims.forEach(function(d) {
    html += '<th colspan="4" style="text-align:center;border-left:1px solid var(--glass-border)">' + d[1] + '</th>';
  });
  html += '</tr>';
  // Row 2: sub headers
  html += '<tr>';
  dims.forEach(function(d, i) {
    var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';
    html += '<th style="' + border + '">任务</th><th>完成</th><th>缺口</th><th>完成率</th>';
  });
  html += '</tr></thead><tbody>';

  // Data rows
  MAIN_EMP.forEach(function(name) {
    var td = TASK_DATA[name];
    html += '<tr><td style="font-weight:800;color:var(--text)">' + name + '</td>';
    dims.forEach(function(d, i) {
      var key = d[0];
      var isC = d[2];
      var target = td['t_' + key];
      var done = td['d_' + key];
      var gap = done - target;
      var pct = target > 0 ? (done / target * 100) : 0;

      var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';
      var fmt = function(v) { return isC ? '\u00A5' + v.toFixed(0) : v; };

      // Color for gap and pct
      var pctColor = pct >= 80 ? '#10B981' : pct >= 50 ? '#F59E0B' : '#EF4444';
      var gapColor = gap >= 0 ? '#10B981' : '#EF4444';

      html += '<td class="num" style="' + border + 'color:var(--text-sub)">' + fmt(target) + '</td>';
      html += '<td class="num" style="font-weight:700;color:var(--text)">' + fmt(done) + '</td>';
      html += '<td class="num" style="color:' + gapColor + '">' + (gap >= 0 ? '+' : '') + fmt(gap) + '</td>';
      html += '<td class="num" style="color:' + pctColor + ';font-weight:700">' + pct.toFixed(0) + '%</td>';
    });
    html += '</tr>';
  });

  // Totals row
  html += '<tr style="background:rgba(255,255,255,.03);font-weight:800"><td style="color:var(--text-sub)">合计</td>';
  dims.forEach(function(d, i) {
    var key = d[0];
    var isC = d[2];
    var tTotal = 0, dTotal = 0;
    MAIN_EMP.forEach(function(n) { tTotal += TASK_DATA[n]['t_' + key]; dTotal += TASK_DATA[n]['d_' + key]; });
    var gap = dTotal - tTotal;
    var pct = tTotal > 0 ? (dTotal / tTotal * 100) : 0;
    var fmt = function(v) { return isC ? '\u00A5' + v.toFixed(0) : v; };
    var pctColor = pct >= 80 ? '#10B981' : pct >= 50 ? '#F59E0B' : '#EF4444';
    var gapColor = gap >= 0 ? '#10B981' : '#EF4444';
    var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';

    html += '<td class="num" style="' + border + 'color:var(--text-sub)">' + fmt(tTotal) + '</td>';
    html += '<td class="num" style="color:var(--text)">' + fmt(dTotal) + '</td>';
    html += '<td class="num" style="color:' + gapColor + '">' + (gap >= 0 ? '+' : '') + fmt(gap) + '</td>';
    html += '<td class="num" style="color:' + pctColor + '">' + pct.toFixed(0) + '%</td>';
  });
  html += '</tr></tbody>';

  tblEl.innerHTML = html;

  // === 全科生板块表（仅实际完成，无任务指标） ===
  var qksEl = document.getElementById('qksTable');
  var qcols = [
    ['telecom', '电信业务', '单'],
    ['film', '贴膜', '单'],
    ['recycle', '回收', '单'],
    ['member', '会员', ''],
    ['care', 'Care+', '']
  ];
  var qhtml = '<thead><tr><th rowspan="2" style="text-align:center;min-width:60px">姓名</th>';
  qcols.forEach(function(c) { qhtml += '<th colspan="2" style="text-align:center;border-left:1px solid var(--glass-border)">' + c[1] + '（' + c[2] + '）</th>'; });
  qhtml += '</tr><tr>';
  qcols.forEach(function(c, i) {
    var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';
    qhtml += '<th style="' + border + '">完成</th><th>完成率</th>';
  });
  qhtml += '</tr></thead><tbody>';
  var qksTotals = {};
  qcols.forEach(function(c) { qksTotals[c[0]] = 0; });
  var qksCounts = {};
  qcols.forEach(function(c) { qksCounts[c[0]] = 0; });

  MAIN_EMP.forEach(function(name) {
    var qd = QKS_DATA[name] || {};
    qhtml += '<tr><td style="font-weight:800;color:var(--text)">' + name + '</td>';
    qcols.forEach(function(c, i) {
      var v = qd[c[0]];
      var isNum = typeof v === 'number';
      var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';
      if (isNum) {
        qksTotals[c[0]] += v;
        qksCounts[c[0]]++;
      }
      var valTxt = isNum ? v : (v === '-' ? '<span style="color:var(--text-dim)">--</span>' : v);
      // 全科生无任务，完成率显示"--"
      qhtml += '<td class="num" style="' + border + 'font-weight:700;color:var(--text)">' + valTxt + '</td>';
      qhtml += '<td class="num" style="color:var(--text-dim)">--</td>';
    });
    qhtml += '</tr>';
  });

  // 合计行：仅统计有数值的维度
  qhtml += '<tr style="background:rgba(255,255,255,.03);font-weight:800"><td style="color:var(--text-sub)">合计</td>';
  qcols.forEach(function(c, i) {
    var border = i > 0 ? 'border-left:1px solid var(--glass-border);' : '';
    var showTotal = qksCounts[c[0]] > 0;
    qhtml += '<td class="num" style="' + border + 'color:#60A5FA">' + (showTotal ? qksTotals[c[0]] : '--') + '</td>';
    qhtml += '<td class="num" style="color:var(--text-dim)">--</td>';
  });
  qhtml += '</tr></tbody>';
  qksEl.innerHTML = qhtml;
})();
</script>
